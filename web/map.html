<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ماذا حدث للفلوس؟</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/app.css"/>
<script src="config.js"></script>
<script src="https://unpkg.com/lightweight-charts@4.2.1/dist/lightweight-charts.standalone.production.js"></script>
<style>
body{display:grid;grid-template-rows:64px auto 1fr auto}
#chart{min-height:480px;direction:ltr}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:12px 18px;border-top:1px solid var(--line)}
@media(max-width:800px){.cards{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header class="site-header"><div class="wrap">
  <div class="logo">خريطة الفلوس<span>ماذا حدث لـ 1,000 جنيه؟</span></div>
  <nav>
    <a href="./index.html">البداية</a>
    <a class="active" href="./map.html">ماذا حدث للفلوس؟</a>
    <a href="./funds.html">الصناديق</a>
    <a href="./categories.html">خريطة الفئات</a>
    <a href="./macro.html">الاقتصاد</a>
  </nav>
</div></header>
<div class="controls">
  <span class="muted">نعرض أربعة مسارات فقط على مقياس واحد (أساس 100) حتى تُقرأ القصة.</span>
  <input id="amount" type="number" value="1000"/>
  <input id="start" type="date" value="2016-01-04"/>
  <button class="primary" id="run">حدّث</button>
</div>
<div id="chart"></div>
<div class="cards" id="cards"></div>
<script type="module">
import { PATHS, fmt, en, toLine, rebase } from "./js/engine.js";
import { loadEngine } from "./js/live.js";
const SHOW=["purchasing","usd_egp_mid","gold_egp_oz","egx30_close"];
const packed=await loadEngine();
const DATA={series:packed.series};
const el=document.getElementById("chart");
const chart=LightweightCharts.createChart(el,{
  layout:{background:{color:"#0a0e12"},textColor:"#8b95a5",fontFamily:"IBM Plex Sans"},
  grid:{vertLines:{color:"#1c2430"},horzLines:{color:"#1c2430"}},
  rightPriceScale:{borderColor:"#273140"},
  timeScale:{borderColor:"#273140"}
});
new ResizeObserver(()=>chart.applyOptions({width:el.clientWidth,height:el.clientHeight||480})).observe(el);
let series={};
function draw(){
  const amount=+document.getElementById("amount").value||1000;
  const start=document.getElementById("start").value;
  Object.values(series).forEach(s=>chart.removeSeries(s)); series={};
  const cards=[];
  SHOW.forEach(key=>{
    const raw=toLine(DATA.series,start,amount,key);
    if(!raw.length) return;
    const line=rebase(raw);
    const s=chart.addLineSeries({color:PATHS[key].color,lineWidth:2.4,priceLineVisible:false});
    s.setData(line); series[key]=s;
    const last=raw.at(-1).value;
    const chg=(line.at(-1).value-100);
    cards.push(`<div class="card"><div class="kicker">${PATHS[key].name}</div>
      <h3 class="num">${fmt(last)} ج.م</h3>
      <p class="${chg>=0?"up":"dn"}">${chg>=0?"+":""}${en(chg,1)}٪ منذ ${start}</p></div>`);
  });
  chart.timeScale().fitContent();
  document.getElementById("cards").innerHTML=cards.join("");
}
document.getElementById("run").onclick=draw;
chart.applyOptions({width:el.clientWidth,height:480});
draw();
</script>
</body></html>
