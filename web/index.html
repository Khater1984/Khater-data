<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>خريطة الفلوس</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@500;600&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/lightweight-charts@4.2.1/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#0f1412;--card:#171e1b;--line:#2c3832;--text:#eef3ef;--mute:#8fa198;--good:#5ecf8a;--bad:#e07a6e;--acc:#c9a45c}
*{box-sizing:border-box} html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:"IBM Plex Sans Arabic",sans-serif}
body{display:grid;grid-template-rows:auto auto 1fr}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-bottom:1px solid var(--line)}
.brand{font-weight:700} .brand small{display:block;color:var(--mute);font-weight:400;font-size:12px}
nav a{color:var(--acc);margin-inline-start:16px;text-decoration:none;font-size:14px}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:end;padding:12px 22px;border-bottom:1px solid var(--line);background:#141a18}
label{display:block;font-size:11px;color:var(--mute);margin-bottom:4px}
input,select,button{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;height:36px;padding:0 10px;font:inherit}
button{background:var(--acc);color:#1a1408;font-weight:700;cursor:pointer;border:0}
.layout{display:grid;grid-template-columns:260px 1fr 280px;min-height:0}
@media(max-width:960px){.layout{grid-template-columns:1fr}}
.col{border-inline-end:1px solid var(--line);overflow:auto}
.col:last-child{border:0}
h2{font-size:12px;color:var(--mute);margin:0;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:500}
.item{padding:10px 14px;border-bottom:1px solid #22302a;cursor:pointer}
.item.on{background:#1f2a24}
.item b{display:block;font-size:13px}
.item span{font-family:"IBM Plex Sans",sans-serif;font-size:12px}
#chartBox{height:100%;min-height:440px;direction:ltr}
.modes{padding:8px 12px;display:flex;gap:6px}
.modes i{border:1px solid var(--line);padding:3px 8px;border-radius:99px;font-style:normal;font-size:12px;cursor:pointer}
.modes i.on{border-color:var(--acc);color:var(--acc)}
.stat{padding:12px 14px;border-bottom:1px solid #22302a}
.stat em{display:block;color:var(--mute);font-style:normal;font-size:11px}
.stat strong{font-family:"IBM Plex Sans",sans-serif;font-size:22px;font-weight:600}
.story{padding:14px;color:#d5c7a1;line-height:1.75;font-size:14px}
.up{color:var(--good)} .dn{color:var(--bad)}
</style></head>
<body>
<header>
  <div class="brand">خريطة الفلوس<small>ماذا حدث للجنيه منذ 2016 — مقارنة عادلة وليست نصيحة</small></div>
  <nav><a href="./funds.html">الصناديق</a></nav>
</header>
<div class="controls">
  <div><label>المبلغ الابتدائي</label><input id="amount" type="number" value="1000"/></div>
  <div><label>من تاريخ</label><input id="start" type="date" value="2016-01-04"/></div>
  <div><label>&nbsp;</label><button id="run">احسب المسارات</button></div>
</div>
<div class="layout">
  <div class="col">
    <h2>المسارات</h2>
    <div id="list"></div>
  </div>
  <div class="col" style="display:flex;flex-direction:column;min-height:0">
    <div class="modes">
      <i class="on" data-m="level">قيمة بالجنيه</i>
      <i data-m="rebased">أساس 100</i>
      <i data-m="log">لوغاريتم</i>
    </div>
    <div id="chartBox"></div>
  </div>
  <div class="col">
    <h2>الملخص</h2>
    <div id="sum"></div>
    <div class="story" id="story"></div>
  </div>
</div>
<script>
const META={
 purchasing:{name:"التضخم / القوة الشرائية",color:"#8fa198"},
 usd_egp_mid:{name:"الدولار",color:"#6ec3d4"},
 gold_egp_oz:{name:"الذهب",color:"#c9a45c"},
 silver_egp_oz:{name:"الفضة",color:"#c8c8c8"},
 egx30_close:{name:"EGX30",color:"#5ecf8a"},
 spy_egp:{name:"SPY بالجنيه",color:"#7aa7ff"},
 qqq_egp:{name:"ناسداك QQQ",color:"#c792ea"},
 btc_egp:{name:"بيتكوين",color:"#e07a6e"},
 deposit:{name:"وديعة قصيرة",color:"#e0c27a"},
 tbill:{name:"أذون 91 يوماً",color:"#8fd4a8"}
};
const fmt=n=>n.toLocaleString("ar-EG",{maximumFractionDigits:2});
const en=n=>n.toLocaleString("en-US",{maximumFractionDigits:2});
let DATA,MODE="level",LOG=false,chart,seriesMap={},active="usd_egp_mid";
function nearest(pts,d){if(!pts||!pts.length)return null;let b=pts[0];for(const p of pts){if(p[0]<=d)b=p;else break;}return b}
function days(a,b){return (Date.parse(b)-Date.parse(a))/86400000}
function growYield(pts,start,amount,yearFracDenom){
  const s=pts.filter(p=>p[0]>=start); if(!s.length) return [];
  let v=amount, out=[{time:s[0][0],value:v}];
  for(let i=0;i<s.length;i++){
    const [d,ann]=s[i];
    const nxt=i+1<s.length?s[i+1][0]:d;
    const dt=Math.max(days(d,nxt),0);
    if(dt>0){ v *= Math.pow(1+(ann/100), dt/yearFracDenom); out.push({time:nxt,value:v}); }
  }
  return out;
}
function toLine(start,amount,key){
  if(key==="purchasing"){const mom=DATA.series.cpi_headline_mom_pct||[];let v=1,out=[];for(const[d,m]of mom){if(d<start)continue;v*=(1+m/100);out.push({time:d,value:amount/v})}return out}
  if(key==="deposit") return growYield(DATA.series.bank_deposit_1_3m_avg_pct||[],start,amount,365);
  if(key==="tbill") return growYield(DATA.series.tbill_91_avg_yield_pct||[],start,amount,365);
  const pts=DATA.series[key]; const a=nearest(pts,start); if(!a||!a[1])return [];
  return pts.filter(p=>p[0]>=a[0]).map(([t,v])=>({time:t,value:amount*(v/a[1])}));
}
function rebase(line){if(!line.length)return line;const b=line[0].value||1;return line.map(p=>({time:p.time,value:100*p.value/b}))}
function build(){const el=document.getElementById("chartBox");el.innerHTML="";
 chart=LightweightCharts.createChart(el,{layout:{background:{color:"#0f1412"},textColor:"#8fa198",fontFamily:"IBM Plex Sans"},grid:{vertLines:{color:"#1c2622"},horzLines:{color:"#1c2622"}},rightPriceScale:{borderColor:"#2c3832"},timeScale:{borderColor:"#2c3832"},crosshair:{vertLine:{color:"#c9a45c55"},horzLine:{color:"#c9a45c55"}}});
 new ResizeObserver(()=>chart.applyOptions({width:el.clientWidth,height:el.clientHeight})).observe(el);
 chart.applyOptions({width:el.clientWidth,height:el.clientHeight});
}
function draw(){
  if(!DATA||!chart)return;
  const amount=+document.getElementById("amount").value||1000;
  const start=document.getElementById("start").value||"2016-01-04";
  Object.values(seriesMap).forEach(s=>chart.removeSeries(s)); seriesMap={}; const rows=[];
  Object.keys(META).forEach(key=>{
    let line=toLine(start,amount,key); if(!line.length)return;
    if(MODE==="rebased") line=rebase(line);
    const s=chart.addLineSeries({color:META[key].color,lineWidth:key===active?3:1.2,priceLineVisible:false,lastValueVisible:true,title:META[key].name});
    s.setData(line); seriesMap[key]=s;
    const first=line[0].value,last=line[line.length-1].value;
    rows.push({key,last,mult:last/first,asOf:line[line.length-1].time});
  });
  chart.priceScale("right").applyOptions({mode:LOG?1:0});
  chart.timeScale().fitContent();
  document.getElementById("list").innerHTML=rows.map(r=>{
    const chg=(r.mult-1)*100; const on=r.key===active?"on":"";
    return `<div class="item ${on}" data-k="${r.key}"><b>${META[r.key].name}</b><span class="${chg>=0?"up":"dn"}">${chg>=0?"+":""}${en(chg)}%</span></div>`;
  }).join("");
  document.querySelectorAll(".item").forEach(el=>el.onclick=()=>{active=el.dataset.k;draw()});
  const r=rows.find(x=>x.key===active)||rows[0];
  document.getElementById("sum").innerHTML=`<div class="stat"><em>${META[r.key].name}</em><strong>${fmt(r.last)}</strong></div>
    <div class="stat"><em>المضاعف</em><strong>${en(r.mult)}×</strong></div>
    <div class="stat"><em>العائد الكلي</em><strong class="${r.mult>=1?"up":"dn"}">${en((r.mult-1)*100)}%</strong></div>
    <div class="stat"><em>حتى</em><strong>${r.asOf}</strong></div>`;
  const usd=rows.find(x=>x.key==="usd_egp_mid"),gold=rows.find(x=>x.key==="gold_egp_oz"),cpi=rows.find(x=>x.key==="purchasing");
  document.getElementById("story").textContent=`بدءاً من ${fmt(amount)} جنيه في ${start}، التضخم يحوّل القوة الشرائية إلى نحو ${cpi?fmt(cpi.last):"—"} جنيه. نفس المبلغ بالدولار يصبح حوالي ${usd?fmt(usd.last):"—"} جنيه، وبالذهب حوالي ${gold?fmt(gold.last):"—"} جنيه.`;
}
document.querySelectorAll(".modes i").forEach(i=>i.onclick=()=>{
  document.querySelectorAll(".modes i").forEach(x=>x.classList.remove("on")); i.classList.add("on");
  LOG=i.dataset.m==="log"; MODE=i.dataset.m==="rebased"?"rebased":"level"; draw();
});
document.getElementById("run").onclick=draw;
fetch("data/engine_data.json").then(r=>r.json()).then(d=>{DATA=d;build();draw()});
</script>
</body></html>
