<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KHATER MMAP — Money Map EG</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lightweight-charts@4.2.1/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    :root { --bg:#0a0a0a; --panel:#121212; --line:#2a2a2a; --amber:#ff9f1a; --green:#3ddc84; --red:#ff5a4f; --text:#e8e4d9; --mute:#8b8778; }
    * { box-sizing:border-box; }
    html,body { height:100%; margin:0; background:var(--bg); color:var(--text); font-family:"IBM Plex Sans Arabic",sans-serif; }
    body { display:grid; grid-template-rows:48px 34px 1fr 26px; }
    .top { display:flex; align-items:center; gap:12px; padding:0 14px; border-bottom:1px solid var(--line); background:#0d0d0d; }
    .logo { color:var(--amber); font-weight:700; letter-spacing:.12em; font-size:13px; font-family:"IBM Plex Mono",monospace; }
    .top input { background:#1a1a1a; color:var(--text); border:1px solid #333; height:28px; padding:0 8px; font:inherit; }
    .top button { background:var(--amber); color:#111; border:0; height:28px; padding:0 12px; font-weight:700; cursor:pointer; }
    .ticker { display:flex; gap:20px; overflow:hidden; white-space:nowrap; border-bottom:1px solid var(--line); align-items:center; padding:0 12px; font-family:"IBM Plex Mono",monospace; font-size:12px; color:#e6c27a; }
    .workspace { display:grid; grid-template-columns:270px 1fr 300px; min-height:0; }
    @media(max-width:980px){ .workspace{grid-template-columns:1fr;} }
    aside,.side { background:var(--panel); overflow:auto; }
    aside { border-left:1px solid var(--line); }
    .side { border-right:1px solid var(--line); }
    .sec { padding:10px 12px; font-size:11px; color:var(--mute); letter-spacing:.12em; border-bottom:1px solid var(--line); }
    .watch { width:100%; border-collapse:collapse; font-size:13px; }
    .watch td { padding:7px 10px; border-bottom:1px solid #1d1d1d; cursor:pointer; }
    .watch tr.active td { background:#1b160c; color:var(--amber); }
    .mono { font-family:"IBM Plex Mono",monospace; }
    .up { color:var(--green); } .dn { color:var(--red); }
    .chart-wrap { display:flex; flex-direction:column; min-height:0; }
    .chart-bar { display:flex; justify-content:space-between; align-items:center; padding:6px 12px; border-bottom:1px solid var(--line); font-size:12px; color:var(--mute); }
    .pills span { margin-inline-start:8px; padding:2px 8px; border:1px solid #333; cursor:pointer; }
    .pills span.on { border-color:var(--amber); color:var(--amber); }
    #chart { flex:1; min-height:420px; }
    .stat { padding:10px 12px; border-bottom:1px solid #1d1d1d; }
    .stat .k { color:var(--mute); font-size:12px; }
    .stat .v { font-family:"IBM Plex Mono",monospace; font-size:20px; }
    .story { padding:12px; color:#e6c27a; font-size:14px; line-height:1.7; }
    footer { border-top:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; padding:0 12px; font-size:11px; color:var(--mute); font-family:"IBM Plex Mono",monospace; }
    .funds input { width:calc(100% - 20px); margin:8px 10px; background:#1a1a1a; color:var(--text); border:1px solid #333; padding:6px 8px; }
  </style>
</head>
<body>
  <div class="top">
    <div class="logo">KHATER &lt;MMAP&gt;</div>
    <span>المبلغ</span><input id="amount" type="number" value="1000" />
    <span>من</span><input id="start" type="date" value="2016-01-04" />
    <button id="run">RUN</button>
    <span style="color:var(--mute);font-size:12px">مصر · مقارنة عادلة بالجنيه · ليس نصيحة</span>
  </div>
  <div class="ticker" id="tape"></div>
  <div class="workspace">
    <aside>
      <div class="sec">WATCHLIST</div>
      <table class="watch"><tbody id="watch"></tbody></table>
    </aside>
    <div class="chart-wrap">
      <div class="chart-bar">
        <div id="chartTitle">القيمة التراكمية للجنيه</div>
        <div class="pills">
          <span class="on" data-mode="level">LEVEL</span>
          <span data-mode="rebased">REBASE 100</span>
          <span data-mode="log">LOG</span>
        </div>
      </div>
      <div id="chart"></div>
    </div>
    <div class="side">
      <div class="sec">MONITOR</div>
      <div id="stats"></div>
      <div class="story" id="story"></div>
      <div class="sec">FUNDS</div>
      <div class="funds">
        <input id="q" placeholder="بحث صندوق / مدير" />
        <table class="watch"><tbody id="funds"></tbody></table>
      </div>
    </div>
  </div>
  <footer>
    <span>MACRO_SERIES + NAV_OFFICIAL</span>
    <span id="clock"></span>
    <span>EQ · FX · CMD · CRYPTO</span>
  </footer>
  <script>
  const COLORS = {purchasing:"#8b8778",usd_egp_mid:"#5ad0e6",gold_egp_oz:"#ff9f1a",silver_egp_oz:"#c5c5c5",egx30_close:"#3ddc84",spy_egp:"#6ea8fe",qqq_egp:"#c792ea",btc_egp:"#ff5a4f",deposit:"#e6c27a",tbill:"#9adbb0"};
  const LABELS = {purchasing:"CPI PWR",usd_egp_mid:"USD/EGP",gold_egp_oz:"GOLD EGP",silver_egp_oz:"SILVER EGP",egx30_close:"EGX30",spy_egp:"SPY EGP",qqq_egp:"QQQ EGP",btc_egp:"BTC EGP",deposit:"DEPOSIT",tbill:"TBILL 91"};
  const fmt=(n,d=2)=>n.toLocaleString("en-US",{maximumFractionDigits:d});
  const ar=(n,d=2)=>n.toLocaleString("ar-EG",{maximumFractionDigits:d});
  let DATA=null,MODE="level",chart,seriesMap={},active="egx30_close",logMode=false;
  function nearest(points,date){if(!points||!points.length)return null;let b=points[0];for(const p of points){if(p[0]<=date)b=p;else break;}return b;}
  function toLine(start,amount,key){
    if(key==="purchasing"){const mom=DATA.series.cpi_headline_mom_pct||[];let v=1,out=[];for(const [d,m] of mom){if(d<start)continue;v*=(1+m/100);out.push({time:d,value:amount/v});}return out;}
    if(key==="deposit"||key==="tbill"){const src=key==="deposit"?DATA.series.bank_deposit_1_3m_avg_pct:DATA.series.tbill_91_avg_yield_pct;const per=key==="deposit"?12:4;let v=1,out=[];for(const [d,annual] of (src||[])){if(d<start)continue;v*=(1+(annual/100)/per);out.push({time:d,value:amount*v});}return out;}
    const pts=DATA.series[key]; const a=nearest(pts,start); if(!a||!a[1])return [];
    return pts.filter(p=>p[0]>=a[0]).map(([t,v])=>({time:t,value:amount*(v/a[1])}));
  }
  function rebase(line){if(!line.length)return line;const b=line[0].value;return line.map(p=>({time:p.time,value:100*p.value/b}));}
  function buildChart(){
    const el=document.getElementById("chart"); el.innerHTML="";
    chart=LightweightCharts.createChart(el,{layout:{background:{color:"#0a0a0a"},textColor:"#8b8778",fontFamily:"IBM Plex Mono"},grid:{vertLines:{color:"#1a1a1a"},horzLines:{color:"#1a1a1a"}},rightPriceScale:{borderColor:"#2a2a2a"},timeScale:{borderColor:"#2a2a2a"},crosshair:{vertLine:{color:"#ff9f1a55"},horzLine:{color:"#ff9f1a55"}}});
    new ResizeObserver(()=>chart.applyOptions({width:el.clientWidth,height:el.clientHeight})).observe(el);
    chart.applyOptions({width:el.clientWidth,height:el.clientHeight});
  }
  function draw(){
    if(!DATA||!chart)return;
    const amount=Number(document.getElementById("amount").value)||1000;
    const start=document.getElementById("start").value||"2016-01-04";
    Object.values(seriesMap).forEach(s=>chart.removeSeries(s)); seriesMap={};
    const rows=[];
    Object.keys(LABELS).forEach(key=>{
      let line=toLine(start,amount,key); if(!line.length)return;
      if(MODE==="rebased") line=rebase(line);
      const s=chart.addLineSeries({color:COLORS[key],lineWidth:key===active?2.6:1.1,priceLineVisible:false,lastValueVisible:true,title:LABELS[key]});
      s.setData(line); seriesMap[key]=s;
      const lastv=line[line.length-1].value; const first=line[0].value;
      rows.push({key,lastv,mult:lastv/first,asOf:line[line.length-1].time});
    });
    chart.priceScale("right").applyOptions({mode:logMode?1:0});
    chart.timeScale().fitContent();
    renderWatch(rows); renderStats(rows);
    const usd=rows.find(r=>r.key==="usd_egp_mid"), gold=rows.find(r=>r.key==="gold_egp_oz"), cpi=rows.find(r=>r.key==="purchasing");
    document.getElementById("story").textContent=`${ar(amount)} ج.م من ${start}: القوة الشرائية ≈ ${cpi?ar(cpi.lastv):"—"} · الدولار ≈ ${usd?ar(usd.lastv):"—"} · الذهب ≈ ${gold?ar(gold.lastv):"—"}`;
    document.getElementById("tape").innerHTML=rows.map(r=>`<span>${LABELS[r.key]} <b class="${r.mult>=1?"up":"dn"}">${fmt(r.lastv,0)}</b></span>`).join("");
  }
  function renderWatch(rows){
    document.getElementById("watch").innerHTML=rows.map(r=>{
      const chg=(r.mult-1)*100;
      return `<tr data-key="${r.key}" class="${r.key===active?"active":""}"><td>${LABELS[r.key]}</td><td class="mono ${chg>=0?"up":"dn"}">${chg>=0?"+":""}${fmt(chg,1)}%</td></tr>`;
    }).join("");
    document.querySelectorAll("#watch tr").forEach(tr=>tr.onclick=()=>{active=tr.dataset.key;draw();});
  }
  function renderStats(rows){
    const r=rows.find(x=>x.key===active)||rows[0]; if(!r)return;
    document.getElementById("stats").innerHTML=`<div class="stat"><div class="k">${LABELS[r.key]} LAST</div><div class="v">${fmt(r.lastv)}</div></div><div class="stat"><div class="k">MULTIPLE</div><div class="v">${fmt(r.mult,2)}x</div></div><div class="stat"><div class="k">TOTAL RETURN</div><div class="v ${r.mult>=1?"up":"dn"}">${fmt((r.mult-1)*100,1)}%</div></div><div class="stat"><div class="k">AS OF</div><div class="v">${r.asOf}</div></div>`;
    document.getElementById("chartTitle").textContent=LABELS[r.key]+" · "+MODE.toUpperCase()+(logMode?" · LOG":"");
  }
  function renderFunds(q=""){
    document.getElementById("funds").innerHTML=DATA.funds.filter(f=>!q||(f.name+(f.manager||"")).includes(q)).slice(0,45).map(f=>`<tr><td>${f.name}</td><td class="mono">${f.nav!=null?fmt(f.nav):"—"}</td></tr>`).join("");
  }
  document.querySelectorAll(".pills span").forEach(p=>p.onclick=()=>{
    document.querySelectorAll(".pills span").forEach(x=>x.classList.remove("on")); p.classList.add("on");
    logMode=p.dataset.mode==="log"; MODE=p.dataset.mode==="rebased"?"rebased":"level"; draw();
  });
  document.getElementById("run").onclick=draw;
  document.getElementById("q").oninput=e=>renderFunds(e.target.value);
  setInterval(()=>document.getElementById("clock").textContent=new Date().toISOString().replace("T"," ").slice(0,19)+" UTC",1000);
  fetch("data/engine_data.json").then(r=>r.json()).then(d=>{DATA=d;buildChart();renderFunds();draw();});
  </script>
</body>
</html>
