<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>الاقتصاد — خريطة الفلوس</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/app.css"/>
</head>
<body>
  <header class="site-header"><div class="wrap">
    <div class="logo">خريطة الفلوس<span>طبقة الاقتصاد</span></div>
    <nav>
      <a href="./index.html">البداية</a>
      <a href="./map.html">ماذا حدث للفلوس؟</a>
      <a href="./funds.html">الصناديق</a>
      <a class="active" href="./macro.html">الاقتصاد</a>
      <a href="./why.html">المنهج</a>
    </nav>
  </div></header>
  <main class="wrap page">
    <h1>الاقتصاد كما يصل لحياة الناس</h1>
    <p class="muted">آخر مشاهدة في اللقطة العامة. التحديث اليومي في القاعدة قد يكون أحدث من الملف الثابت.</p>
    <div class="grid3" id="cards"></div>
  </main>
  <script type="module">
    import { fmt } from "./js/engine.js";
    const keys = [
      ["usd_egp_mid","دولار / جنيه","EGP"],
      ["egx30_close","EGX30","نقطة"],
      ["gold_egp_oz","ذهب بالجنيه","ج.م/أونصة"],
      ["silver_egp_oz","فضة بالجنيه","ج.م/أونصة"],
      ["btc_egp","بيتكوين بالجنيه","ج.م"],
      ["tbill_91_avg_yield_pct","عائد أذون 91 يوماً","%"],
    ];
    const d = await (await fetch("data/engine_data.json")).json();
    document.getElementById("cards").innerHTML = keys.map(([k,t,u])=>{
      const pts=d.series[k]||[]; const last=pts[pts.length-1];
      return `<div class="card"><div class="kicker">${u}</div><h3>${t}</h3><p style="font-size:28px;color:#eef3ef;margin:8px 0">${last?fmt(last[1]):"—"}</p><p>${last?last[0]:""}</p></div>`;
    }).join("");
  </script>
</body>
</html>
