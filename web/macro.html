<!DOCTYPE html>
<html lang=\"ar\" dir=\"rtl\">
<head>
<meta charset=\"utf-8\"/><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"/>
<title>الاقتصاد</title>
<script src=\"config.js\"></script>
<link href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@500;600&display=swap\" rel=\"stylesheet\"/>
<link rel=\"stylesheet\" href=\"css/app.css\"/>
</head>
<body>
<header class=\"site-header\"><div class=\"wrap\">
  <div class=\"logo\">خريطة الفلوس<span>الاقتصاد منذ 2016</span></div>
  <nav>
    <a href=\"./index.html\">البداية</a>
    <a href=\"./map.html\">ماذا حدث للفلوس؟</a>
    <a href=\"./funds.html\">الصناديق</a>
    <a href=\"./categories.html\">خريطة الفئات</a>
    <a class=\"active\" href=\"./macro.html\">الاقتصاد</a>
  </nav>
</div></header>
<main class=\"wrap page\">
  <h1>كيف وصل الرقم إلى هنا؟</h1>
  <p class=\"muted\">القيمة الآن، والتغيّر منذ 2016 على نفس السلسلة.</p>
  <div class=\"grid3\" id=\"cards\"></div>
</main>
<script type=\"module\">
import { loadEngine } from \"./js/live.js\";
import { fmt } from \"./js/engine.js\";
const packed = await loadEngine();
const keys = [
  [\"usd_egp_mid\",\"دولار / جنيه\",\"سعر الصرف\"],
  [\"egx30_close\",\"EGX30\",\"المؤشر\"],
  [\"gold_egp_oz\",\"ذهب بالجنيه\",\"أونصة\"],
  [\"silver_egp_oz\",\"فضة بالجنيه\",\"أونصة\"],
  [\"btc_egp\",\"بيتكوين بالجنيه\",\"للمقارنة\"],
  [\"tbill_91_avg_yield_pct\",\"أذون 91 يوماً\",\"% سنوي\"]
];
function near(pts,d){ if(!pts?.length) return null; let b=pts[0]; for(const p of pts){ if(p[0]<=d) b=p; else break;} return b; }
document.getElementById(\"cards\").innerHTML = keys.map(([k,t,s])=>{
  const pts = packed.series[k]||[];
  const last = pts.at(-1);
  const base = near(pts,\"2016-01-04\");
  const chg = last && base && base[1] ? (last[1]/base[1]-1)*100 : null;
  return `<div class=\"card\"><div class=\"kicker\">${s}</div><h3>${t}</h3>
    <p class=\"num\" style=\"font-size:28px;color:var(--ink)\">${last?fmt(last[1]):\"—\"}</p>
    <p>${last?last[0]:\"\"}</p>
    <p class=\"${(chg||0)>=0?\"up\":\"dn\"}\">${chg==null?\"—\":((chg>=0?\"+\":\"\")+chg.toLocaleString(\"en-US\",{maximumFractionDigits:1})+\"٪ منذ 2016\")}</p></div>`;
}).join(\"\");
</script>
</body></html>
