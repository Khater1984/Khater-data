<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>خريطة فئات الصناديق | Khater Funds Radar</title>

  <!-- config.js – يجب أن يحتوي على window.KHATER.key -->
  <script src="config.js"></script>
  <!-- ECharts لتصورات احترافية -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <!-- خطوط Google -->
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* ---------- reset & variables ---------- */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #080b12;
      --panel: #111621;
      --panel2: #151b27;
      --line: rgba(255,255,255,0.07);
      --text: #f3f4f6;
      --muted: #8993a5;
      --green: #10b981;
      --green2: #34d399;
      --red: #ef4444;
      --orange: #f59e0b;
      --blue: #3b82f6;
      --purple: #8b5cf6;
      --radius: 12px;
    }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'IBM Plex Sans Arabic', 'IBM Plex Sans', sans-serif;
      direction: rtl;
    }
    body { min-height: 100vh; padding: 0; }

    /* ---------- scrollbar ---------- */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: var(--panel); }
    ::-webkit-scrollbar-thumb { background: #2a3346; border-radius: 8px; }

    /* ---------- generic ---------- */
    button, select, input {
      font: inherit;
      background: #151a25;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 7px 12px;
      outline: none;
      transition: 0.2s;
    }
    button { cursor: pointer; }
    button:hover { border-color: var(--green); }
    button.active {
      background: var(--green);
      color: #03130e;
      border-color: var(--green);
      font-weight: 700;
    }
    .hidden { display: none !important; }

    /* ---------- header ---------- */
    header {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      border-bottom: 1px solid var(--line);
      background: rgba(8,11,18,0.85);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo { font-weight: 700; font-size: 15px; }
    nav { display: flex; gap: 16px; }
    nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 12px;
      transition: 0.2s;
    }
    nav a:hover, nav a.active { color: #fff; }

    /* ---------- page ---------- */
    .page { max-width: 1360px; margin: 0 auto; padding: 18px 16px 50px; }

    /* ---------- hero ---------- */
    .hero {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .hero h1 { font-size: 24px; letter-spacing: -0.3px; margin: 0; }
    .hero p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--muted);
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 12px rgba(16,185,129,0.6);
    }
    .dot.error { background: var(--red); box-shadow: 0 0 12px rgba(239,68,68,0.6); }

    /* ---------- panels ---------- */
    .panel {
      background: rgba(17,22,33,0.92);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    }

    /* ---------- filters ---------- */
    .filters {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 0.9fr 0.9fr auto;
      gap: 8px;
      padding: 10px 14px;
      margin-bottom: 14px;
      position: sticky;
      top: 66px;
      z-index: 50;
      backdrop-filter: blur(14px);
      background: rgba(17,22,33,0.94);
    }
    .filters select, .filters input { min-width: 0; width: 100%; }

    /* ---------- KPI ---------- */
    .kpis {
      display: grid;
      grid-template-columns: repeat(4,1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .kpi {
      padding: 12px 14px;
      background: var(--panel);
      border-radius: var(--radius);
      border: 1px solid var(--line);
    }
    .kpi-label { color: var(--muted); font-size: 11px; }
    .kpi-value {
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 22px;
      font-weight: 700;
      margin-top: 4px;
      direction: ltr;
      text-align: right;
    }
    .kpi-sub { color: #687386; font-size: 10px; margin-top: 3px; }

    /* ---------- view tabs ---------- */
    .views {
      display: flex;
      gap: 6px;
      margin: 10px 0 12px;
    }
    .views button {
      background: transparent;
      border: 1px solid var(--line);
      padding: 5px 16px;
      border-radius: 30px;
      font-size: 12px;
      color: var(--muted);
    }
    .views button.active {
      background: var(--green);
      color: #03130e;
      border-color: var(--green);
    }

    /* ---------- heatmap / treemap containers ---------- */
    .chart-container {
      width: 100%;
      height: 560px;
      border-radius: var(--radius);
      background: transparent;
    }
    .chart-container-sm { height: 400px; }

    /* ---------- cards ---------- */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 12px;
    }
    .cat-card {
      padding: 14px 16px;
      background: var(--panel);
      border-radius: var(--radius);
      border: 1px solid var(--line);
      cursor: pointer;
      transition: 0.15s;
    }
    .cat-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 28px rgba(0,0,0,0.35);
      border-color: var(--green);
    }
    .cat-card h3 { font-size: 14px; margin-bottom: 8px; }
    .cat-card .metric {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      font-size: 11px;
      border-bottom: 1px solid var(--line);
    }
    .cat-card .metric:last-child { border-bottom: none; }
    .cat-card .muted { color: var(--muted); }

    /* ---------- axes & distribution ---------- */
    .extra-grid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 12px;
      margin-top: 16px;
    }
    .axis-grid {
      display: grid;
      grid-template-columns: repeat(5,1fr);
      gap: 8px;
      margin-top: 8px;
    }
    .axis-item {
      background: var(--panel2);
      border-radius: 10px;
      padding: 8px 10px;
      border: 1px solid var(--line);
    }
    .axis-item .label { color: var(--muted); font-size: 10px; }
    .axis-item .value {
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 18px;
      font-weight: 700;
      margin-top: 2px;
    }
    .axis-item .fund-name { color: #b3bac6; font-size: 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dist-bar {
      display: flex;
      height: 20px;
      border-radius: 99px;
      overflow: hidden;
      background: #222936;
      margin: 8px 0 4px;
    }
    .dist-bar .seg { height: 100%; transition: 0.2s; }
    .dist-label { color: var(--muted); font-size: 10px; }

    /* ---------- drawer ---------- */
    .mask {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      display: none;
      z-index: 150;
    }
    .mask.on { display: block; }
    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(440px, 100%);
      background: #0d121b;
      border-left: 1px solid var(--line);
      z-index: 200;
      transform: translateX(110%);
      transition: 0.25s ease;
      overflow-y: auto;
      padding: 18px 16px;
    }
    .drawer.on { transform: none; }
    .drawer-close {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 15px;
      margin-bottom: 12px;
      cursor: pointer;
    }
    .drawer-close:hover { color: #fff; }
    .drawer .fund-row {
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
    }
    .drawer .fund-row b { display: block; font-size: 13px; }
    .drawer .fund-meta { color: var(--muted); font-size: 10px; margin: 3px 0; }
    .drawer .fund-data { font-size: 11px; line-height: 1.7; }

    /* ---------- error & loading ---------- */
    .error-box {
      padding: 18px;
      border: 1px solid rgba(239,68,68,0.25);
      background: rgba(127,29,29,0.12);
      border-radius: var(--radius);
      color: #fca5a5;
    }
    .error-box strong { display: block; color: #fff; margin-bottom: 4px; }
    .loading {
      padding: 40px;
      text-align: center;
      color: var(--muted);
    }
    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid #283140;
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---------- responsive ---------- */
    @media (max-width: 950px) {
      .filters { grid-template-columns: 1fr 1fr; }
      .kpis { grid-template-columns: 1fr 1fr; }
      .extra-grid { grid-template-columns: 1fr; }
      .axis-grid { grid-template-columns: repeat(3,1fr); }
      .chart-container { height: 420px; }
    }
    @media (max-width: 620px) {
      header { padding: 0 10px; }
      nav { gap: 8px; }
      nav a { font-size: 10px; }
      .page { padding: 12px 8px 30px; }
      .hero h1 { font-size: 20px; }
      .hero { flex-direction: column; align-items: flex-start; }
      .filters { grid-template-columns: 1fr; }
      .filters input { grid-column: auto; }
      .kpis { grid-template-columns: 1fr; }
      .cards-grid { grid-template-columns: 1fr; }
      .axis-grid { grid-template-columns: 1fr 1fr; }
      .chart-container { height: 320px; }
      .drawer { width: 100%; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">Khater Funds Radar</div>
  <nav>
    <a href="./index.html">البداية</a>
    <a href="./map.html">البوصلة</a>
    <a href="./funds.html">الصناديق</a>
    <a class="active" href="./categories.html">الفئات</a>
    <a href="./macro.html">الاقتصاد</a>
  </nav>
</header>

<main class="page">

  <div class="hero">
    <div>
      <h1>خريطة فئات الصناديق</h1>
      <p>تحليل أداء الفئات والصناديق — بيانات فعلية من Supabase</p>

  <!-- filters -->
  <div class="panel filters">

    <button id="reset">إعادة الضبط</button>
  </div>

  <!-- loading / error / app -->
  <div id="loading" class="panel loading"><div class="spinner"></div>جاري تحميل البيانات...</div>
  <div id="error" class="error-box hidden"></div>

  <div id="app" class="hidden">

    <!-- KPIs -->
    <div class="kpis" id="kpis"></div>

    <!-- view tabs -->
    <div class="views">
      <button class="active" data-view="heat">مصفوفة الأداء</button>
      <button data-view="tree">Treemap</button>

    <!-- Heatmap view -->
    <section id="viewHeat" class="section">

    <section id="viewCards" class="section hidden">

    <!-- Extra: axes + distribution -->
    <section class="section">

          <div style="font-weight:600;font-size:14px;margin-bottom:4px;">أعلى قيمة لكل محور Smart Score</div>
          <div class="axis-grid" id="axes"></div>

        <div class="panel" style="padding:12px 14px;">
          <div style="font-weight:600;font-size:14px;margin-bottom:4px;">توزيع Smart Score</div>
          <div class="dist-bar" id="distribution"></div>
          <div class="dist-label" id="distributionLabel"></div>
        </div>
      </div>
    </section>

  </div> <!-- /app -->

</main>

<!-- drawer -->
<div class="mask" id="mask"></div>
<aside class="drawer" id="drawer"></aside>

<script>
  "use strict";

  /* ============================================================
     CONFIG
     ============================================================ */
  const SUPABASE_URL = 'https://jlaqotegkeszuyqzdham.supabase.co';
  const CFG = window.KHATER || {};
  const API_URL = CFG.url || window.SUPABASE_URL || SUPABASE_URL;
  const API_KEY = CFG.key || CFG.anonKey || window.SUPABASE_ANON_KEY || '';

  const HORIZONS = {
    last12m: '12 شهر',
    ytd: 'YTD',
    '4weeks': 'شهر',
    '3y': '3 سنوات',
    '5y': '5 سنوات'
  };

  /* ============================================================
     HELPERS
     ============================================================ */
  function safeNumber(v) {
    const n = Number(v);
    return Number.isFinite(n) ? n : null;
  }

  function formatNumber(v, d = 1) {
    const n = safeNumber(v);
    if (n === null) return '—';
    return n.toLocaleString('en-US', { maximumFractionDigits: d, minimumFractionDigits: d });
  }

  function formatReturn(v) {
    const n = safeNumber(v);
    if (n === null) return '—';
    return (n >= 0 ? '+' : '') + n.toLocaleString('en-US', { maximumFractionDigits: 1 }) + '%';
  }

  function escapeHTML(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      if (m === '"') return '&quot;';
      return m;
    });
  }

  /* ---------- get return from metadata ---------- */
  function getReturn(fund, horizon) {
    const s = fund.metadata && fund.metadata.scores;
    if (!s) return null;
    const item = s[horizon];
    if (!item) return null;
    return safeNumber(item.return_pct);
  }

  /* ---------- normalize category (fallback) ---------- */
  function normalizeCategory(value) {
    const c = String(value || '').toLowerCase();
    if (c.includes('gold')) return 'صناديق الذهب';
    if (c.includes('money market')) return 'صناديق النقد';
    if (c.includes('fixed income') || c.includes('bond')) return 'صناديق الدخل الثابت';
    if (c.includes('balanced') || c.includes('mixed') || c.includes('allocator')) return 'الصناديق المتوازنة';
    if (c.includes('index') || c.includes('etf') || c.includes('traded') || c.includes('passive')) return 'صناديق المؤشرات';
    if (c.includes('equity') || c.includes('thematic') || c.includes('sector')) return 'صناديق الأسهم';
    if (c.includes('protected') || c.includes('guaranteed')) return 'صناديق محمية';
    if (c.includes('charitable')) return 'صناديق خيرية';
    return 'فئات أخرى';
  }

  /* ---------- score matching ---------- */
  function scoreMatches(score, range) {
    if (!range) return true;
    if (range === 'na') return score === null;
    if (score === null) return false;
    if (range === '90') return score >= 90;
    if (range === '75') return score >= 75 && score < 90;
    if (range === '50') return score >= 50 && score < 75;
    return score < 50;
  }

  /* ---------- heatmap colors (تدرج ثنائي) ---------- */
  function getColor(value, min, max) {
    if (value === null) return '#2a3346';
    const t = (value - min) / (max - min); // 0..1
    const r = Math.round(255 * t);
    const g = Math.round(255 * (1 - Math.abs(t - 0.5) * 2));
    const b = Math.round(255 * (1 - t));
    return `rgb(${r}, ${g}, ${b})`;
  }

  /* ============================================================
     SUPABASE FETCH (with timeout)
     ============================================================ */
  async function fetchTable(table, select, timeoutMs = 15000) {
    if (!API_KEY) throw new Error('مفتاح Supabase غير موجود في config.js (window.KHATER.key)');
    const url = API_URL.replace(/\/$/, '') + '/rest/v1/' + table + '?select=' + encodeURIComponent(select);
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try {
      const res = await fetch(url, {
        method: 'GET',
        headers: {
          'apikey': API_KEY,
          'Authorization': 'Bearer ' + API_KEY,
          'Accept': 'application/json'
        },
        signal: controller.signal
      });
      clearTimeout(timer);
      const text = await res.text();
      if (!res.ok) throw new Error('HTTP ' + res.status + ': ' + text.slice(0, 200));
      try { return JSON.parse(text); } catch (e) { throw new Error('استجابة غير صالحة (ليست JSON)'); }
    } catch (err) {
      clearTimeout(timer);
      if (err.name === 'AbortError') throw new Error('انتهت المهلة (' + timeoutMs + 'ms)');
      throw err;
    }
  }

  /* ============================================================
     STATE
     ============================================================ */
  const state = {
    allFunds: [],
    filteredFunds: [],
    currentHorizon: 'last12m',
    heatmapChart: null,
    treemapChart: null
  };

  /* ============================================================
     LOAD DATA
     ============================================================ */
  async function loadData() {
    try {
      setStatus('جاري تحميل بيانات الصناديق...', false);

      let funds = [], navs = [], smartScores = [];
      const errors = [];

      try {
        funds = await fetchTable('funds', [
          'fund_id', 'canonical_name', 'management_company', 'category',
          'metadata', 'active', 'price_update_url', 'confidence'
        ].join(','));
      } catch (e) { errors.push({ table: 'funds', error: e.message }); }

      try {
        navs = await fetchTable('nav_official', [
          'fund_id', 'nav', 'currency', 'as_of_date', 'source_id', 'source_url', 'verified_at'
        ].join(','));
      } catch (e) { errors.push({ table: 'nav_official', error: e.message }); }

      try {
        smartScores = await fetchTable('fund_smartscore_latest', [
          'fund_id', 'canonical_name', 'category', 'data_tier', 'data_quality',
          'score_as_of', 'raw_score', 'track_factor', 'final_score', 'rating',
          'qualified_rank', 'peer_cohort_size', 'data_confidence', 'qualification_status',
          'score_explanation', 'performance_score', 'risk_score', 'benchmark_score',
          'consistency_score', 'inflation_score', 'risk_method', 'signal_as_of',
          'latest_day_change_pct', 'latest_signal_status'
        ].join(','));
      } catch (e) { errors.push({ table: 'fund_smartscore_latest', error: e.message }); }

      if (!Array.isArray(funds) || funds.length === 0) {
        throw new Error('فشل تحميل جدول funds (الجدول الأساسي)');
      }

      // NAV map (أحدث تاريخ)
      const navMap = {};
      if (Array.isArray(navs)) {
        navs.forEach(row => {
          const old = navMap[row.fund_id];
          if (!old || String(row.as_of_date || '') > String(old.as_of_date || '')) {
            navMap[row.fund_id] = {
              nav: safeNumber(row.nav),
              currency: row.currency,
              as_of_date: row.as_of_date,
              source_url: row.source_url
            };
          }
        });
      }

      // دمج البيانات
      const merged = funds.map(fund => {
        const navInfo = navMap[fund.fund_id] || {};
        const smart = (Array.isArray(smartScores) ? smartScores.find(s => s.fund_id === fund.fund_id) : {}) || {};
        return {
          ...fund,
          nav: navInfo.nav,
          currency: navInfo.currency,
          as_of_date: navInfo.as_of_date,
          smart: smart,
          // نستخدم category من قاعدة البيانات أولاً
          displayCategory: fund.category || normalizeCategory(fund.category || '')
        };
      });

      state.allFunds = merged;
      window.allFunds = merged;

      // عرض تحذيرات
      if (errors.length) {
        console.warn('تحذير: بعض الجداول فشلت', errors);
        const errBox = document.getElementById('error');
        errBox.classList.remove('hidden');
        errBox.innerHTML = '<strong>⚠️ تحذير: بعض البيانات غير متوفرة</strong><br>' +
          errors.map(e => escapeHTML(e.table) + ': ' + escapeHTML(e.error)).join(' | ');
      } else {
        document.getElementById('error').classList.add('hidden');
      }

      // تعبئة الفلاتر
      populateFilters(merged);

      // تطبيق الفلاتر الأولية وعرض البيانات
      applyFiltersAndRender();

      document.getElementById('loading').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      setStatus('تم تحميل البيانات بنجاح', true);

    } catch (err) {
      console.error('خطأ جوهري:', err);
      document.getElementById('loading').classList.add('hidden');
      const errBox = document.getElementById('error');
      errBox.classList.remove('hidden');
      errBox.innerHTML = '<strong>⚠️ فشل تحميل البيانات</strong><br>' + escapeHTML(err.message);
      setStatus('فشل التحميل', false);
    }
  }

  /* ============================================================
     POPULATE FILTERS
     ============================================================ */
  function populateFilters(data) {
    const catSet = new Set(), classSet = new Set(), tierSet = new Set();
    data.forEach(f => {
      if (f.category) catSet.add(f.category);
      if (f.metadata && f.metadata.classification) classSet.add(f.metadata.classification);
      if (f.smart && f.smart.data_tier) tierSet.add(f.smart.data_tier);
    });

    const catSel = document.getElementById('category');
    catSel.innerHTML = '<option value="">كل الفئات</option>';
    catSet.forEach(c => { catSel.innerHTML += `<option value="${escapeHTML(c)}">${escapeHTML(c)}</option>`; });

    const classSel = document.getElementById('classification');
    classSel.innerHTML = '<option value="">كل التصنيفات</option>';
    classSet.forEach(c => { classSel.innerHTML += `<option value="${escapeHTML(c)}">${escapeHTML(c)}</option>`; });

    const tierSel = document.getElementById('tier');
    tierSel.innerHTML = '<option value="">كل مستويات البيانات</option>';
    tierSet.forEach(t => { tierSel.innerHTML += `<option value="${escapeHTML(t)}">${escapeHTML(t)}</option>`; });
  }

  /* ============================================================
     FILTER + RENDER
     ============================================================ */
  function applyFiltersAndRender() {
    const cat = document.getElementById('category').value;
    const classif = document.getElementById('classification').value;
    const manager = document.getElementById('manager').value.trim().toLowerCase();
    const scoreRange = document.getElementById('scoreRange').value;
    const tier = document.getElementById('tier').value;
    const horizon = document.getElementById('horizon').value;
    state.currentHorizon = horizon;

    const data = state.allFunds;
    const filtered = data.filter(f => {
      if (cat && f.category !== cat) return false;
      if (classif && (f.metadata?.classification || '') !== classif) return false;
      if (manager && !(f.management_company || '').toLowerCase().includes(manager)) return false;
      if (tier && (f.smart?.data_tier || '') !== tier) return false;
      const score = safeNumber(f.smart?.final_score);
      if (scoreRange && !scoreMatches(score, scoreRange)) return false;
      return true;
    });

    state.filteredFunds = filtered;
    renderFilteredData(filtered, horizon);
  }

  /* ============================================================
     RENDER FILTERED DATA
     ============================================================ */
  function renderFilteredData(filtered, horizon) {
    renderKPIs(filtered, horizon);
    renderHeatmap(filtered, horizon);
    renderTreemap(filtered, horizon);
    renderCards(filtered, horizon);
    renderAxes(filtered);
    renderDistribution(filtered);
  }

  /* ============================================================
     KPI (تعتمد على البيانات المفلترة فقط)
     ============================================================ */
  function renderKPIs(data, horizon) {
    const returns = data.map(f => getReturn(f, horizon)).filter(r => r !== null);
    const total = data.length;
    const avg = returns.length ? returns.reduce((a, b) => a + b, 0) / returns.length : null;
    const max = returns.length ? Math.max(...returns) : null;
    const min = returns.length ? Math.min(...returns) : null;

    const container = document.getElementById('kpis');
    container.innerHTML = `
      <div class="kpi"><div class="kpi-label">عدد الصناديق</div><div class="kpi-value">${total}</div></div>
      <div class="kpi"><div class="kpi-label">متوسط العائد (${HORIZONS[horizon] || horizon})</div><div class="kpi-value">${avg !== null ? formatReturn(avg) : '—'}</div></div>
      <div class="kpi"><div class="kpi-label">أعلى عائد</div><div class="kpi-value" style="color:var(--green2);">${max !== null ? formatReturn(max) : '—'}</div></div>
      <div class="kpi"><div class="kpi-label">أدنى عائد</div><div class="kpi-value" style="color:#f87171;">${min !== null ? formatReturn(min) : '—'}</div></div>
    `;
  }

  /* ============================================================
     HEATMAP باستخدام ECharts
     ============================================================ */
  function renderHeatmap(data, horizon) {
    const dom = document.getElementById('heatmapChart');
    if (!state.heatmapChart) {
      state.heatmapChart = echarts.init(dom);
    }
    const chart = state.heatmapChart;
    chart.resize();

    // تجميع البيانات حسب الفئة
    const groups = {};
    data.forEach(f => {
      const cat = f.displayCategory || 'فئات أخرى';
      if (!groups[cat]) groups[cat] = [];
      groups[cat].push(f);
    });

    // ترتيب الفئات حسب متوسط العائد (تنازلي)
    const sortedCats = Object.keys(groups).sort((a, b) => {
      const arrA = groups[a].map(f => getReturn(f, horizon)).filter(r => r !== null);
      const arrB = groups[b].map(f => getReturn(f, horizon)).filter(r => r !== null);
      const avgA = arrA.length ? arrA.reduce((s, v) => s + v, 0) / arrA.length : -Infinity;
      const avgB = arrB.length ? arrB.reduce((s, v) => s + v, 0) / arrB.length : -Infinity;
      return avgB - avgA;
    });

    // بناء مصفوفة البيانات: [categoryIndex, fundIndex, return]
    const seriesData = [];
    const categories = [];
    const fundNames = [];
    let maxRet = -Infinity, minRet = Infinity;
    sortedCats.forEach((cat, catIdx) => {
      categories.push(cat);
      const funds = groups[cat];
      // ترتيب الصناديق داخل الفئة تنازلياً حسب العائد
      funds.sort((a, b) => (getReturn(b, horizon) || -Infinity) - (getReturn(a, horizon) || -Infinity));
      funds.forEach((f, fundIdx) => {
        const ret = getReturn(f, horizon);
        if (ret !== null) {
          if (ret > maxRet) maxRet = ret;
          if (ret < minRet) minRet = ret;
        }
        const name = f.canonical_name || 'غير مسمى';
        // نضيف اسم الصندوق فقط في أول مرة
        if (catIdx === 0) fundNames.push(name);
        seriesData.push([catIdx, fundIdx, ret !== null ? ret : 0]);
      });
    });

    // إذا كانت البيانات فارغة
    if (seriesData.length === 0) {
      chart.setOption({
        title: { text: 'لا توجد بيانات', left: 'center', top: 'center', textStyle: { color: '#8993a5', fontSize: 14 } }
      });
      return;
    }

    // إعداد الخيارات
    const option = {
      tooltip: {
        trigger: 'item',
        formatter: function(params) {
          const catIdx = params.data[0];
          const fundIdx = params.data[1];
          const ret = params.data[2];
          const cat = categories[catIdx];
          const fund = data.filter(f => f.displayCategory === cat)[fundIdx];
          if (!fund) return '';
          const score = safeNumber(fund.smart?.final_score);
          let html = `<strong>${escapeHTML(fund.canonical_name || 'غير مسمى')}</strong><br/>`;
          html += `الفئة: ${escapeHTML(cat)}<br/>`;
          html += `العائد: ${ret !== null ? formatReturn(ret) : '—'}<br/>`;
          if (score !== null) html += `Smart Score: ${formatNumber(score,0)}<br/>`;
          html += `المدير: ${escapeHTML(fund.management_company || '—')}<br/>`;
          if (fund.nav !== undefined && fund.nav !== null) html += `NAV: ${formatNumber(fund.nav)} ${escapeHTML(fund.currency || '')}<br/>`;
          return html;
        },
        backgroundColor: '#0d121b',
        borderColor: '#2a3346',
        textStyle: { color: '#f3f4f6', fontSize: 12 }
      },
      grid: { left: '10%', right: '5%', top: '5%', bottom: '10%', containLabel: true },
      xAxis: {
        type: 'category',
        data: fundNames,
        splitArea: { show: true },
        axisLabel: { rotate: 45, fontSize: 9, color: '#8993a5', interval: 0 },
        axisLine: { show: false }
      },
      yAxis: {
        type: 'category',
        data: categories,
        splitArea: { show: true },
        axisLabel: { fontSize: 11, fontWeight: 600, color: '#f3f4f6' },
        axisLine: { show: false }
      },
      visualMap: {
        min: minRet !== Infinity ? minRet : -10,
        max: maxRet !== -Infinity ? maxRet : 10,
        calculable: true,
        orient: 'horizontal',
        left: 'center',
        bottom: 0,
        inRange: {
          color: ['#7f1d1d', '#303640', '#0aa978', '#34d399']
        },
        textStyle: { color: '#8993a5' }
      },
      series: [{
        name: 'العائد',
        type: 'heatmap',
        data: seriesData,
        label: {
          show: false
        },
        emphasis: {
          itemStyle: { borderColor: '#fff', borderWidth: 2 }
        },
        itemStyle: {
          borderColor: 'rgba(0,0,0,0.2)',
          borderWidth: 1
        }
      }]
    };

    chart.setOption(option, true);
    chart.on('click', function(params) {
      const catIdx = params.data[0];
      const fundIdx = params.data[1];
      const cat = categories[catIdx];
      const fund = data.filter(f => f.displayCategory === cat)[fundIdx];
      if (fund) openDrawer(fund.fund_id);
    });

    // إعادة الرسم عند تغيير الحجم
    window.addEventListener('resize', function() {
      chart.resize();
    });
  }

  /* ============================================================
     TREEMAP باستخدام ECharts
     ============================================================ */
  function renderTreemap(data, horizon) {
    const dom = document.getElementById('treemapChart');
    if (!state.treemapChart) {
      state.treemapChart = echarts.init(dom);
    }
    const chart = state.treemapChart;
    chart.resize();

    // تجميع حسب الفئة
    const groups = {};
    data.forEach(f => {
      const cat = f.displayCategory || 'فئات أخرى';
      if (!groups[cat]) groups[cat] = [];
      groups[cat].push(f);
    });

    // بناء بيانات treemap
    const children = Object.keys(groups).map(cat => {
      const funds = groups[cat];
      const returns = funds.map(f => getReturn(f, horizon)).filter(r => r !== null);
      const avgRet = returns.length ? returns.reduce((a, b) => a + b, 0) / returns.length : null;
      const scores = funds.map(f => safeNumber(f.smart?.final_score)).filter(s => s !== null);
      const avgScore = scores.length ? scores.reduce((a, b) => a + b, 0) / scores.length : null;
      return {
        name: cat,
        value: funds.length, // حجم الفئة = عدد الصناديق
        avgReturn: avgRet,
        avgScore: avgScore,
        count: funds.length,
        funds: funds
      };
    });

    if (children.length === 0) {
      chart.setOption({
        title: { text: 'لا توجد بيانات', left: 'center', top: 'center', textStyle: { color: '#8993a5', fontSize: 14 } }
      });
      return;
    }

    // حساب نطاق العائدات للألوان
    const allReturns = children.map(c => c.avgReturn).filter(r => r !== null);
    const minRet = allReturns.length ? Math.min(...allReturns) : -10;
    const maxRet = allReturns.length ? Math.max(...allReturns) : 10;

    const option = {
      tooltip: {
        trigger: 'item',
        formatter: function(params) {
          const data = params.data;
          if (!data) return '';
          const cat = data.name;
          const count = data.count || 0;
          const avgRet = data.avgReturn;
          const avgScore = data.avgScore;
          let html = `<strong>${escapeHTML(cat)}</strong><br/>`;
          html += `عدد الصناديق: ${count}<br/>`;
          html += `متوسط العائد: ${avgRet !== null ? formatReturn(avgRet) : '—'}<br/>`;
          if (avgScore !== null) html += `متوسط Smart Score: ${formatNumber(avgScore,0)}<br/>`;
          return html;
        },
        backgroundColor: '#0d121b',
        borderColor: '#2a3346',
        textStyle: { color: '#f3f4f6', fontSize: 12 }
      },
      series: [{
        type: 'treemap',
        data: children.map(c => ({
          name: c.name,
          value: c.value,
          avgReturn: c.avgReturn,
          count: c.count,
          funds: c.funds,
          itemStyle: {
            color: c.avgReturn !== null ? getColor(c.avgReturn, minRet, maxRet) : '#2a3346'
          }
        })),
        leafDepth: 0,
        label: {
          show: true,
          formatter: function(params) {
            const data = params.data;
            return data.name + '\n' + (data.avgReturn !== null ? formatReturn(data.avgReturn) : '—');
          },
          fontSize: 11,
          fontWeight: 500,
          color: '#fff',
          textShadow: '0 1px 4px rgba(0,0,0,0.5)'
        },
        upperLabel: { show: false },
        roam: true,
        nodeClick: 'link',
        breadcrumb: { show: false },
        itemStyle: {
          borderColor: '#090d14',
          borderWidth: 2,
          gapWidth: 2
        },
        emphasis: {
          itemStyle: {
            borderColor: '#fff',
            borderWidth: 3
          }
        }
      }]
    };

    chart.setOption(option, true);
    chart.on('click', function(params) {
      const data = params.data;
      if (data && data.funds && data.funds.length) {
        openDrawerCategory(data.name, data.funds);
      }
    });

    window.addEventListener('resize', function() {
      chart.resize();
    });
  }

  /* ============================================================
     CARDS
     ============================================================ */
  function renderCards(data, horizon) {
    const container = document.getElementById('cardsContainer');
    const groups = {};
    data.forEach(f => {
      const cat = f.displayCategory || 'فئات أخرى';
      if (!groups[cat]) groups[cat] = [];
      groups[cat].push(f);
    });

    let html = '';
    Object.keys(groups).forEach(cat => {
      const funds = groups[cat];
      const returns = funds.map(f => getReturn(f, horizon)).filter(r => r !== null);
      const avgRet = returns.length ? returns.reduce((s, v) => s + v, 0) / returns.length : null;
      const scores = funds.map(f => safeNumber(f.smart?.final_score)).filter(s => s !== null);
      const avgScore = scores.length ? scores.reduce((a, b) => a + b, 0) / scores.length : null;
      const maxScore = scores.length ? Math.max(...scores) : null;
      const validRatio = funds.length ? (returns.length / funds.length * 100) : 0;

      // أفضل وأسوأ صندوق
      let best = null, worst = null;
      if (returns.length) {
        const sorted = funds.slice().sort((a, b) => (getReturn(b, horizon) || -Infinity) - (getReturn(a, horizon) || -Infinity));
        best = sorted[0];
        worst = sorted[sorted.length - 1];
      }

      html += `<div class="cat-card" data-category="${escapeHTML(cat)}">
        <h3>${escapeHTML(cat)}</h3>
        <div class="metric"><span class="muted">عدد الصناديق</span><span>${funds.length}</span></div>
        <div class="metric"><span class="muted">متوسط العائد</span><span>${avgRet !== null ? formatReturn(avgRet) : '—'}</span></div>
        <div class="metric"><span class="muted">أفضل صندوق</span><span>${best ? escapeHTML(best.canonical_name || 'غير مسمى') : '—'}</span></div>
        <div class="metric"><span class="muted">أسوأ صندوق</span><span>${worst ? escapeHTML(worst.canonical_name || 'غير مسمى') : '—'}</span></div>
        <div class="metric"><span class="muted">متوسط Smart Score</span><span>${avgScore !== null ? formatNumber(avgScore,0) : '—'}</span></div>
        <div class="metric"><span class="muted">أعلى Smart Score</span><span>${maxScore !== null ? formatNumber(maxScore,0) : '—'}</span></div>
        <div class="metric"><span class="muted">نسبة البيانات الصالحة</span><span>${validRatio.toFixed(0)}%</span></div>
      </div>`;
    });
    container.innerHTML = html;

    container.querySelectorAll('.cat-card').forEach(el => {
      el.addEventListener('click', function() {
        const cat = this.dataset.category;
        const funds = data.filter(f => (f.displayCategory || 'فئات أخرى') === cat);
        if (funds.length) openDrawerCategory(cat, funds);
      });
    });
  }

  /* ============================================================
     AXES
     ============================================================ */
  function renderAxes(data) {
    const container = document.getElementById('axes');
    const axes = [
      { key: 'performance_score', label: 'الأداء' },
      { key: 'risk_score', label: 'المخاطرة' },
      { key: 'benchmark_score', label: 'المقارنة' },
      { key: 'consistency_score', label: 'الاستمرارية' },
      { key: 'inflation_score', label: 'التضخم' }
    ];
    let html = '';
    axes.forEach(ax => {
      let maxVal = null, maxFund = null;
      data.forEach(f => {
        const val = safeNumber(f.smart?.[ax.key]);
        if (val !== null && (maxVal === null || val > maxVal)) {
          maxVal = val;
          maxFund = f;
        }
      });
      html += `<div class="axis-item">
        <div class="label">${ax.label}</div>
        <div class="value">${maxVal !== null ? formatNumber(maxVal,0) : '—'}</div>
        <div class="fund-name">${maxFund ? escapeHTML(maxFund.canonical_name || 'غير مسمى') : '—'}</div>
      </div>`;
    });
    container.innerHTML = html;
  }

  /* ============================================================
     DISTRIBUTION
     ============================================================ */
  function renderDistribution(data) {
    const container = document.getElementById('distribution');
    const label = document.getElementById('distributionLabel');
    const scores = data.map(f => safeNumber(f.smart?.final_score)).filter(s => s !== null);
    if (scores.length === 0) {
      container.innerHTML = '';
      label.textContent = 'لا توجد درجات لعرض التوزيع';
      return;
    }

    const bins = [
      { min: 0, max: 19, label: '<20' },
      { min: 20, max: 39, label: '20–39' },
      { min: 40, max: 59, label: '40–59' },
      { min: 60, max: 79, label: '60–79' },
      { min: 80, max: 89, label: '80–89' },
      { min: 90, max: 100, label: '90–100' }
    ];
    const counts = bins.map(() => 0);
    scores.forEach(s => {
      for (let i = 0; i < bins.length; i++) {
        if (s >= bins[i].min && s <= bins[i].max) { counts[i]++; break; }
      }
    });
    const total = scores.length;
    const colors = ['#7f1d1d','#991b1b','#b4232d','#064e3b','#0aa978','#34d399'];
    let barHtml = '';
    counts.forEach((c, i) => {
      const pct = (c / total) * 100;
      barHtml += `<div class="seg" style="width:${pct}%;background:${colors[i]};" title="${bins[i].label}: ${c} (${pct.toFixed(1)}%)"></div>`;
    });
    container.innerHTML = barHtml;

    const avg = scores.reduce((a, b) => a + b, 0) / total;
    label.textContent = `مجموع ${total} درجة | المتوسط ${formatNumber(avg,0)} | التوزيع حسب الفئات`;
  }

  /* ============================================================
     DRAWER
     ============================================================ */
  function openDrawer(fundId) {
    const fund = state.allFunds.find(f => f.fund_id === fundId);
    if (!fund) return;
    const drawer = document.getElementById('drawer');
    const mask = document.getElementById('mask');
    drawer.classList.add('on');
    mask.classList.add('on');

    let html = `<button class="drawer-close" onclick="closeDrawer()">✕ إغلاق</button>`;
    html += `<div class="fund-row">
      <b>${escapeHTML(fund.canonical_name || 'غير مسمى')}</b>
      <div class="fund-meta">${escapeHTML(fund.management_company || '')}</div>
      <div class="fund-data">الفئة: ${escapeHTML(fund.category || '—')}</div>
      <div class="fund-data">التصنيف: ${escapeHTML(fund.metadata?.classification || '—')}</div>
      ${fund.nav !== undefined && fund.nav !== null ? `<div class="fund-data">NAV: ${formatNumber(fund.nav)} ${escapeHTML(fund.currency || '')}</div>` : ''}
      ${fund.as_of_date ? `<div class="fund-data">تاريخ NAV: ${escapeHTML(fund.as_of_date)}</div>` : ''}
      ${fund.smart ? `
        <div class="fund-data">الدرجة النهائية: ${formatNumber(fund.smart.final_score,0)}</div>
        <div class="fund-data">التقييم: ${escapeHTML(fund.smart.rating || '—')}</div>
        <div class="fund-data">الترتيب المؤهل: ${escapeHTML(fund.smart.qualified_rank || '—')}</div>
        <div class="fund-data">Data Tier: ${escapeHTML(fund.smart.data_tier || '—')}</div>
        <div class="fund-data">Data Confidence: ${escapeHTML(fund.smart.data_confidence || '—')}</div>
        <div class="fund-data">Track Factor: ${formatNumber(fund.smart.track_factor,2)}</div>
      ` : ''}
      ${fund.price_update_url ? `<a class="fund-link" href="${escapeHTML(fund.price_update_url)}" target="_blank">عرض المصدر</a>` : ''}
    </div>`;
    drawer.innerHTML = html;
  }

  function openDrawerCategory(cat, funds) {
    const drawer = document.getElementById('drawer');
    const mask = document.getElementById('mask');
    drawer.classList.add('on');
    mask.classList.add('on');

    let html = `<button class="drawer-close" onclick="closeDrawer()">✕ إغلاق</button>`;
    html += `<h3 style="font-size:16px;margin-bottom:12px;">صناديق الفئة: ${escapeHTML(cat)}</h3>`;
    funds.forEach(f => {
      const ret = getReturn(f, state.currentHorizon);
      html += `<div class="fund-row" style="cursor:pointer;" onclick="openDrawer('${escapeHTML(f.fund_id)}')">
        <b>${escapeHTML(f.canonical_name || 'غير مسمى')}</b>
        <div class="fund-meta">${escapeHTML(f.management_company || '')}</div>
        <div class="fund-data">العائد: ${ret !== null ? formatReturn(ret) : '—'}</div>
      </div>`;
    });
    drawer.innerHTML = html;
  }

  function closeDrawer() {
    document.getElementById('drawer').classList.remove('on');
    document.getElementById('mask').classList.remove('on');
  }

  /* ============================================================
     STATUS
     ============================================================ */
  function setStatus(msg, isSuccess) {
    const dot = document.getElementById('statusDot');
    const text = document.getElementById('statusText');
    text.textContent = msg;
    if (isSuccess === true) dot.className = 'dot';
    else if (isSuccess === false) dot.className = 'dot error';
  }

  /* ============================================================
     EVENT BINDING
     ============================================================ */
  document.addEventListener('DOMContentLoaded', function() {
    // تبديل طرق العرض
    document.querySelectorAll('.views button').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.views button').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        const view = this.dataset.view;
        document.querySelectorAll('.section').forEach(s => s.classList.add('hidden'));
        if (view === 'heat') document.getElementById('viewHeat').classList.remove('hidden');
        else if (view === 'tree') document.getElementById('viewTree').classList.remove('hidden');
        else if (view === 'cards') document.getElementById('viewCards').classList.remove('hidden');
        // إعادة ضبط حجم الرسوم البيانية عند التبديل
        setTimeout(() => {
          if (state.heatmapChart) state.heatmapChart.resize();
          if (state.treemapChart) state.treemapChart.resize();
        }, 100);
      });
    });

    // الفلاتر
    document.querySelectorAll('.filters select, .filters input').forEach(el => {
      el.addEventListener('change', applyFiltersAndRender);
    });
    document.getElementById('manager').addEventListener('input', applyFiltersAndRender);

    document.getElementById('reset').addEventListener('click', function() {
      document.querySelectorAll('.filters select').forEach(s => s.value = '');
      document.getElementById('manager').value = '';
      applyFiltersAndRender();
    });

    document.getElementById('mask').addEventListener('click', closeDrawer);

    loadData();
  });

  // جعل الدوال عامة للاستخدام في onclick
  window.openDrawer = openDrawer;
  window.openDrawerCategory = openDrawerCategory;
  window.closeDrawer = closeDrawer;

  // إعادة ضبط حجم الرسوم البيانية عند تغيير حجم النافذة
  window.addEventListener('resize', function() {
    if (state.heatmapChart) state.heatmapChart.resize();
    if (state.treemapChart) state.treemapChart.resize();
  });
</script>
</body>
</html>
