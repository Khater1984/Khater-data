<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>الصناديق — خريطة الفلوس</title>
<link rel="stylesheet" href="css/app.css"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@500;600&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0f1412;--card:#171e1b;--line:#2c3832;--text:#eef3ef;--mute:#8fa198;--good:#5ecf8a;--bad:#e07a6e;--acc:#c9a45c}
*{box-sizing:border-box} html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:"IBM Plex Sans Arabic",sans-serif}
body{display:grid;grid-template-rows:auto auto 1fr}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-bottom:1px solid var(--line)}
.brand{font-weight:700} .brand small{display:block;color:var(--mute);font-weight:400;font-size:12px}
a{color:var(--acc);text-decoration:none}
.filters{display:flex;gap:8px;flex-wrap:wrap;padding:12px 22px;border-bottom:1px solid var(--line);background:#141a18}
input,select{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;height:36px;padding:0 10px;font:inherit}
.ws{display:grid;grid-template-columns:1fr 340px;min-height:0}
@media(max-width:1000px){.ws{grid-template-columns:1fr}}
.list{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{position:sticky;top:0;background:#171e1b;color:var(--mute);font-weight:500;text-align:right;padding:10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid #22302a;cursor:pointer}
tr:hover td{background:#1b2420} tr.on td{background:#24332c}
.dna{border-inline-start:1px solid var(--line);overflow:auto;background:#141a18}
.h{padding:12px 14px;border-bottom:1px solid var(--line);color:var(--mute);font-size:12px}
.box{padding:12px 14px;border-bottom:1px solid #22302a}
.box em{display:block;color:var(--mute);font-style:normal;font-size:11px}
.box b{font-weight:600}
.up{color:var(--good)} .dn{color:var(--bad)}
.bar{display:grid;grid-template-columns:72px 1fr 64px;gap:8px;align-items:center;margin:7px 0;font-size:12px}
.track{height:7px;background:#22302a;border-radius:99px;overflow:hidden}
.fill{height:7px}
</style></head>
<body>
<header>
  <div class="brand">سجل الصناديق<small>فلاتر + البصمة الكاملة للصندوق</small></div>
  <nav>
      <a href="./index.html">البداية</a>
      <a href="./map.html">ماذا حدث للفلوس؟</a>
      <a class="active" href="./funds.html">الصناديق</a>
      <a href="./macro.html">الاقتصاد</a>
      <a href="./why.html">المنهج</a>
    </nav>
</header>
<div class="filters">
  <input id="q" placeholder="ابحث بالاسم أو المدير"/>
  <select id="bucket"><option value="">كل الأنواع</option></select>
  <select id="mgr"><option value="">كل المديرين</option></select>
  <select id="priced"><option value="">السعر</option><option value="1">NAV حي</option><option value="0">بدون سعر</option></select>
  <select id="sort"><option value="last12m">ترتيب: 12 شهراً</option><option value="ytd">YTD</option><option value="3y">3 سنوات</option><option value="nav">NAV</option><option value="name">الاسم</option></select>
  <span id="count" style="color:var(--mute);align-self:center"></span>
</div>
<div class="ws">
  <div class="list">
    <table><thead><tr><th>الصندوق</th><th>النوع</th><th>NAV</th><th>YTD</th><th>12M</th><th>3Y</th></tr></thead><tbody id="tb"></tbody></table>
  </div>
  <aside class="dna" id="dna"><div class="h">اختر صندوقاً لعرض بصمته</div></aside>
</div>
<script>
const H=[["weekly","أسبوع"],["4weeks","4 أسابيع"],["ytd","منذ بداية العام"],["last12m","12 شهراً"],["2y","سنتان"],["3y","3 سنوات"],["4y","4 سنوات"],["5y","5 سنوات"],["6y","6 سنوات"]];
const bucket=c=>{c=(c||"").toLowerCase();
 if(c.includes("gold"))return "ذهب"; if(c.includes("equity")||c.includes("index")||c.includes("thematic")||c.includes("sector"))return "أسهم";
 if(c.includes("money market"))return "نقدي"; if(c.includes("fixed income"))return "دخل ثابت";
 if(c.includes("balanced")||c.includes("mixed")||c.includes("allocator"))return "متوازن";
 if(c.includes("etf")||c.includes("traded"))return "متداول"; if(c.includes("protected")||c.includes("guaranteed"))return "محمي";
 if(c.includes("charitable"))return "خيري"; return "أخرى";};
const fmt=(n,d=2)=>n==null?"—":Number(n).toLocaleString("ar-EG",{maximumFractionDigits:d});
const cls=n=>n==null?"":(n>=0?"up":"dn");
const ret=(f,h)=>f.eima&&f.eima[h]&&f.eima[h].ret!=null?f.eima[h].ret:null;
let ALL=[],SEL=null;
function apply(){
  const q=qel("q").value.trim(),b=qel("bucket").value,m=qel("mgr").value,p=qel("priced").value,s=qel("sort").value;
  let rows=ALL.filter(f=>
    (!q||(f.name+(f.manager||"")).includes(q)) && (!b||bucket(f.category)===b) && (!m||f.manager===m) &&
    (p!=="1"||f.nav!=null) && (p!=="0"||f.nav==null)
  );
  rows.sort((a,c)=>{
    if(s==="name") return a.name.localeCompare(c.name,"ar");
    const av=s==="nav"?a.nav:ret(a,s), cv=s==="nav"?c.nav:ret(c,s);
    return (cv??-1e9)-(av??-1e9);
  });
  qel("count").textContent=rows.length+" صندوقاً";
  qel("tb").innerHTML=rows.map(f=>`<tr data-id="${f.id}" class="${SEL&&SEL.id===f.id?"on":""}">
    <td>${f.name}<div style="color:var(--mute);font-size:11px">${f.manager||""}</div></td>
    <td>${bucket(f.category)}</td><td>${fmt(f.nav)}</td>
    <td class="${cls(ret(f,"ytd"))}">${fmt(ret(f,"ytd"),1)}</td>
    <td class="${cls(ret(f,"last12m"))}">${fmt(ret(f,"last12m"),1)}</td>
    <td class="${cls(ret(f,"3y"))}">${fmt(ret(f,"3y"),1)}</td></tr>`).join("");
  qel("tb").querySelectorAll("tr").forEach(tr=>tr.onclick=()=>{SEL=ALL.find(x=>x.id===tr.dataset.id);paint();apply();});
}
function paint(){
  const f=SEL; if(!f)return;
  const vs=f.nav!=null&&f.initial?f.nav/f.initial:null;
  const bars=H.map(([h,lab])=>{
    const v=ret(f,h); if(v==null)return "";
    const w=Math.min(100,Math.abs(v)/3);
    return `<div class="bar"><span>${lab}</span><div class="track"><div class="fill" style="width:${Math.max(w,3)}%;background:${v>=0?"var(--good)":"var(--bad)"}"></div></div><span class="${cls(v)}">${fmt(v,1)}%</span></div>`;
  }).join("");
  qel("dna").innerHTML=`<div class="h">بصمة الصندوق</div>
    <div class="box"><em>الاسم</em><b>${f.name}</b></div>
    <div class="box"><em>مدير الاستثمار</em><b>${f.manager||"—"}</b></div>
    <div class="box"><em>النوع</em><b>${bucket(f.category)}</b></div>
    <div class="box"><em>آخر سعر</em><b>${fmt(f.nav)} ${f.currency||""}</b><em>${f.nav_asof||""}</em></div>
    <div class="box"><em>التأسيس / الاسمية</em><b>${f.inception||"—"} · ${fmt(f.initial)}</b></div>
    <div class="box"><em>مقابل الاسمية</em><b class="${cls((vs||1)-1)}">${vs?fmt(vs,2)+"×":"—"}</b></div>
    <div class="box"><em>تقرير EIMA</em><b>${f.eima_asof||"—"}</b></div>
    <div class="h">آفاق العائد</div>
    <div class="box">${bars||"لا بيانات آفاق"}</div>
    <div class="box"><em>المصدر</em>${f.url?`<a href="${f.url}" target="_blank">رابط التحديث</a>`:"—"}<div style="color:var(--mute);font-size:11px;margin-top:6px">${f.category||""}</div></div>`;
}
const qel=id=>document.getElementById(id);
fetch("data/funds_dna.json").then(r=>r.json()).then(d=>{
  ALL=d.funds;
  [...new Set(ALL.map(f=>bucket(f.category)))].sort().forEach(b=>qel("bucket").insertAdjacentHTML("beforeend",`<option>${b}</option>`));
  [...new Set(ALL.map(f=>f.manager).filter(Boolean))].sort().forEach(b=>qel("mgr").insertAdjacentHTML("beforeend",`<option>${b}</option>`));
  ["q","bucket","mgr","priced","sort"].forEach(id=>qel(id).oninput=apply);
  apply();
});
</script></body></html>
