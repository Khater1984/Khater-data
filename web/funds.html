<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>الصناديق</title>
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/app.css"/>
<style>
  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--bg2)}
  .bar input,.bar select{min-width:160px}
  table td,table th{white-space:nowrap}
  td.name,th.name{white-space:normal;min-width:220px}
  .tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px}
  .tag.yes{background:#143324;color:var(--good)}
  .tag.no{background:#3a1c18;color:var(--bad)}
  .tag.na{background:#1c1c1c;color:var(--mute)}
  .num{font-family:"IBM Plex Sans",sans-serif;direction:ltr;unicode-bidi:isolate}
</style>
</head>
<body>
<header class="site-header"><div class="wrap">
  <div class="logo">خريطة الفلوس<span>الصناديق مقابل مرجع واحد تختاره</span></div>
  <nav>
    <a href="./index.html">البداية</a>
    <a href="./map.html">ماذا حدث للفلوس؟</a>
    <a class="active" href="./funds.html">الصناديق</a>
    <a href="./macro.html">الاقتصاد</a>
    <a href="./why.html">المنهج</a>
  </nav>
</div></header>
<div class="bar">
  <input id="q" placeholder="اسم الصندوق أو المدير"/>
  <select id="bucket"><option value="">النوع</option></select>
  <select id="mgr"><option value="">المدير</option></select>
  <select id="horizon">
    <option value="last12m">آخر 12 شهراً</option>
    <option value="ytd">منذ بداية العام</option>
    <option value="3y">3 سنوات</option>
  </select>
  <select id="bench">
    <option value="egx30">المرجع: EGX30</option>
    <option value="cpi">المرجع: التضخم</option>
    <option value="usd">المرجع: الدولار</option>
    <option value="gold">المرجع: الذهب</option>
    <option value="spy">المرجع: SPY</option>
    <option value="deposit">المرجع: وديعة</option>
    <option value="tbill">المرجع: أذون 91</option>
  </select>
  <span class="muted" id="meta"></span>
</div>
<div class="wrap" style="padding:0">
<table>
  <thead>
    <tr>
      <th class="name">الصندوق</th>
      <th>النوع</th>
      <th>NAV</th>
      <th>عائد الصندوق</th>
      <th>عائد المرجع</th>
      <th>النتيجة</th>
    </tr>
  </thead>
  <tbody id="tb"></tbody>
</table>
</div>
<p class="wrap muted">العوائد من تقرير EIMA بتاريخ المرجع المعروض. اضغط الصف لفتح البصمة. بعض أرقام EIMA قد تكون شاذة ونظهرها كما نُشرت.</p>
<script type="module">
import { loadFundBook } from "./js/live.js";
import { bucket } from "./js/engine.js";
const LAB={cpi:"التضخم",usd:"الدولار",gold:"الذهب",egx30:"EGX30",spy:"SPY",deposit:"الوديعة",tbill:"أذون 91"};
const pct=v=>v==null?"—":Number(v).toLocaleString("en-US",{maximumFractionDigits:1})+"%";
const num=v=>v==null?"—":Number(v).toLocaleString("en-US",{maximumFractionDigits:2});
const ret=(f,h)=>f.eima?.[h]?.ret!=null?Number(f.eima[h].ret):null;
const packed=await loadFundBook();
const ALL=packed.funds;
const BENCH=await (await fetch("data/benchmarks.json")).json();
[...new Set(ALL.map(f=>bucket(f.category)))].sort().forEach(b=>document.getElementById("bucket").insertAdjacentHTML("beforeend",`<option>${b}</option>`));
[...new Set(ALL.map(f=>f.manager).filter(Boolean))].sort().forEach(b=>document.getElementById("mgr").insertAdjacentHTML("beforeend",`<option>${b}</option>`));
function draw(){
  const q=document.getElementById("q").value.trim();
  const b=document.getElementById("bucket").value;
  const m=document.getElementById("mgr").value;
  const h=document.getElementById("horizon").value;
  const k=document.getElementById("bench").value;
  const bench=(BENCH.horizons[h]||{})[k];
  document.getElementById("meta").textContent=`${ALL.length} صندوق · المرجع حتى ${BENCH.as_of} = ${pct(bench)}`;
  let rows=ALL.filter(f=>
    (!q||(f.name+(f.manager||"")).toLowerCase().includes(q.toLowerCase())) &&
    (!b||bucket(f.category)===b) && (!m||f.manager===m)
  );
  rows.sort((a,c)=>(ret(c,h)??-1e9)-(ret(a,h)??-1e9));
  document.getElementById("tb").innerHTML=rows.map(f=>{
    const r=ret(f,h);
    let tag='<span class="tag na">لا بيانات</span>';
    if(r!=null && bench!=null) tag = r>=bench ? '<span class="tag yes">تفوّق</span>' : '<span class="tag no">تخلّف</span>';
    return `<tr onclick="location.href='fund.html?id=${encodeURIComponent(f.id)}&h=${h}&b=${k}'">
      <td class="name">${f.name}<div class="muted">${f.manager||""}</div></td>
      <td>${bucket(f.category)}</td>
      <td class="num">${num(f.nav)}</td>
      <td class="num">${pct(r)}</td>
      <td class="num">${pct(bench)}</td>
      <td>${tag}</td>
    </tr>`;
  }).join("");
}
["q","bucket","mgr","horizon","bench"].forEach(id=>document.getElementById(id).oninput=draw);
draw();
</script>
</body></html>
