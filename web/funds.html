<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>الصناديق</title>
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/app.css"/>
</head>
<body>
<header class="site-header"><div class="wrap">
  <div class="logo">خريطة الفلوس<span id="src">الصناديق</span></div>
  <nav>
    <a href="./index.html">البداية</a>
    <a href="./map.html">ماذا حدث للفلوس؟</a>
    <a class="active" href="./funds.html">الصناديق</a>
    <a href="./categories.html">خريطة الفئات</a>
    <a href="./macro.html">الاقتصاد</a>
  </nav>
</div></header>
<div class="toolbar">
  <input id="q" placeholder="بحث عن صندوق"/>
  <select id="bucket"><option value="">كل الفئات</option></select>
  <select id="horizon">
    <option value="last12m">12 شهراً (سنوي)</option>
    <option value="ytd">منذ بداية العام</option>
    <option value="weekly">آخر أسبوع</option>
    <option value="2y">سنتان</option>
    <option value="3y">3 سنوات</option>
  </select>
  <span class="muted" id="meta"></span>
</div>
<p class="wrap muted" id="err"></p>
<table><thead><tr><th>#</th><th>الصندوق</th><th>الفئة</th><th>العائد</th><th>التقييم</th><th>التصنيف</th><th>الثقة</th></tr></thead><tbody id="tb"></tbody></table>
<script>
const CFG = window.KHATER || {};
const err = (m) => { document.getElementById("err").textContent = m; };
function bucket(c){
  c=(c||"").toLowerCase();
  if(c.includes("gold")) return "ذهب";
  if(c.includes("equity")||c.includes("index")||c.includes("thematic")||c.includes("sector")) return "أسهم";
  if(c.includes("money market")) return "نقدي";
  if(c.includes("fixed income")) return "دخل ثابت";
  if(c.includes("balanced")||c.includes("mixed")||c.includes("allocator")) return "متوازن";
  if(c.includes("etf")||c.includes("traded")) return "متداول";
  if(c.includes("protected")||c.includes("guaranteed")) return "محمي";
  if(c.includes("charitable")) return "خيري";
  return "أخرى";
}
(async () => {
  try {
    if(!CFG.url || !CFG.key) throw new Error("لا مفتاح عام في config.js");
    const r = await fetch(CFG.url + "/rest/v1/funds?select=fund_id,canonical_name,management_company,category,metadata&limit=1000", {
      headers: { apikey: CFG.key, Authorization: "Bearer " + CFG.key }
    });
    const raw = await r.json();
    if(!Array.isArray(raw)) throw new Error("استجابة غير متوقعة " + r.status);
    const latest = await (await fetch(CFG.url + "/rest/v1/fund_smartscore_latest?select=fund_id,final_score,rating,data_tier,data_confidence,score_as_of,performance_score,risk_score,benchmark_score,consistency_score,inflation_score&limit=1000", { headers: { apikey: CFG.key, Authorization: "Bearer " + CFG.key } })).json();
    const L = {};
    (Array.isArray(latest)?latest:[]).forEach(x => L[x.fund_id] = x);
    const ALL = raw.map(f => ({
      id: f.fund_id,
      name: f.canonical_name,
      manager: f.management_company || "",
      category: f.category,
      scores: (f.metadata || {}).scores || {},
      asof: (f.metadata || {}).scores_as_of,
      ss: L[f.fund_id] || null
    }));
    document.getElementById("src").textContent = "Smart Score V3 · " + ALL.length + " صندوق";
    [...new Set(ALL.map(f => bucket(f.category)))].sort().forEach(b => {
      document.getElementById("bucket").insertAdjacentHTML("beforeend", `<option>${b}</option>`);
    });
    const cell = (f,h) => f.scores[h] || {};
    const draw = () => {
      const q = document.getElementById("q").value.trim();
      const b = document.getElementById("bucket").value;
      const h = document.getElementById("horizon").value;
      let rows = ALL.filter(f => (!q || (f.name+f.manager).includes(q)) && (!b || bucket(f.category)===b));
      rows.sort((a,c) => ((c.ss&&c.ss.final_score) ?? -1) - ((a.ss&&a.ss.final_score) ?? -1));
      document.getElementById("meta").textContent = rows.length + " صف";
      document.getElementById("tb").innerHTML = rows.map((f,i) => {
        const s = cell(f,h);
        const ret = s.return_pct;
        return `<tr onclick="location.href='fund.html?id=${encodeURIComponent(f.id)}&h=${h}'">
          <td class="num">${i+1}</td>
          <td>${f.name}<div class="muted">${f.manager}</div></td>
          <td>${bucket(f.category)}</td>
          <td class="num">${ret==null?"—":Number(ret).toLocaleString("en-US",{maximumFractionDigits:1})+"%"}<div class="muted">${s.source==="eima_annual"?"سنوي":s.source==="eima_weekly"?"أسبوعي":""}</div></td>
          <td class="num score">${f.ss&&f.ss.final_score!=null?Number(f.ss.final_score).toFixed(1):"—"}</td>
          <td>${(f.ss&&f.ss.rating)||"—"}</td>
          <td>${(f.ss&&f.ss.data_confidence)||(s.conf)||"—"}</td>
        </tr>`;
      }).join("");
    };
    ["q","bucket","horizon"].forEach(id => document.getElementById(id).oninput = draw);
    draw();
  } catch (e) { err(String(e)); console.error(e); }
})();
</script>
</body></html>
