<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Fund DNA</title>
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/app.css"/>


<style>
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:800px){.kpis{grid-template-columns:1fr 1fr}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.chartbox{height:280px;direction:ltr}
.why{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.why .card em{display:block;color:var(--mute);font-size:11px}
.tag{border:1px solid #355e4a;color:#7dcc8a;border-radius:999px;padding:4px 10px;font-size:12px;margin:4px;display:inline-block}
</style>
</head>
<body>
<header class="site-header"><div class="wrap">
  <div class="logo">FUND DNA<span>من التقييم المخزّن في القاعدة</span></div>
  <nav><a href="./funds.html">عودة</a></nav>
</div></header>
<main class="wrap page" id="app">جاري التحميل…</main>
<script type="module">
import { bucket } from "./js/engine.js";
import { BENCH_META } from "./js/score.js";
import { svgBars } from "./js/viz.js";
const id=new URLSearchParams(location.search).get("id");
const h0=new URLSearchParams(location.search).get("h")||"last12m";
const CFG=window.KHATER||{};
const headers={apikey:CFG.key,Authorization:"Bearer "+CFG.key};
const rows=await (await fetch(CFG.url+"/rest/v1/funds?fund_id=eq."+encodeURIComponent(id)+"&select=fund_id,canonical_name,management_company,category,metadata",{headers})).json();
const ssRows=await (await fetch(CFG.url+"/rest/v1/fund_smartscore_latest?fund_id=eq."+encodeURIComponent(id)+"&select=final_score,raw_score,rating,data_tier,data_confidence,score_as_of,performance_score,risk_score,benchmark_score,consistency_score,inflation_score,score_explanation,risk_method,track_factor",{headers})).json();
const ss=ssRows[0]||null;
const raw=rows[0];
const BENCH=await (await fetch("data/benchmarks.json")).json();
const f=raw?{id:raw.fund_id,name:raw.canonical_name,manager:raw.management_company,category:raw.category,scores:(raw.metadata||{}).scores||{},scores_as_of:(raw.metadata||{}).scores_as_of||null}:null;
if(!f){document.getElementById("app").textContent="غير موجود"; throw 0;}
const HS=["weekly","4weeks","ytd","last12m","2y","3y","4y","5y","6y"];
const HL={weekly:"أسبوع","4weeks":"4 أسابيع",ytd:"YTD",last12m:"12M","2y":"2Y","3y":"3Y","4y":"4Y","5y":"5Y","6y":"6Y"};
const s=(f.scores||{})[h0]||{};
document.getElementById("app").innerHTML=`
  <div class="muted"><a href="./funds.html">الصناديق</a> · Smart Score V3 · ${ss&&ss.score_as_of?ss.score_as_of:"لا توجد بيانات متاحة"} · أفق العائد ${HL[h0]||h0}</div>
  <h1>${f.name}</h1>
  <p class="muted">${f.manager||""} · ${bucket(f.category)} · ليست توصية</p>
  <div class="kpis">
    <div class="kpi"><em>RETURN</em><b class="num">${s.return_pct==null?"—":s.return_pct.toLocaleString("en-US",{maximumFractionDigits:1})+"%"}</b></div>
    <div class="kpi"><em>SMART SCORE</em><b class="num score">${ss&&ss.final_score!=null?Number(ss.final_score).toFixed(1):"—"}</b></div>
    <div class="kpi"><em>RATING</em><b>${ss&&ss.rating?ss.rating:"—"}</b></div>
    <div class="kpi"><em>TIER</em><b>${ss&&ss.data_tier?ss.data_tier:"—"}</b></div>
  </div>
  <p class="muted">${ss&&ss.score_explanation?ss.score_explanation:""} · المعادلة 0.30P + 0.25R + 0.25B + 0.10C + 0.10I</p>
  <div class="kpis">
    <div class="kpi"><em>P</em><b>${ss&&ss.performance_score!=null?Number(ss.performance_score).toFixed(1):"—"}</b></div>
    <div class="kpi"><em>R</em><b>${ss&&ss.risk_score!=null?Number(ss.risk_score).toFixed(1):"—"}</b></div>
    <div class="kpi"><em>B</em><b>${ss&&ss.benchmark_score!=null?Number(ss.benchmark_score).toFixed(1):"—"}</b></div>
    <div class="kpi"><em>C</em><b>${ss&&ss.consistency_score!=null?Number(ss.consistency_score).toFixed(1):"—"}</b></div>
    <div class="kpi"><em>I</em><b>${ss&&ss.inflation_score!=null?Number(ss.inflation_score).toFixed(1):"—"}</b></div>
  </div>
  <p class="muted">عائد الأفق: ${s.source||"—"} · ${s.source_as_of||"—"}</p>
  <div class="grid2">
    <div class="card"><h3>العائد عبر الآفاق</h3><div id="retChart"></div></div>
    <div class="card"><h3>المراجع مقابل الصندوق — ${HL[h0]||h0}</h3><div id="benchChart"></div></div>
  </div>
  <div class="card" style="margin-top:12px">
    <h3>عقد البيانات في سوبربيس</h3>
    <table><thead><tr><th>الأفق</th><th>العائد</th><th>المصدر</th><th>تاريخ المصدر</th></tr></thead>
    <tbody>${HS.map(k=>{
      const x=(f.scores||{})[k]||{};
      return `<tr><td>${HL[k]}</td><td class="num">${x.return_pct==null?"—":Number(x.return_pct).toLocaleString("en-US",{maximumFractionDigits:1})+"%"}</td><td>${x.source||"—"}</td><td class="num">${x.source_as_of||"—"}</td></tr>`;
    }).join("")}</tbody></table>
  </div>
`;

const vals=BENCH.horizons[h0]||{};
const fundR=s.return_pct;
document.getElementById("retChart").innerHTML=svgBars(HS.map(k=>({label:HL[k],value:(f.scores||{})[k]?.return_pct})));
document.getElementById("benchChart").innerHTML=svgBars([
  {label:"الصندوق",value:fundR,color:"#d4b06a"},
  ...BENCH_META.map(([k,l])=>({label:l.replace("/EGP",""),value:vals[k],color:(fundR!=null&&vals[k]!=null&&fundR>=vals[k])?"#3ddc8a":"#5c6673"}))
]);
</script>
</body></html>
