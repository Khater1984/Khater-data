<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FUND DNA · Institutional Profile</title><script src="config.js"></script><link rel="stylesheet" href="css/app.css"><link rel="stylesheet" href="css/fund.css"></head><body><header class="site-header"><div class="wrap"><div class="logo">رادار السوق المصري<span>منصة فهم الاقتصاد وتحليل صناديق الاستثمار</span></div><nav><a href="./index.html">البداية</a><a href="./map.html">ماذا حدث للفلوس؟</a><a href="./funds.html">الصناديق</a><a href="./categories.html">خريطة الفئات</a><a href="./macro.html">الاقتصاد</a><a href="./why.html">المنهج</a></nav></div></header><main class="wrap fund-page" id="app"><div class="empty">جاري تحميل FUND DNA…</div></main><script src="js/fund-core.js"></script><script src="js/fund-performance.js"></script><script src="js/fund-risk.js"></script><script src="js/fund-benchmark.js"></script><script src="js/fund-smartscore.js"></script><script src="js/fund-evidence.js"></script><script src="js/fund-ops.js"></script><script>(async function(){'use strict';const F=window.FUND;const app=document.getElementById('app');try{const d=await F.loadFund(),f=d.fund,s=d.score;F.performance=d.performance;F.fund=f;F.score=s;const score=s.final_score==null?'—':Number(s.final_score).toFixed(1);const h=new URLSearchParams(location.search).get('h')||'last12m';const selected=d.performance.find(x=>x.horizon===h)||d.performance.find(x=>x.horizon==='last12m');app.innerHTML='<section class="hero"><div class="eyebrow">FUND DNA · INSTITUTIONAL PROFILE</div><h1>'+F.esc(f.canonical_name)+'</h1><div class="manager">'+F.esc((f.metadata&&f.metadata.profile&&(f.metadata.profile.manager_name_ar||f.metadata.profile.manager_name_en))||f.management_company)+'</div><div class="tags"><span class="tag">'+F.esc(f.category)+'</span><span class="tag">'+F.esc(s.data_tier)+'</span><span class="tag">'+F.esc(s.methodology_version)+'</span></div></section><se  id="performance-panel" class="tab-panel active"><div id="performance-tab"></div></section><section id="risk-panel" class="tab-panel"><div id="risk-tab"></div></section><section id="benchmark-panel" class="tab-panel"><div id="benchmark-tab"></div></section><section id="smartscore-panel" class="tab-panel"><div id="smartscore-tab"></div></section><section id="evidence-panel" class="tab-panel"><div id="evidence-tab"></div></section><section id="ops-panel" class="tab-panel"><div id="ops-tab"></div></section>';const tabInfo={performance:['Performance Intelligence','تحليل العائد وسجل الأداء المتاح فعليًا.'],risk:['Risk Intelligence','قراءة مركزة للمخاطر والعوامل المؤثرة.'],benchmark:['Market Context','مقارنة الصندوق بالمؤشرات والبدائل.'],smartscore:['SmartScore Architecture','تفكيك الدرجة إلى مكوناتها الأساسية.'],evidence:['Evidence & Method','مصادر البيانات والمنهجية وقابلية التحقق.'],ops:['Fund Profile','الهوية التشغيلية والمستندات والبيانات الرسمية.']};document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',async()=>{document.querySelectorAll('.tabs button').forEach(x=>{const on=x===b;x.classList.toggle('active',on);x.setAttribute('aria-selected',on?'true':'false')});document.querySelectorAll('.tab-panel').forEach(x=>x.classList.toggle('active',x.id===b.dataset.tab+'-panel'));const info=tabInfo[b.dataset.tab]||[];document.getElementById('tab-context-title').textContent=info[0]||'';document.getElementById('tab-context-copy').textContent=info[1]||'';const target=document.getElementById(b.dataset.tab+'-tab');target.classList.add('is-loading');try{const fn=FUND_TABS[b.dataset.tab];if(fn)await fn()}catch(e){target.innerHTML='<div class="empty"><strong>تعذر تحميل هذا المحور</strong><p>'+F.esc(e.message)+'</p></div>'}finally{target.classList.remove('is-loading')}}));await FUND_TABS.performance()}catch(e){app.innerHTML='<div class="empty"><h2>تعذر تحميل FUND DNA</h2><p>'+F.esc(e.message)+'</p><p><a href="./funds.html">العودة إلى الصناديق</a></p></div>';
