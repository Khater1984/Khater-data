<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FUND DNA</title>
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<style>
:root{--accent:#d4b06a;--good:#3ddc8a;--warn:#e0c27a;--bad:#ef7a6e;--blue:#7aa7ff;--panel:#111720;--line:#ffffff14;--mute:#8b95a5;--text:#eef2f6}
.dna-page{padding:28px 0 80px}.topline,.identity,.section-head,.selected-return{display:flex;justify-content:space-between;gap:16px}.topline{align-items:center;margin-bottom:14px}.crumb{font-size:12px;color:var(--mute)}.crumb a{color:var(--accent);text-decoration:none}.identity{align-items:end;margin-bottom:18px}.identity h1{font-size:clamp(28px,4vw,46px);margin:0 0 8px;letter-spacing:-.03em}.identity-meta,.status-line,.horizon-tabs{display:flex;flex-wrap:wrap;gap:7px}.identity-meta{color:var(--mute);font-size:13px}.pill{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:5px 10px;background:#111720}.pill.good{color:var(--good);border-color:#3ddc8a44}.pill.warn{color:var(--warn);border-color:#e0c27a44}.pill.bad{color:var(--bad);border-color:#ef7a6e44}.protection{max-width:410px;padding:13px 15px;border:1px solid #7aa7ff33;background:#7aa7ff08;border-radius:13px;color:#c7d8f7;font-size:11px;line-height:1.7}.protection b{color:var(--blue)}.pulse{display:grid;grid-template-columns:1.35fr repeat(4,1fr);gap:9px}.card{background:linear-gradient(180deg,#171d27,#11161e);border:1px solid var(--line);border-radius:16px}.pulse-card{padding:16px}.pulse-main{padding:20px}.label{display:block;color:var(--mute);font-size:10px;letter-spacing:.08em;text-transform:uppercase}.score-big{font:600 46px/1 "IBM Plex Sans",sans-serif;color:var(--accent);direction:ltr;margin-top:8px}.value{display:block;font:600 22px/1.2 "IBM Plex Sans",sans-serif;margin-top:9px;direction:ltr}.note{margin-top:8px;color:var(--mute);font-size:10px;line-height:1.5}.section-head{align-items:end;margin:28px 0 10px}.section-head h2{margin:0;font-size:20px}.section-head p{margin:0;color:var(--mute);font-size:11px}.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.score-card{padding:15px}.letter{font:600 13px "IBM Plex Sans",sans-serif;color:var(--accent)}.score-card strong{display:block;font:600 27px "IBM Plex Sans",sans-serif;margin-top:7px;direction:ltr}.meter{height:5px;background:#0b1016;border-radius:99px;overflow:hidden;margin-top:12px}.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}.section-card{padding:17px}.bar-row{display:grid;grid-template-columns:145px 1fr 85px;gap:10px;align-items:center;margin:13px 0}.bar-label{font-size:12px;font-weight:600}.bar-track{height:11px;background:#0b1016;border-radius:99px;overflow:hidden;border:1px solid #ffffff08}.bar-fill{height:100%;border-radius:99px;background:var(--accent)}.bar-fill.good{background:var(--good)}.bar-fill.bad{background:var(--bad)}.bar-value{text-align:left;font:500 12px "IBM Plex Sans",sans-serif;direction:ltr}.bench-meta{font-size:10px;color:var(--mute);margin-top:14px;padding-top:12px;border-top:1px solid var(--line);line-height:1.6}.risk-grid,.integrity-grid{display:grid;gap:9px}.risk-grid{grid-template-columns:repeat(3,1fr)}.integrity-grid{grid-template-columns:repeat(4,1fr)}.metric,.integrity{padding:15px;background:#111720;border:1px solid var(--line);border-radius:13px}.metric .label,.integrity .label{color:var(--mute);font-size:10px}.metric strong,.integrity strong{display:block;margin-top:7px;font-size:16px}.num{font:600 20px "IBM Plex Sans",sans-serif;direction:ltr}.warnings{margin-top:10px;padding:13px;border:1px solid #e0c27a44;background:#e0c27a08;border-radius:12px;color:#ead9ae;font-size:12px;line-height:1.7}.warnings.empty{border-color:#3ddc8a33;background:#3ddc8a07;color:#9be0b7}.evidence{padding:18px;border-inline-start:3px solid var(--accent);line-height:1.9}.evidence h3{margin:0 0 8px}.evidence p{margin:0;color:#d8dde4;font-size:14px}.raw{margin-top:12px}.raw summary{cursor:pointer;color:var(--accent);font-size:11px}.raw pre{margin-top:8px;background:#0b1016;border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;direction:ltr;text-align:left;font:11px/1.6 monospace;color:#aeb7c3}.performance{overflow:auto}.performance table{width:100%;min-width:760px;border-collapse:collapse}.performance th,.performance td{padding:10px;border-bottom:1px solid var(--line);font-size:11px;text-align:right}.performance th{color:var(--mute)}.horizon-tabs{margin-bottom:12px}.horizon-tabs a{padding:7px 10px;border:1px solid var(--line);border-radius:999px;color:var(--mute);font-size:11px;text-decoration:none}.horizon-tabs a.active{background:var(--accent);border-color:var(--accent);color:#16110a;font-weight:700}.selected-return{align-items:end;margin-bottom:12px}.selected-return .ret{font:600 31px "IBM Plex Sans",sans-serif;direction:ltr}.pos{color:var(--good)}.neg{color:var(--bad)}.empty-state{padding:28px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:13px}.error{color:#ffd4cf}.loading{padding:60px 20px;text-align:center;color:var(--mute)}
@media(max-width:980px){.pulse{grid-template-columns:repeat(3,1fr)}.pulse-main{grid-column:1/-1}.grid5{grid-template-columns:repeat(3,1fr)}.integrity-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:720px){.identity{display:block}.protection{max-width:none;margin-top:12px}.risk-grid,.grid5,.pulse{grid-template-columns:1fr 1fr}.pulse-main{grid-column:1/-1}.bar-row{grid-template-columns:100px 1fr 70px}.integrity-grid{grid-template-columns:1fr 1fr}}
@media(max-width:500px){.risk-grid,.grid5,.pulse,.integrity-grid{grid-template-columns:1fr}.pulse-main{grid-column:auto}.bar-row{grid-template-columns:92px 1fr 64px}.identity h1{font-size:28px}}
</style>
</head>
<body>
<header class="site-header"><div class="wrap"><div class="logo">FUND DNA<span>تحليل الصندوق من البيانات والتقييم المخزّن</span></div><nav><a href="./funds.html">عودة إلى الصناديق</a></nav></div></header>
<main class="wrap page dna-page" id="app"><div class="loading">جاري تحميل FUND DNA…</div></main>
<script>
(function(){'use strict';
const params=new URLSearchParams(location.search),id=params.get('id');let selectedH=params.get('h')||'last12m';
const CFG=window.KHATER||{},HDR={apikey:CFG.key,Authorization:'Bearer '+CFG.key};
const HS=['weekly','4weeks','ytd','last12m','1y','2y','3y','4y','5y','6y'];
const HL={weekly:'أسبوعي','4weeks':'4 أسابيع',ytd:'منذ بداية العام',last12m:'12 شهراً','1y':'سنة','2y':'سنتان','3y':'3 سنوات','4y':'4 سنوات','5y':'5 سنوات','6y':'6 سنوات'};
const BENCH={inflation:{label:'التضخم',series:'cpi_headline_mom_pct',type:'inflation'},tbill:{label:'أذون الخزانة 364 يوم',series:'tbill_364_avg_yield_pct',type:'yield'},btc:{label:'Bitcoin / EGP',series:'btc_egp',type:'level'},qqq:{label:'Nasdaq / EGP',series:'qqq_egp',type:'level'},spy:{label:'S&P 500 / EGP',series:'spy_egp',type:'level'},usd:{label:'USD / EGP',series:'usd_egp_mid',type:'level'},silver:{label:'Silver / EGP',series:'silver_egp_oz',type:'level'},gold:{label:'Gold / EGP',series:'gold_egp_oz',type:'level'},egx30:{label:'EGX 30',series:'egx30_close',type:'level'}};
const $=x=>document.getElementById(x),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),num=x=>x==null||Number.isNaN(Number(x))?'—':Number(x).toLocaleString('en-US',{maximumFractionDigits:2}),pct=x=>x==null?'—':num(x)+'%';
async function get(path){const r=await fetch(CFG.url+path,{headers:HDR});const text=await r.text();let j;try{j=text?JSON.parse(text):null}catch(e){throw Error('استجابة غير صالحة من Supabase')}if(!r.ok)throw Error((j&&j.message)||('HTTP '+r.status));return j}
function category(c){c=String(c||'').toLowerCase();if(c.includes('gold'))return'ذهب';if(c.includes('equity')||c.includes('index')||c.includes('thematic')||c.includes('sector'))return'أسهم';if(c.includes('money market'))return'نقدي';if(c.includes('fixed income'))return'دخل ثابت';if(c.includes('balanced')||c.includes('mixed')||c.includes('allocator'))return'متوازن';if(c.includes('etf')||c.includes('traded'))return'متداول';if(c.includes('protected')||c.includes('guaranteed'))return'محمي';return c||'غير مصنف'}
function startDate(end,h){const d=new Date(end+'T00:00:00Z');if(h==='weekly')d.setUTCDate(d.getUTCDate()-7);else if(h==='4weeks')d.setUTCDate(d.getUTCDate()-28);else if(h==='ytd')d.setUTCMonth(0,1);else if(h==='last12m')d.setUTCFullYear(d.getUTCFullYear()-1);else if(/^\dy$/.test(h))d.setUTCFullYear(d.getUTCFullYear()-Number(h[0]));else return null;return d.toISOString().slice(0,10)}
function cleanWarnings(w){if(w==null)return[];if(Array.isArray(w))return w.map(x=>typeof x==='string'?x:(x&&x.message)||((x&&x.code)||JSON.stringify(x)));if(typeof w==='object')return Object.entries(w).map(([k,v])=>typeof v==='string'?v:k+': '+JSON.stringify(v));return[String(w)]}
async function bench(meta,h,end){const start=startDate(end,h);if(!start)return null;const r=await get('/rest/v1/macro_series?select=ts_date,value,unit&series_key=eq.'+encodeURIComponent(meta.series)+'&ts_date=gte.'+start+'&ts_date=lte.'+end+'&order=ts_date.asc&limit=5000');const p=r.filter(x=>x.value!=null);if(!p.length)return null;if(meta.type==='level'){const a=Number(p[0].value),z=Number(p[p.length-1].value);if(!a)return null;return{value:(z/a-1)*100,start:p[0].ts_date,end:p[p.length-1].ts_date,unit:p[p.length-1].unit}}if(meta.type==='inflation'){let f=1;p.forEach(x=>f*=1+Number(x.value)/100);return{value:(f-1)*100,start:p[0].ts_date,end:p[p.length-1].ts_date,unit:p[p.length-1].unit,calculated:true}}if(meta.type==='yield'){let f=1;for(let i=0;i<p.length;i++){const d1=p[i].ts_date,d2=i+1<p.length?p[i+1].ts_date:end,days=Math.max(0,(Date.parse(d2)-Date.parse(d1))/86400000);if(days)f*=Math.pow(1+Number(p[i].value)/100,days/365)}return{value:(f-1)*100,start:p[0].ts_date,end:p[p.length-1].ts_date,unit:p[p.length-1].unit,calculated:true}}return null}
function renderError(e){$('app').innerHTML='<div class="empty-state error"><h2>تعذر تحميل FUND DNA</h2><p>'+esc(e&&e.message?e.message:e)+'</p><p>تأكد من أن رابط الصندوق يحتوي على المعرّف الصحيح وأن Supabase متاح.</p><p><a href="./funds.html">العودة إلى شاشة الصناديق</a></p></div>';console.error(e)}
async function load(){
if(!id)throw Error('معرّف الصندوق غير موجود في الرابط');if(!CFG.url||!CFG.key)throw Error('config.js غير متاح أو مفاتيح Supabase غير موجودة');
const fundRows=await get('/rest/v1/funds?fund_id=eq.'+encodeURIComponent(id)+'&select=fund_id,canonical_name,management_company,category,metadata&limit=1');if(!fundRows.length)throw Error('الصندوق غير موجود: '+id);const fund=fundRows[0];
const [ssRows,perfRows]=await Promise.all([
get('/rest/v1/fund_smartscore_latest?fund_id=eq.'+encodeURIComponent(id)+'&select=fund_id,final_score,raw_score,rating,data_tier,data_confidence,score_as_of,performance_score,risk_score,benchmark_score,consistency_score,inflation_score,score_explanation,risk_method,track_factor,warnings,qualification_status,component_availability,calculation_inputs,methodology_version&limit=1'),
get('/rest/v1/fund_performance_history?fund_id=eq.'+encodeURIComponent(id)+'&select=report_date,horizon,nav_value,return_pct,rank,currency,report_status,source_id&order=report_date.desc&limit=1000')]);
const ss=ssRows[0]||null,byH={};perfRows.forEach(r=>{if(r.horizon&&!byH[r.horizon])byH[r.horizon]=r});if(!HS.includes(selectedH))selectedH='last12m';const selected=byH[selectedH]||null;
const score=ss&&ss.final_score!=null?Number(ss.final_score):null,conf=String(ss&&ss.data_confidence||''),confClass=conf.toLowerCase().includes('high')?'good':conf.toLowerCase().includes('insufficient')||conf.toLowerCase().includes('limited')?'bad':'warn',warn=cleanWarnings(ss&&ss.warnings),meta=fund.metadata||{},currency=selected&&selected.currency||meta.currency||null;
$('app').innerHTML=`<div class="topline"><div class="crumb"><a href="./funds.html">الصناديق</a> · FUND DNA</div><div class="note">${ss&&ss.score_as_of?'التقييم حتى '+esc(ss.score_as_of):'لا يوجد تقييم مخزّن'}</div></div>
<section class="identity"><div><div class="label">FUND DNA / INSTITUTIONAL PROFILE</div><h1>${esc(fund.canonical_name)}</h1><div class="identity-meta"><span class="pill">${esc(fund.management_company||'مدير غير متاح')}</span><span class="pill">${esc(category(fund.category))}</span>${currency?'<span class="pill">'+esc(currency)+'</span>':''}<span class="pill">ID · ${esc(fund.fund_id)}</span></div></div><div class="protection"><b>طبقة الحماية</b><br>هذه الشاشة تفسّر البيانات والتقييم المخزّن. لا تنشئ توصية ولا تعيد حساب SmartScore.</div></section>
<section class="pulse"><div class="card pulse-card pulse-main"><span class="label">SMART SCORE</span><div class="score-big">${score==null?'—':score.toFixed(1)}</div><div class="status-line"><span class="pill ${score==null?'bad':'good'}">${score==null?'NOT RATED':esc(ss&&ss.rating||'RATED')}</span><span class="pill ${confClass}">${esc(conf||'CONFIDENCE UNAVAILABLE')}</span></div><div class="note">${esc(ss&&ss.methodology_version||'SmartScore')}${ss&&ss.data_tier?' · '+esc(ss.data_tier):''}</div></div>
<div class="card pulse-card"><span class="label">RETURN · ${HL[selectedH]}</span><span class="value">${selected&&selected.return_pct!=null?pct(selected.return_pct):'—'}</span><div class="note">${selected&&selected.report_date?'Report '+esc(selected.report_date):'لا توجد بيانات'}</div></div>
<div class="card pulse-card"><span class="label">RATING</span><span class="value">${esc(ss&&ss.rating||'—')}</span><div class="note">التصنيف المخزّن</div></div>
<div class="card pulse-card"><span class="label">QUALIFICATION</span><span class="value">${esc(ss&&ss.qualification_status||'—')}</span><div class="note">حالة التأهل من المحرك</div></div>
<div class="card pulse-card"><span class="label">DATA TIER</span><span class="value">${esc(ss&&ss.data_tier||'—')}</span><div class="note">Track Factor: ${ss&&ss.track_factor!=null?Number(ss.track_factor).toFixed(2):'—'}</div></div></section>
<div class="section-head"><div><h2>SCORE DNA</h2><p>المكونات كما سجلها محرك SmartScore — دون إعادة حساب</p></div></div><section class="grid5">${[['P','Performance','performance_score'],['R','Risk','risk_score'],['B','Benchmark','benchmark_score'],['C','Consistency','consistency_score'],['I','Inflation / Safe','inflation_score']].map(x=>{const v=ss&&ss[x[2]]!=null?Number(ss[x[2]]):null;return '<div class="card score-card"><span class="letter">'+x[0]+'</span><small>'+x[1]+'</small><strong>'+(v==null?'—':v.toFixed(1))+'</strong>'+(v==null?'':'<div class="meter"><i style="width:'+Math.max(0,Math.min(100,v))+'%"></i></div>')+'</div>'}).join('')}</section>
<div class="section-head"><div><h2>BENCHMARK DNA</h2><p>مقارنة الفترة المختارة مع السلاسل المتاحة فعلياً في Supabase</p></div></div><section class="card section-card" id="benchSection"><div class="empty-state">جاري تحميل المقارنات…</div></section>
<div class="section-head"><div><h2>RISK DNA</h2><p>بيانات المخاطر والتتبع المسجلة في المحرك</p></div></div><section class="risk-grid"><div class="metric"><span class="label">RISK METHOD</span><strong>${esc(ss&&ss.risk_method||'—')}</strong></div><div class="metric"><span class="label">RISK SCORE</span><strong class="num">${ss&&ss.risk_score!=null?num(ss.risk_score):'—'}</strong></div><div class="metric"><span class="label">TRACK FACTOR</span><strong class="num">${ss&&ss.track_factor!=null?Number(ss.track_factor).toFixed(2):'—'}</strong></div></section>
<div class="section-head"><div><h2>PERFORMANCE DNA</h2><p>جميع الآفاق الموجودة فعلياً في سجل الأداء</p></div></div><section class="card section-card performance"><div class="horizon-tabs">${HS.map(h=>'<a class="'+(h===selectedH?'active':'')+'" href="?id='+encodeURIComponent(id)+'&h='+encodeURIComponent(h)+'">'+HL[h]+'</a>').join('')}</div><div class="selected-return"><div><span class="label">'+HL[selectedH]+'</span><div class="ret '+(selected&&Number(selected.return_pct)>=0?'pos':'neg')+'">'+(selected&&selected.return_pct!=null?pct(selected.return_pct):'—')+'</div></div><div class="note">'+(selected&&selected.report_date?'Report '+esc(selected.report_date):'لا توجد بيانات لهذه الفترة')+'</div></div><table><thead><tr><th>الفترة</th><th>العائد</th><th>NAV</th><th>الترتيب</th><th>العملة</th><th>الحالة</th><th>المصدر</th></tr></thead><tbody>${HS.map(h=>{const r=byH[h];return '<tr><td>'+HL[h]+'</td><td class="'+(r&&r.return_pct!=null&&Number(r.return_pct)>=0?'pos':'neg')+'">'+(r&&r.return_pct!=null?pct(r.return_pct):'—')+'</td><td>'+num(r&&r.nav_value)+'</td><td>'+num(r&&r.rank)+'</td><td>'+esc(r&&r.currency||'—')+'</td><td>'+esc(r&&r.report_status||'—')+'</td><td>'+esc(r&&r.source_id||'—')+'</td></tr>'}).join('')}</tbody></table></section>
<div class="section-head"><div><h2>DATA INTEGRITY</h2><p>جودة البيانات وحالة التأهل والتحذيرات كما وردت من المحرك</p></div></div><section class="integrity-grid"><div class="integrity"><span class="label">DATA TIER</span><strong>${esc(ss&&ss.data_tier||'—')}</strong></div><div class="integrity"><span class="label">CONFIDENCE</span><strong>${esc(conf||'—')}</strong></div><div class="integrity"><span class="label">QUALIFICATION</span><strong>${esc(ss&&ss.qualification_status||'—')}</strong></div><div class="integrity"><span class="label">METHODOLOGY</span><strong>${esc(ss&&ss.methodology_version||'—')}</strong></div></section><div class="warnings ${warn.length?'':'empty'}">${warn.length?'⚠ '+warn.map(esc).join('<br>'):'✓ لا توجد تحذيرات مسجلة'}</div>
<div class="section-head"><div><h2>EVIDENCE</h2><p>لماذا حصل الصندوق على هذه النتيجة؟</p></div></div><section class="card evidence"><h3>Score Explanation</h3><p>${esc(ss&&ss.score_explanation||'لا يوجد تفسير مسجل لهذا الصندوق.')}</p><details class="raw"><summary>عرض بيانات المحرك الخام</summary><pre>${esc(JSON.stringify({component_availability:ss&&ss.component_availability,calculation_inputs:ss&&ss.calculation_inputs},null,2))}</pre></details></section>`;
const bs=[];for(const [k,m] of Object.entries(BENCH)){try{const b=selected&&selected.report_date?await bench(m,selectedH,selected.report_date):null;if(b)bs.push({key:k,...m,...b})}catch(e){console.warn('Benchmark unavailable',k,e)}}const fr=selected&&selected.return_pct!=null?Number(selected.return_pct):null;
if(!bs.length)$('benchSection').innerHTML='<div class="empty-state">لا تتوافر بيانات Benchmark قابلة للمقارنة لهذه الفترة.</div>';else $('benchSection').innerHTML=bs.map(b=>{const beat=fr!=null&&fr>=b.value,w=Math.min(100,Math.max(4,Math.abs(Number(b.value))));return '<div class="bar-row"><div class="bar-label">'+esc(b.label)+'</div><div class="bar-track"><div class="bar-fill '+(beat?'good':'bad')+'" style="width:'+w+'%"></div></div><div class="bar-value">'+pct(b.value)+(beat?' ✓':'')+'</div></div>'}).join('')+'<div class="bench-meta">✓ يعني أن عائد الصندوق للفترة المختارة ≥ عائد المعيار. السلاسل ذات المستوى تقارن أول وآخر نقطة متاحة داخل الفترة. التضخم وأذون الخزانة محسوبان كعائد فترة من السلسلة، وليس كقيمة خام.</div>';
}
if(!id)renderError(Error('معرّف الصندوق غير موجود في الرابط'));else if(!CFG.url||!CFG.key)renderError(Error('config.js غير متاح أو مفاتيح Supabase غير موجودة'));else load().catch(renderError);
})();
</script>
</body>
</html>
