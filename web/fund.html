<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FUND DNA · Institutional Profile</title>
<script src="config.js"></script>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="site-header"><div class="wrap"><div class="logo">رادار السوق المصري<span>منصة فهم الاقتصاد وتحليل صناديق الاستثمار</span></div><nav>
<a href="./index.html">البداية</a>
<a href="./map.html">ماذا حدث للفلوس؟</a>
<a href="./funds.html">الصناديق</a>
<a href="./categories.html">خريطة الفئات</a>
<a href="./macro.html">الاقتصاد</a>
<a href="./why.html">المنهج</a>
</nav></div></header>
<main class="wrap page dna" id="app"><div class="empty">جاري تحميل FUND DNA…</div></main>
<script>
(function(){'use strict';
const q=new URLSearchParams(location.search),id=q.get('id')||q.get('fund_id');
const C=window.KHATER||{},H={apikey:C.key,Authorization:'Bearer '+C.key};
const LABEL={weekly:'أسبوعي','4weeks':'4 أسابيع',ytd:'منذ بداية العام',last12m:'12 شهراً','1y':'سنة','2y':'سنتان','3y':'3 سنوات','4y':'4 سنوات','5y':'5 سنوات','6y':'6 سنوات'};
const ORDER=['weekly','4weeks','ytd','last12m','1y','2y','3y','4y','5y','6y'];
const esc=x=>String(x==null?'—':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function get(path){const r=await fetch(C.url+path,{headers:H});const t=await r.text();let j;try{j=JSON.parse(t)}catch(e){throw Error('استجابة غير صالحة من Supabase')}if(!r.ok)throw Error((j&&j.message)||'HTTP '+r.status);return j}
function pretty(v){try{return JSON.stringify(v,null,2)}catch(e){return String(v)}}
async function load(){
 if(!id)throw Error('معرّف الصندوق غير موجود في الرابط');
 const fr=await get('/rest/v1/funds?fund_id=eq.'+encodeURIComponent(id)+'&select=fund_id,canonical_name,management_company,category,metadata&limit=1');
 if(!fr.length)throw Error('الصندوق غير موجود: '+id); const f=fr[0];
 const [sarr,perf]=await Promise.all([
  get('/rest/v1/fund_smartscore_latest?fund_id=eq.'+encodeURIComponent(id)+'&select=fund_id,final_score,raw_score,rating,data_tier,data_confidence,data_quality,score_as_of,signal_as_of,latest_day_change_pct,latest_signal_status,performance_score,risk_score,benchmark_score,consistency_score,inflation_score,score_explanation,risk_method,track_factor,warnings,qualification_status,calculation_inputs,methodology_version&limit=1'),
  get('/rest/v1/fund_performance_history?fund_id=eq.'+encodeURIComponent(id)+'&select=report_date,horizon,nav_value,return_pct,rank,currency,report_status,source_id&order=report_date.desc&limit=1000')
 ]);
 const s=sarr[0]||{}; const by={};perf.forEach(x=>{if(x.horizon&&!by[x.horizon])by[x.horizon]=x});
 const h=by.last12m?'last12m':Object.keys(by)[0]||'last12m',sel=by[h];
 const score=s.final_score==null?null:Number(s.final_score);
 const components=[['P','الأداء',s.performance_score],['R','المخاطر',s.risk_score],['B','المقارنة المرجعية',s.benchmark_score],['C','الاتساق',s.consistency_score],['I','التضخم / البديل الآمن',s.inflation_score]];
 const tabs=ORDER.filter(x=>by[x]).map(x=>'<span class="tag">'+LABEL[x]+'</span>').join('');
 const rows=ORDER.filter(x=>by[x]).map(x=>'<tr><td>'+LABEL[x]+'</td><td>'+esc(by[x].return_pct==null?'—':Number(by[x].return_pct).toFixed(2)+'%')+'</td><td>'+esc(by[x].nav_value)+'</td><td>'+esc(by[x].report_date)+'</td></tr>').join('');
 $('app').innerHTML='<section class="hero"><div class="eyebrow">FUND DNA · INSTITUTIONAL PROFILE</div><h1>'+esc(f.canonical_name)+'</h1><p>'+esc(f.management_company)+'</p><div class="tags">'+tabs+'</div></section><section class="section"><h2>SmartScore</h2><div class="card"><strong>'+(score==null?'—':score.toFixed(1))+'</strong><p>'+esc(s.rating)+'</p><p>Methodology: '+esc(s.methodology_version)+'</p><p>Data Confidence: '+esc(s.data_confidence)+'</p></div></section><section class="section"><h2>Score DNA</h2><div class="score-grid">'+components.map(x=>'<div class="card"><b>'+x[0]+'</b><p>'+esc(x[1])+'</p><strong>'+(x[2]==null?'—':Number(x[2]).toFixed(1))+'</strong></div>').join('')+'</div></section><section class="section"><h2>Performance Journey</h2><div class="card"><p>الأفق: '+esc(LABEL[h])+'</p><p>العائد: '+esc(sel&&sel.return_pct==null?'—':sel?Number(sel.return_pct).toFixed(2)+'%':'—')+'</p><table><thead><tr><th>الأفق</th><th>العائد</th><th>NAV</th><th>التاريخ</th></tr></thead><tbody>'+rows+'</tbody></table></div></section><section class="section" id="evidence-db-v4"><div class="section-head"><h2>دليل التقييم المحفوظ</h2><span>Supabase · smartscore_evaluations · V3.0</span></div><div id="evaluation-evidence" class="card"><div>جاري تحميل سجل التقييم…</div></div></section>';
 await loadEvidence(f);
}
async function loadEvidence(f){
 const host=document.getElementById('evaluation-evidence');
 try{
  const url=C.url+'/rest/v1/smartscore_evaluations?fund_id=eq.'+encodeURIComponent(id)+'&methodology_version=eq.V3.0&select=evaluation_id,fund_id,report_date,category,methodology_version,performance_score,risk_score,benchmark_score,consistency_score,inflation_score,smartscore,effective_weights,component_availability,data_confidence,peer_cohort_size,raw_rank,qualified_rank,qualification_status,calculation_inputs,warnings,calculated_at,data_tier,track_factor,final_score,rating,score_explanation,data_quality&order=report_date.desc,calculated_at.desc&limit=1';
  const r=await fetch(url,{headers:H});if(!r.ok)throw Error('evaluation request failed: '+r.status);const a=await r.json(),e=a[0];
  if(!e){host.innerHTML='<div class="empty">لا يوجد تقييم محفوظ لهذا الصندوق في الإصدار V3.0.</div>';return}
  const record={evaluation_id:e.evaluation_id,fund_id:e.fund_id,report_date:e.report_date,category:e.category,methodology_version:e.methodology_version,performance_score:e.performance_score,risk_score:e.risk_score,benchmark_score:e.benchmark_score,consistency_score:e.consistency_score,inflation_score:e.inflation_score,smartscore:e.smartscore,final_score:e.final_score,rating:e.rating,data_confidence:e.data_confidence,data_tier:e.data_tier,track_factor:e.track_factor,peer_cohort_size:e.peer_cohort_size,raw_rank:e.raw_rank,qualified_rank:e.qualified_rank,qualification_status:e.qualification_status,data_quality:e.data_quality,calculated_at:e.calculated_at};
  host.innerHTML='<div class="integrity"><div><b>Methodology</b><span>'+esc(e.methodology_version)+'</span></div><div><b>Data Quality</b><span>'+esc(e.data_quality)+'</span></div><div><b>Peer Cohort</b><span>'+esc(e.peer_cohort_size)+'</span></div><div><b>Qualified Rank</b><span>'+esc(e.qualified_rank)+'</span></div><div><b>Raw Rank</b><span>'+esc(e.raw_rank)+'</span></div><div><b>Confidence</b><span>'+esc(e.data_confidence)+'</span></div><div><b>Data Tier</b><span>'+esc(e.data_tier)+'</span></div><div><b>Track Factor</b><span>'+esc(e.track_factor)+'</span></div></div><details open><summary>Effective Weights</summary><pre>'+esc(pretty(e.effective_weights))+'</pre></details><details><summary>Component Availability</summary><pre>'+esc(pretty(e.component_availability))+'</pre></details><details><summary>Calculation Inputs</summary><pre>'+esc(pretty(e.calculation_inputs))+'</pre></details><details><summary>Warnings</summary><pre>'+esc(pretty(e.warnings))+'</pre></details><details><summary>Score Explanation</summary><pre>'+esc(pretty(e.score_explanation))+'</pre></details><details><summary>Evaluation Record</summary><pre>'+esc(pretty(record))+'</pre></details>';
 }catch(e){host.innerHTML='<div class="empty">تعذر تحميل سجل التقييم من قاعدة البيانات: '+esc(e.message)+'</div>';console.warn(e)}
}
function $(x){return document.getElementById(x)}
load().catch(e=>{$('app').innerHTML='<div class="empty"><h2>تعذر تحميل FUND DNA</h2><p>'+esc(e.message)+'</p></div>';console.error(e)});
})();
</script>
<style>
.dna{padding:30px 0 90px}.hero,.card{border:1px solid rgba(214,180,106,.18);border-radius:18px;background:#0d1219;padding:22px}.hero h1{font-size:42px;margin:10px 0}.eyebrow{font:10px Arial;color:#d6b46a}.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.tag{padding:7px 10px;border:1px solid rgba(255,255,255,.1);border-radius:999px;color:#aeb7c3;font-size:10px}.section{margin-top:30px}.section h2{font-size:18px}.score-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.score-grid strong,.card>strong{font:700 32px Arial;color:#f4d991}.integrity{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.integrity>div{border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:14px;background:rgba(255,255,255,.02)}.integrity b{display:block;font:9px Arial;color:#8993a3}.integrity span{display:block;margin-top:8px;font:600 14px Arial;direction:ltr}.card table{width:100%;border-collapse:collapse;margin-top:15px}.card th,.card td{padding:9px;border-bottom:1px solid rgba(255,255,255,.07);text-align:right;font-size:10px}.card th{color:#8993a3}.card details{margin-top:10px;border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:12px}.card summary{cursor:pointer;color:#c7ced8;font-size:10px}pre{white-space:pre-wrap;word-break:break-word;overflow:auto;max-height:320px;font:9px/1.6 Consolas,monospace;color:#bbc5d3}.empty{padding:42px;text-align:center;color:#8993a3;border:1px dashed rgba(255,255,255,.12);border-radius:16px}@media(max-width:800px){.score-grid,.integrity{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:32px}}@media(max-width:480px){.score-grid,.integrity{grid-template-columns:1fr}}
</style>
</body>
</html>
