<script>
(function(){'use strict';
const q=new URLSearchParams(location.search),id=q.get('id')||q.get('fund_id');let h=q.get('h')||'last12m';
const C=window.KHATER||{},H={apikey:C.key,Authorization:'Bearer '+C.key};
const HS=['weekly','4weeks','ytd','last12m','1y','2y','3y','4y','5y','6y'];
const L={weekly:'أسبوعي',fourweeks:'4 أسابيع',ytd:'منذ بداية العام',last12m:'12 شهراً','1y':'سنة','2y':'سنتان','3y':'3 سنوات','4y':'4 سنوات','5y':'5 سنوات','6y':'6 سنوات'};
const BENCH=[{label:'التضخم',series:'cpi_headline_mom_pct',type:'inflation'},{label:'أذون الخزانة · 364 يوم',series:'tbill_364_avg_yield_pct',type:'tbill'},{label:'بيتكوين / جنيه',series:'btc_egp',type:'level'},{label:'ناسداك / جنيه',series:'qqq_egp',type:'level'},{label:'S&P 500 / جنيه',series:'spy_egp',type:'level'},{label:'الدولار / جنيه',series:'usd_egp_mid',type:'level'},{label:'الفضة / جنيه',series:'silver_egp_oz',type:'level'},{label:'الذهب / جنيه',series:'gold_egp_oz',type:'level'},{label:'EGX30',series:'egx30_close',type:'level'}];
const $=x=>document.getElementById(x);
function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function num(x){return x==null||Number.isNaN(Number(x))?'—':Number(x).toLocaleString('en-US',{maximumFractionDigits:2})}
function pct(x){return x==null?'—':(Number(x)>=0?'+':'')+num(x)+'%'}
function cleanWarnings(w){if(w==null)return[];if(Array.isArray(w))return w.map(x=>typeof x==='string'?x:(x&&x.message)||JSON.stringify(x));if(typeof w==='object')return Object.entries(w).map(([k,v])=>k+': '+JSON.stringify(v));return[String(w)]}
function cat(x){const z=String(x||'').toLowerCase();if(z.includes('gold'))return'ذهب';if(z.includes('equity')||z.includes('index')||z.includes('sector')||z.includes('thematic'))return'أسهم';if(z.includes('money'))return'نقدي';if(z.includes('fixed income'))return'دخل ثابت';if(z.includes('balanced')||z.includes('mixed')||z.includes('allocator'))return'متوازن';if(z.includes('etf')||z.includes('traded'))return'متداول';if(z.includes('protected')||z.includes('guaranteed'))return'محمي';return x||'غير مصنف'}
async function get(path){const r=await fetch(C.url+path,{headers:H}),t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){throw Error('استجابة غير صالحة من Supabase')}if(!r.ok)throw Error((j&&j.message)||'HTTP '+r.status);return j}
function startDate(end,x){const d=new Date(end+'T00:00:00Z');if(x==='weekly')d.setUTCDate(d.getUTCDate()-7);else if(x==='4weeks')d.setUTCDate(d.getUTCDate()-28);else if(x==='ytd')d.setUTCMonth(0,1);else if(x==='last12m')d.setUTCFullYear(d.getUTCFullYear()-1);else if(/^\dy$/.test(x))d.setUTCFullYear(d.getUTCFullYear()-Number(x[0]));else return null;return d.toISOString().slice(0,10)}
async function benchmark(series,type,end){if(!end)return null;const requestedStart=startDate(end,h);if(!requestedStart)return null;if(type==='inflation'&&(h==='weekly'||h==='4weeks'))return null;const p=(await get('/rest/v1/macro_series?select=ts_date,value,unit&series_key=eq.'+encodeURIComponent(series)+'&ts_date=gte.'+requestedStart+'&ts_date=lte.'+end+'&order=ts_date.asc&limit=5000')).filter(x=>x.value!=null);if(!p.length)return null;const actualStart=p[0].ts_date,actualEnd=p[p.length-1].ts_date;if(type==='level'){const a=Number(p[0].value),z=Number(p[p.length-1].value);return a?(z/a-1)*100:null}if(type==='inflation'){let factor=1;for(const x of p){const n=Number(x.value);if(!Number.isFinite(n))return null;factor*=1+n/100}return(factor-1)*100}if(type==='tbill'){const nums=p.map(x=>Number(x.value));if(nums.some(n=>!Number.isFinite(n)))return null;const avg=nums.reduce((a,b)=>a+b,0)/nums.length;const days=Math.max(1,(Date.parse(actualEnd)-Date.parse(actualStart))/86400000);return avg*days/365}return null}
function stateClass(text){const z=String(text||'').toLowerCase();if(z.includes('high')||z.includes('qualified')||z.includes('established'))return'good';if(z.includes('insufficient')||z.includes('limited')||z.includes('not rated'))return'red';return'amber'}
function chart(rows){const pts=rows.filter(x=>x.return_pct!=null).slice().reverse();if(!pts.length)return'<div class="empty">لا توجد بيانات كافية للرسم.</div>';const vals=pts.map(x=>Number(x.return_pct)),mn=Math.min(...vals),mx=Math.max(...vals),range=mx-mn||1,w=820,hg=260,pad=18;const xy=vals.map((v,i)=>{const x=pad+i*(w-2*pad)/Math.max(1,vals.length-1),y=hg-pad-(v-mn)/range*(hg-2*pad);return[x,y]});const line=xy.map(p=>p.join(',')).join(' ');const area=pad+','+(hg-pad)+' '+line+' '+(w-pad)+','+(hg-pad);return'<svg viewBox="0 0 '+w+' '+hg+'" preserveAspectRatio="none"><defs><linearGradient id="fade" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#d6b46a" stop-opacity=".20"/><stop offset="1" stop-color="#d6b46a" stop-opacity="0"/></linearGradient></defs><line class="axis" x1="0" y1="'+(hg/2)+'" x2="'+w+'" y2="'+(hg/2)+'"/><polygon class="chart-area" points="'+area+'"/><polyline class="chart-glow" points="'+line+'"/><polyline class="chart-line" points="'+line+'"/>'+xy.slice(-1).map(p=>'<circle class="chart-point" cx="'+p[0]+'" cy="'+p[1]+'" r="4.5"/>').join('')+'</svg>'}
function makeBenchRow(b,v,ret){if(v==null)return'<div class="bench-row"><div class="bench-name">'+esc(b.label)+'</div><div class="track"><div class="mid"></div></div><div class="bench-val">—</div><div class="bench-result">غير متاح</div></div>';const delta=ret==null?null:Number(ret)-Number(v),good=delta!=null&&delta>0,bad=delta!=null&&delta<0,scale=Math.max(8,Math.min(100,50+Number(v)/2));return'<div class="bench-row"><div class="bench-name">'+esc(b.label)+'</div><div class="track"><div class="mid"></div><div class="fill '+(good?'good':bad?'bad':'')+'" style="width:'+scale+'%"></div></div><div class="bench-val">'+pct(v)+'</div><div class="bench-result '+(good?'good':bad?'bad':'')+'">'+(delta==null?'—':(good?'يتفوق ':'أقل من ')+pct(Math.abs(delta)))+'</div></div>'}

async function load(){
 if(!id)throw Error('معرّف الصندوق غير موجود في الرابط');if(!C.url||!C.key)throw Error('config.js غير متاح أو مفاتيح Supabase غير موجودة');
 const fr=await get('/rest/v1/funds?fund_id=eq.'+encodeURIComponent(id)+'&select=fund_id,canonical_name,management_company,category,metadata&limit=1');if(!fr.length)throw Error('الصندوق غير موجود: '+id);const f=fr[0];
 const [sr,pr]=await Promise.all([get('/rest/v1/fund_smartscore_latest?fund_id=eq.'+encodeURIComponent(id)+'&select=fund_id,final_score,raw_score,rating,data_tier,data_confidence,score_as_of,performance_score,risk_score,benchmark_score,consistency_score,inflation_score,score_explanation,risk_method,track_factor,warnings,qualification_status,calculation_inputs,methodology_version&limit=1'),get('/rest/v1/fund_performance_history?fund_id=eq.'+encodeURIComponent(id)+'&select=report_date,horizon,nav_value,return_pct,rank,currency,report_status,source_id&order=report_date.desc&limit=1000')]);
 const s=sr[0]||null,by={};pr.forEach(x=>{if(x.horizon&&!by[x.horizon])by[x.horizon]=x});if(!HS.includes(h))h='last12m';const sel=by[h]||null;const score=s&&s.final_score!=null?Number(s.final_score):null,conf=String(s&&s.data_confidence||''),warnings=cleanWarnings(s&&s.warnings),sc=score==null?'red':stateClass(s&&s.rating);
