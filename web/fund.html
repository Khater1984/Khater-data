<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FUND DNA · Institutional Profile</title>
<script src="config.js"></script><link rel="stylesheet" href="css/app.css">
<style>
:root{--gold:#d6b46a;--gold2:#f1d38b;--green:#46e39a;--red:#f07b70;--amber:#e9c66e;--ink:#070a0f;--panel:#0d1219;--panel2:#111823;--line:#ffffff12;--muted:#8993a3;--text:#edf2f7}
*{box-sizing:border-box}.dna{padding:22px 0 80px;color:var(--text)}
a{color:inherit}.eyebrow{font-size:10px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}.muted{color:var(--muted)}
.topbar{display:flex;justify-content:space-between;align-items:center;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:25px}.back{color:var(--gold);text-decoration:none;font-size:12px}.asof{font-size:10px;color:var(--muted)}
.hero{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:22px;background:radial-gradient(circle at 12% 0%,#d6b46a16,transparent 38%),linear-gradient(135deg,#151c27,#0b1017 65%);padding:28px}.hero:after{content:"";position:absolute;inset:auto -80px -120px auto;width:320px;height:320px;border-radius:50%;border:1px solid #d6b46a12;box-shadow:0 0 0 35px #d6b46a05,0 0 0 70px #d6b46a03}.hero-head{display:flex;justify-content:space-between;gap:30px;align-items:flex-start;position:relative;z-index:1}.hero h1{font-size:clamp(30px,5vw,56px);line-height:1.02;margin:7px 0 12px;max-width:850px;letter-spacing:-.025em}.manager{font-size:14px;color:#c5ccd7}.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:15px}.tag{font-size:10px;border:1px solid var(--line);background:#ffffff05;border-radius:999px;padding:6px 10px;color:#b9c2cf}.protection{min-width:245px;max-width:300px;padding:14px 15px;border:1px solid #d6b46a28;border-radius:14px;background:#d6b46a08;color:#d8dee7;font-size:11px;line-height:1.8}.protection b{color:var(--gold2);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.pulse{display:grid;grid-template-columns:1.35fr repeat(3,1fr);gap:10px;margin-top:10px}.metric{min-height:130px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,#131a24,#0d1219);padding:17px;position:relative}.metric.primary{grid-row:span 1;background:linear-gradient(145deg,#1b2028,#10151c);border-color:#d6b46a35}.metric-label{font-size:9px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}.metric-value{font-family:Arial,sans-serif;direction:ltr;display:block;margin-top:10px;font-size:29px;font-weight:700}.metric.primary .metric-value{font-size:55px;color:var(--gold2);letter-spacing:-.04em}.metric-sub{font-size:10px;color:var(--muted);margin-top:8px}.status{display:inline-flex;gap:7px;align-items:center;margin-top:10px;padding:5px 9px;border-radius:999px;background:#ffffff06;border:1px solid var(--line);font-size:9px}.dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 10px #46e39a88}.dot.amber{background:var(--amber);box-shadow:0 0 10px #e9c66e66}.dot.red{background:var(--red);box-shadow:0 0 10px #f07b7066}
.section{margin-top:34px}.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:13px}.section-title{margin:0;font-size:16px;font-weight:650;letter-spacing:.01em}.section-note{font-size:10px;color:var(--muted)}.section-no{color:var(--gold);font-family:Arial,sans-serif;font-size:10px;letter-spacing:.12em;margin-left:8px}
.card{border:1px solid var(--line);border-radius:17px;background:linear-gradient(180deg,#111823,#0c1118);padding:18px}.score-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.score-card{min-height:138px}.score-top{display:flex;justify-content:space-between;gap:8px}.score-code{font:700 11px Arial;color:var(--gold)}.score-name{font-size:10px;color:var(--muted);margin-top:6px;line-height:1.4}.score-number{font:700 30px Arial;direction:ltr;display:block;margin-top:19px}.meter{height:4px;background:#06090d;border-radius:99px;overflow:hidden;margin-top:13px}.meter i{height:100%;display:block;background:linear-gradient(90deg,#8f7134,var(--gold2))}
.bench-card{padding:19px}.bench-intro{display:flex;justify-content:space-between;gap:20px;align-items:end;padding-bottom:17px;border-bottom:1px solid var(--line);margin-bottom:10px}.fund-return{font:700 34px Arial;color:var(--gold2);direction:ltr}.bench-row{display:grid;grid-template-columns:165px 1fr 95px 110px;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.bench-row:last-child{border-bottom:0}.bench-name{font-size:11px}.track{height:7px;background:#070b10;border-radius:99px;overflow:hidden;position:relative}.fill{height:100%;border-radius:99px;background:#667181}.fill.good{background:var(--green)}.fill.bad{background:var(--red)}.bench-val{direction:ltr;text-align:left;font:12px Arial}.bench-result{font-size:9px;text-align:center;border-radius:999px;padding:5px 7px;border:1px solid var(--line);color:var(--muted)}.bench-result.good{color:var(--green);border-color:#46e39a30;background:#46e39a08}.bench-result.bad{color:var(--red);border-color:#f07b7030;background:#f07b7008}.method-note{font-size:9px;color:var(--muted);margin-top:14px;line-height:1.7}
.risk-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px}.risk-card{min-height:120px}.risk-num{font:700 34px Arial;direction:ltr;display:block;margin-top:12px}.risk-scale{margin-top:17px}.scale-line{height:6px;background:linear-gradient(90deg,#46e39a,#e9c66e,#f07b70);border-radius:99px;position:relative}.scale-dot{position:absolute;top:50%;width:13px;height:13px;border-radius:50%;background:#fff;border:3px solid var(--gold);transform:translate(50%,-50%);box-shadow:0 0 0 4px #d6b46a22}.scale-labels{display:flex;justify-content:space-between;color:var(--muted);font-size:8px;margin-top:7px}
.integrity{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.integrity-item{padding:15px;border:1px solid var(--line);border-radius:14px;background:#ffffff03}.integrity-item .k{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}.integrity-item .v{font:600 14px Arial;display:block;margin-top:9px;direction:ltr}.warning{margin-top:10px;padding:13px 15px;border-radius:12px;border:1px solid #46e39a25;background:#46e39a06;color:#a9dfc3;font-size:11px;line-height:1.7}.warning.has{border-color:#e9c66e30;background:#e9c66e07;color:#e5d19a}
.perf-tabs{display:flex;gap:6px;overflow:auto;padding-bottom:4px;margin-bottom:12px}.perf-tabs a{white-space:nowrap;text-decoration:none;color:var(--muted);font-size:9px;border:1px solid var(--line);border-radius:999px;padding:7px 11px}.perf-tabs a.active{color:#17120a;background:var(--gold);border-color:var(--gold);font-weight:700}.perf-layout{display:grid;grid-template-columns:1.4fr 1fr;gap:10px}.chart{min-height:300px}.chart-title{font-size:10px;color:var(--muted);margin-bottom:14px}.svgwrap{height:230px}.svgwrap svg{width:100%;height:100%;overflow:visible}.axis{stroke:#ffffff12;stroke-width:1}.line{fill:none;stroke:var(--gold);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.area{fill:url(#fade)}.point{fill:var(--gold2)}.perf-table{overflow:auto}.perf-table table{width:100%;border-collapse:collapse;min-width:520px}.perf-table th,.perf-table td{padding:10px 7px;border-bottom:1px solid var(--line);font-size:9px;text-align:right}.perf-table th{color:var(--muted);font-weight:500}.perf-table td.num{font-family:Arial;direction:ltr}.perf-table tr.selected{background:#d6b46a08}.positive{color:var(--green)}.negative{color:var(--red)}
.evidence{display:grid;grid-template-columns:1.35fr .65fr;gap:10px}.evidence-main{border-inline-start:3px solid var(--gold);padding:5px 17px 5px 5px}.evidence-main h3{margin:0 0 10px;font-size:12px;color:var(--gold2)}.evidence-main p{margin:0;font-size:13px;line-height:2;color:#d9dee6}.evidence-side{display:flex;flex-direction:column;gap:8px}.evidence-side details{border:1px solid var(--line);border-radius:12px;padding:11px;background:#ffffff03}.evidence-side summary{cursor:pointer;font-size:10px;color:var(--muted)}pre{font-size:9px;overflow:auto;max-height:330px;color:#b9c4d2}
.technical{margin-top:14px;color:var(--muted);font-size:9px;line-height:1.8}.empty{padding:42px;text-align:center;border:1px dashed var(--line);border-radius:17px;color:var(--muted)}
@media(max-width:1050px){.pulse{grid-template-columns:1.3fr repeat(2,1fr)}.score-grid{grid-template-columns:repeat(3,1fr)}.bench-row{grid-template-columns:145px 1fr 85px 100px}.perf-layout,.evidence{grid-template-columns:1fr}}
@media(max-width:720px){.hero-head{display:block}.protection{margin-top:20px;max-width:none}.pulse{grid-template-columns:1fr 1fr}.metric.primary{grid-column:1/-1}.score-grid,.risk-grid,.integrity{grid-template-columns:1fr 1fr}.bench-row{grid-template-columns:125px 1fr 75px}.bench-result{display:none}.hero{padding:21px}.hero h1{font-size:34px}.section-head{display:block}.section-note{margin-top:5px}}
@media(max-width:470px){.pulse,.score-grid,.risk-grid,.integrity{grid-template-columns:1fr}.metric.primary{grid-column:auto}.bench-row{grid-template-columns:110px 1fr 70px}.topbar{align-items:flex-start}.hero h1{font-size:29px}}
</style>
</head>
<body>
<header class="site-header"><div class="wrap"><div class="logo">FUND DNA<span>Institutional Fund Intelligence</span></div><nav><a href="./funds.html">FUND UNIVERSE</a></nav></div></header>
<main class="wrap page dna" id="app"><div class="empty">جاري تحميل FUND DNA…</div></main>
<script>
(function(){'use strict';
const q=new URLSearchParams(location.search),id=q.get('id')||q.get('fund_id');let h=q.get('h')||'last12m';
const C=window.KHATER||{},H={apikey:C.key,Authorization:'Bearer '+C.key};
const HS=['weekly','4weeks','ytd','last12m','1y','2y','3y','4y','5y','6y'];
const L={weekly:'أسبوعي',fourweeks:'4 أسابيع',ytd:'منذ بداية العام',last12m:'12 شهراً','1y':'سنة','2y':'سنتان','3y':'3 سنوات','4y':'4 سنوات','5y':'5 سنوات','6y':'6 سنوات'};
const $=x=>document.getElementById(x),esc=x=>String(x==null?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),n=x=>x==null||Number.isNaN(Number(x))?'—':Number(x).toLocaleString('en-US',{maximumFractionDigits:2}),pct=x=>x==null?'—':(Number(x)>=0?'+':'')+n(x)+'%';
async function get(p){const r=await fetch(C.url+p,{headers:H}),t=await r.text();let j;try{j=t?JSON.parse(t):null}catch(e){throw Error('استجابة غير صالحة من Supabase')}if(!r.ok)throw Error(j&&j.message||'HTTP '+r.status);return j}
function cat(x){const z=String(x||'').toLowerCase();if(z.includes('gold'))return'ذهب';if(z.includes('equity')||z.includes('index')||z.includes('sector')||z.includes('thematic'))return'أسهم';if(z.includes('money'))return'نقدي';if(z.includes('fixed income'))return'دخل ثابت';if(z.includes('balanced')||z.includes('mixed')||z.includes('allocator'))return'متوازن';if(z.includes('etf')||z.includes('traded'))return'متداول';if(z.includes('protected')||z.includes('guaranteed'))return'محمي';return x||'غير مصنف'}
function clean(w){if(w==null)return[];if(Array.isArray(w))return w.map(x=>typeof x==='string'?x:x&&x.message||x&&x.code||JSON.stringify(x));if(typeof w==='object')return Object.entries(w).map(([k,v])=>k+': '+JSON.stringify(v));return[String(w)]}
function start(end,x){const d=new Date(end+'T00:00:00Z');if(x==='weekly')d.setUTCDate(d.getUTCDate()-7);else if(x==='4weeks')d.setUTCDate(d.getUTCDate()-28);else if(x==='ytd')d.setUTCMonth(0,1);else if(x==='last12m')d.setUTCFullYear(d.getUTCFullYear()-1);else if(/^\dy$/.test(x))d.setUTCFullYear(d.getUTCFullYear()-Number(x[0]));else return null;return d.toISOString().slice(0,10)}
async function benchmark(series,type,end){const s=start(end,h);if(!s)return null;const p=(await get('/rest/v1/macro_series?select=ts_date,value,unit&series_key=eq.'+encodeURIComponent(series)+'&ts_date=gte.'+s+'&ts_date=lte.'+end+'&order=ts_date.asc&limit=5000')).filter(x=>x.value!=null);if(!p.length)return null;if(type==='level'){const a=Number(p[0].value),z=Number(p[p.length-1].value);return a?(z/a-1)*100:null}let f=1;if(type==='inflation')p.forEach(x=>f*=1+Number(x.value)/100);else for(let i=0;i<p.length;i++){const days=Math.max(0,(Date.parse(i+1<p.length?p[i+1].ts_date:end)-Date.parse(p[i].ts_date))/86400000);if(days)f*=Math.pow(1+Number(p[i].value)/100,days/365)}return(f-1)*100}
function fail(e){$('app').innerHTML='<div class="empty"><h2>تعذر تحميل FUND DNA</h2><p>'+esc(e.message||e)+'</p><p><a href="./funds.html">العودة إلى شاشة الصناديق</a></p></div>';console.error(e)}
function statusClass(v){const z=String(v||'').toLowerCase();return z.includes('high')||z.includes('qualified')||z.includes('established')?'good':z.includes('insufficient')||z.includes('limited')?'red':'amber'}
function chart(rows){const pts=rows.filter(x=>x.return_pct!=null).slice().reverse();if(!pts.length)return '<div class="empty">لا توجد بيانات كافية للرسم.</div>';const vals=pts.map(x=>Number(x.return_pct)),mn=Math.min(...vals),mx=Math.max(...vals),range=mx-mn||1,w=760,hg=230,pad=18;const xy=vals.map((v,i)=>{const x=pad+i*(w-2*pad)/Math.max(1,vals.length-1),y=hg-pad-(v-mn)/range*(hg-2*pad);return [x,y]});const line=xy.map(p=>p.join(',')).join(' ');const area=pad+','+(hg-pad)+' '+line+' '+(w-pad)+','+(hg-pad);return '<svg viewBox="0 0 '+w+' '+hg+'" preserveAspectRatio="none"><defs><linearGradient id="fade" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#d6b46a" stop-opacity=".20"/><stop offset="1" stop-color="#d6b46a" stop-opacity="0"/></linearGradient></defs><line class="axis" x1="0" y1="'+(hg/2)+'" x2="'+w+'" y2="'+(hg/2)+'"/><polygon class="area" points="'+area+'"/><polyline class="line" points="'+line+'"/>'+xy.slice(-1).map(p=>'<circle class="point" cx="'+p[0]+'" cy="'+p[1]+'" r="4"/>').join('')+'</svg><div class="method-note">النطاق المعروض يعتمد على السجلات المتاحة فعلياً لهذا الصندوق؛ لا يتم توليد نقاط مفقودة.</div>'}
async function load(){
if(!id)throw Error('معرّف الصندوق غير موجود في الرابط');if(!C.url||!C.key)throw Error('config.js غير متاح أو مفاتيح Supabase غير موجودة');
const fr=await get('/rest/v1/funds?fund_id=eq.'+encodeURIComponent(id)+'&select=fund_id,canonical_name,management_company,category,metadata&limit=1');if(!fr.length)throw Error('الصندوق غير موجود: '+id);const f=fr[0];
const [sr,pr]=await Promise.all([get('/rest/v1/fund_smartscore_latest?fund_id=eq.'+encodeURIComponent(id)+'&select=fund_id,final_score,raw_score,rating,data_tier,data_confidence,score_as_of,performance_score,risk_score,benchmark_score,consistency_score,inflation_score,score_explanation,risk_method,track_factor,warnings,qualification_status,calculation_inputs,methodology_version&limit=1'),get('/rest/v1/fund_performance_history?fund_id=eq.'+encodeURIComponent(id)+'&select=report_date,horizon,nav_value,return_pct,rank,currency,report_status,source_id&order=report_date.desc&limit=1000')]);
const s=sr[0]||null,by={};pr.forEach(x=>{if(x.horizon&&!by[x.horizon])by[x.horizon]=x});if(!HS.includes(h))h='last12m';const sel=by[h]||null,score=s&&s.final_score!=null?Number(s.final_score):null,conf=String(s&&s.data_confidence||''),warnings=clean(s&&s.warnings);const sc=score==null?'red':statusClass(s&&s.rating);const cc=statusClass(conf);
const components=[['P','Performance',s&&s.performance_score],['R','Risk',s&&s.risk_score],['B','Benchmark',s&&s.benchmark_score],['C','Consistency',s&&s.consistency_score],['I','Inflation / Safe Alternative',s&&s.inflation_score]];
$('app').innerHTML='<div class="topbar"><a class="back" href="./funds.html">← FUND UNIVERSE</a><div class="asof">'+(s&&s.score_as_of?'VALUATION AS OF · '+esc(s.score_as_of):'NO STORED VALUATION')+'</div></div>'+
'<section class="hero"><div class="hero-head"><div><div class="eyebrow">FUND DNA · INSTITUTIONAL PROFILE</div><h1>'+esc(f.canonical_name)+'</h1><div class="manager">'+esc(f.management_company||'مدير غير متاح')+'</div><div class="tags"><span class="tag">'+esc(cat(f.category))+'</span><span class="tag">'+esc(s&&s.data_tier||'DATA TIER UNAVAILABLE')+'</span><span class="tag">'+esc(s&&s.methodology_version||'SmartScore')+'</span></div></div><div class="protection"><b>Protection Layer</b><br>هذه الشاشة تفسّر التقييم المخزّن والبيانات المصدرية. لا تعيد حساب SmartScore ولا تنشئ حكماً جديداً.</div></div></section>'+
'<section class="pulse"><div class="metric primary"><span class="metric-label">Smart Score</span><span class="metric-value">'+(score==null?'—':score.toFixed(1))+'</span><span class="status"><i class="dot '+(sc==='red'?'red':sc==='amber'?'amber':'')+'"></i>'+(score==null?'NOT RATED':esc(s.rating||'RATED'))+'</span><div class="metric-sub">'+esc(s&&s.methodology_version||'SmartScore')+'</div></div><div class="metric"><span class="metric-label">Return · '+L[h]+'</span><span class="metric-value">'+pct(sel&&sel.return_pct)+'</span><div class="metric-sub">'+(sel?'REPORT · '+esc(sel.report_date):'لا توجد بيانات')+'</div></div><div class="metric"><span class="metric-label">Data Confidence</span><span class="metric-value" style="font-size:24px">'+esc(conf||'—')+'</span><div class="metric-sub">'+esc(s&&s.data_tier||'—')+'</div></div><div class="metric"><span class="metric-label">Qualification</span><span class="metric-value" style="font-size:24px">'+esc(s&&s.qualification_status||'—')+'</span><div class="metric-sub">Track Factor · '+(s&&s.track_factor!=null?Number(s.track_factor).toFixed(2):'—')+'</div></div></section>'+
'<section class="section"><div class="section-head"><h2 class="section-title"><span class="section-no">01</span> SCORE DNA</h2><div class="section-note">المكونات المحفوظة من محرك SmartScore</div></div><div class="score-grid">'+components.map(x=>'<div class="card score-card"><div class="score-top"><span class="score-code">'+x[0]+'</span></div><div class="score-name">'+x[1]+'</div><span class="score-number">'+(x[2]==null?'—':Number(x[2]).toFixed(1))+'</span>'+(x[2]!=null?'<div class="meter"><i style="width:'+Math.max(0,Math.min(100,Number(x[2])))+'%"></i></div>':'')+'</div>').join('')+'</div></section>'+
'<section class="section"><div class="section-head"><h2 class="section-title"><span class="section-no">02</span> BENCHMARK INTELLIGENCE</h2><div class="section-note">مقارنة الصندوق مع السلاسل الموجودة فعلياً في قاعدة البيانات</div></div><div class="card bench-card" id="bench"><div class="muted">جاري حساب المقارنات…</div></div></section>'+
