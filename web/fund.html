<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FUND DNA</title>
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<style>
:root{--dna-accent:#d4b06a;--dna-good:#3ddc8a;--dna-warn:#e0c27a;--dna-bad:#ef7a6e;--dna-blue:#7aa7ff}
.dna-page{padding:28px 0 80px}.topline{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:12px}.crumb{font-size:12px;color:var(--mute)}.crumb a{color:var(--gold)}
.identity{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;margin:8px 0 18px}.identity h1{font-size:clamp(28px,4vw,46px);margin:0 0 7px;letter-spacing:-.03em}.identity-meta{display:flex;flex-wrap:wrap;gap:7px;color:var(--mute);font-size:13px}.pill{border:1px solid var(--line);border-radius:999px;padding:5px 10px;background:#111720}.pill.good{color:var(--dna-good);border-color:#3ddc8a44}.pill.warn{color:var(--dna-warn);border-color:#e0c27a44}.pill.bad{color:var(--dna-bad);border-color:#ef7a6e44}
.pulse{display:grid;grid-template-columns:1.3fr repeat(4,1fr);gap:9px;margin-bottom:14px}.pulse-card,.score-card,.evidence,.integrity,.section-card{background:linear-gradient(180deg,#171d27,#11161e);border:1px solid var(--line);border-radius:16px}.pulse-card{padding:16px}.pulse-card .label,.metric .label{display:block;color:var(--mute);font-size:10px;letter-spacing:.08em;text-transform:uppercase}.pulse-main{padding:20px;position:relative;overflow:hidden}.pulse-main:after{content:"";position:absolute;inset:auto -30px -60px auto;width:160px;height:160px;border-radius:50%;background:#d4b06a0c}.score-big{font:600 46px/1 "IBM Plex Sans",sans-serif;color:var(--violet);direction:ltr;unicode-bidi:isolate;margin-top:8px}.pulse-value{display:block;font:600 22px/1.2 "IBM Plex Sans",sans-serif;margin-top:9px;direction:ltr;unicode-bidi:isolate}.pulse-note{margin-top:9px;color:var(--mute);font-size:11px}.status-line{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:14px;margin:28px 0 10px}.section-head h2{margin:0;font-size:20px}.section-head p{margin:0;color:var(--mute);font-size:11px}.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.score-card{padding:15px}.score-card .letter{font:600 13px "IBM Plex Sans",sans-serif;color:var(--dna-accent)}.score-card strong{display:block;font:600 27px "IBM Plex Sans",sans-serif;margin-top:7px;direction:ltr}.score-card small{display:block;color:var(--mute);font-size:10px;margin-top:4px}.meter{height:5px;background:#0b1016;border-radius:99px;overflow:hidden;margin-top:12px}.meter i{display:block;height:100%;background:var(--gold);border-radius:99px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.section-card{padding:17px}.chart{min-height:300px}.bar-row{display:grid;grid-template-columns:130px 1fr 78px;gap:10px;align-items:center;margin:13px 0}.bar-label{font-size:12px;font-weight:600}.bar-track{height:11px;background:#0b1016;border-radius:99px;overflow:hidden;border:1px solid #ffffff08}.bar-fill{height:100%;border-radius:99px;background:var(--gold)}.bar-fill.good{background:var(--dna-good)}.bar-fill.bad{background:var(--dna-bad)}.bar-value{text-align:left;font:500 12px "IBM Plex Sans",sans-serif;direction:ltr}.bench-meta{font-size:10px;color:var(--mute);margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.risk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.metric{padding:15px;background:#111720;border:1px solid var(--line);border-radius:13px}.metric strong{display:block;font-size:17px;margin-top:7px}.metric .num{font:600 20px "IBM Plex Sans",sans-serif;direction:ltr}.metric small{color:var(--mute);font-size:10px}.integrity-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.integrity{padding:15px}.integrity .label{color:var(--mute);font-size:10px;letter-spacing:.07em}.integrity strong{display:block;margin-top:6px;font-size:14px}.integrity small{display:block;color:var(--mute);font-size:10px;margin-top:4px}.warnings{margin-top:10px;padding:13px;border:1px solid #e0c27a44;background:#e0c27a08;border-radius:12px;color:#ead9ae;font-size:12px;line-height:1.7}.warnings.empty{border-color:#3ddc8a33;background:#3ddc8a07;color:#9be0b7}.evidence{padding:18px;border-inline-start:3px solid var(--gold)}.evidence h3{margin:0 0 8px}.evidence p{margin:0;color:#d8dde4;line-height:1.9;font-size:14px}.raw-toggle{margin-top:12px}.raw-toggle summary{cursor:pointer;color:var(--gold);font-size:11px}.raw-box{margin-top:8px;background:#0b1016;border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;direction:ltr;text-align:left;white-space:pre-wrap;font:11px/1.6 monospace;color:#aeb7c3}
.performance{overflow:auto}.performance table{min-width:760px}.horizon-tabs{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}.horizon-tabs a{padding:7px 10px;border:1px solid var(--line);border-radius:999px;color:var(--mute);font-size:11px}.horizon-tabs a.active{color:#16110a;background:var(--gold);border-color:var(--gold);font-weight:700}.selected-return{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:12px}.selected-return .ret{font:600 31px "IBM Plex Sans",sans-serif;direction:ltr}.selected-return .ret.pos{color:var(--dna-good)}.selected-return .ret.neg{color:var(--dna-bad)}.empty-state{padding:24px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:13px}.protection{padding:13px 15px;border:1px solid #7aa7ff33;background:#7aa7ff08;border-radius:13px;color:#c7d8f7;font-size:11px;line-height:1.7;margin-bottom:12px}.protection b{color:var(--dna-blue)}
@media(max-width:980px){.pulse{grid-template-columns:repeat(3,1fr)}.pulse-main{grid-column:1/-1}.grid5{grid-template-columns:repeat(3,1fr)}.integrity-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:720px){.identity{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.risk-grid,.grid5,.pulse{grid-template-columns:1fr 1fr}.pulse-main{grid-column:1/-1}.bar-row{grid-template-columns:100px 1fr 68px}.integrity-grid{grid-template-columns:1fr 1fr}}
@media(max-width:500px){.dna-page{padding-top:18px}.risk-grid,.grid5,.pulse,.integrity-grid{grid-template-columns:1fr}.pulse-main{grid-column:auto}.bar-row{grid-template-columns:92px 1fr 64px}.identity h1{font-size:28px}}
</style>
</head>
<body>
<header class="site-header"><div class="wrap"><div class="logo">FUND DNA<span>تحليل الصندوق من البيانات والتقييم المخزّن</span></div><nav><a href="./funds.html">عودة إلى الصناديق</a></nav></div></header>
<main class="wrap page dna-page" id="app"><div class="empty-state">جاري تحميل FUND DNA…</div></main>
<script type="module">
import { bucket } from "./js/engine.js";
const params=new URLSearchParams(location.search);
const id=params.get("id");
let selectedH=params.get("h")||"last12m";
const CFG=window.KHATER||{};
const HDR={apikey:CFG.key,Authorization:"Bearer "+CFG.key};
const HS=["weekly","4weeks","ytd","last12m","1y","2y","3y","4y","5y","6y"];
const HL={weekly:"أسبوعي","4weeks":"4 أسابيع",ytd:"منذ بداية العام",last12m:"12 شهراً","1y":"سنة","2y":"سنتان","3y":"3 سنوات","4y":"4 سنوات","5y":"5 سنوات","6y":"6 سنوات"};
const BENCH={
  inflation:{label:"التضخم",series:"cpi_headline_mom_pct",type:"inflation"},
  tbill:{label:"أذون الخزانة 364 يوم",series:"tbill_364_avg_yield_pct",type:"yield"},
  btc:{label:"Bitcoin / EGP",series:"btc_egp",type:"level"},
  qqq:{label:"Nasdaq / EGP",series:"qqq_egp",type:"level"},
  spy:{label:"S&P 500 / EGP",series:"spy_egp",type:"level"},
  usd:{label:"USD / EGP",series:"usd_egp_mid",type:"level"},
  silver:{label:"Silver / EGP",series:"silver_egp_oz",type:"level"},
  gold:{label:"Gold / EGP",series:"gold_egp_oz",type:"level"},
  egx30:{label:"EGX 30",series:"egx30_close",type:"level"}
};
const $=x=>document.getElementById(x);
const esc=s=>String(s??"").replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const num=x=>x==null||Number.isNaN(Number(x))?"—":Number(x).toLocaleString("en-US",{maximumFractionDigits:1});
const pct=x=>x==null?"—":num(x)+"%";
const val=x=>x==null?"—":Number(x).toLocaleString("en-US",{maximumFractionDigits:2});
async function get(path){const r=await fetch(CFG.url+path,{headers:HDR});const j=await r.json();if(!r.ok)throw Error(j.message||("HTTP "+r.status));return j;}
function startDate(end,h){const d=new Date(end+"T00:00:00Z");if(h==="weekly")d.setUTCDate(d.getUTCDate()-7);else if(h==="4weeks")d.setUTCDate(d.getUTCDate()-28);else if(h==="ytd"){d.setUTCMonth(0,1)}else if(h==="last12m")d.setUTCFullYear(d.getUTCFullYear()-1);else if(/^\dy$/.test(h))d.setUTCFullYear(d.getUTCFullYear()-Number(h[0]));else return null;return d.toISOString().slice(0,10)}
function cleanWarnings(w){if(w==null)return[];if(Array.isArray(w))return w.map(x=>typeof x==="string"?x:(x?.message||x?.code||JSON.stringify(x)));if(typeof w==="object")return Object.entries(w).map(([k,v])=>typeof v==="string"?v:k+": "+JSON.stringify(v));return[String(w)]}
function scoreCard(letter,label,v){const n=v==null?null:Number(v);return `<div class="score-card"><span class="letter">${letter}</span><small>${label}</small><strong>${n==null?"—":n.toFixed(1)}</strong>${n==null?"":`<div class="meter"><i style="width:${Math.max(0,Math.min(100,n))}%"></i></div>`}</div>`}
async function benchmarkReturn(meta,h,end){const start=startDate(end,h);if(!start)return null;const r=await get('/rest/v1/macro_series?select=ts_date,value,unit&series_key=eq.'+encodeURIComponent(meta.series)+'&ts_date=gte.'+start+'&ts_date=lte.'+end+'&order=ts_date.asc&limit=5000');const pts=r.filter(x=>x.value!=null);if(!pts.length)return null;if(meta.type==="level"){const a=Number(pts[0].value),z=Number(pts[pts.length-1].value);if(!a)return null;return {value:(z/a-1)*100,start:pts[0].ts_date,end:pts[pts.length-1].ts_date,unit:pts[pts.length-1].unit}}if(meta.type==="inflation"){let f=1;for(const p of pts)f*=1+Number(p.value)/100;return {value:(f-1)*100,start:pts[0].ts_date,end:pts[pts.length-1].ts_date,unit:pts[pts.length-1].unit,calculated:true}}if(meta.type==="yield"){let f=1;for(let i=0;i<pts.length;i++){const d1=pts[i].ts_date;const d2=i+1<pts.length?pts[i+1].ts_date:end;const days=Math.max(0,(Date.parse(d2)-Date.parse(d1))/86400000);if(days)f*=Math.pow(1+Number(pts[i].value)/100,days/365)}return {value:(f-1)*100,start:pts[0].ts_date,end:pts[pts.length-1].ts_date,unit:pts[pts.length-1].unit,calculated:true}}return null}
function renderError(e){$("app").innerHTML=`<div class="empty-state"><h2>تعذر تحميل FUND DNA</h2><p>${esc(e.message||e)}</p><p><a href="./funds.html">العودة إلى شاشة الصناديق</a></p></div>`}
try{
  if(!id)throw Error("معرّف الصندوق غير موجود");
  if(!CFG.url||!CFG.key)throw Error("تحقق من config.js");
  const [fundRows,ssRows,perfRows]=await Promise.all([
    get('/rest/v1/funds?fund_id=eq.'+encodeURIComponent(id)+'&select=fund_id,canonical_name,management_company,category,metadata'),
    get('/rest/v1/fund_smartscore_latest?fund_id=eq.'+encodeURIComponent(id)+'&select=final_score,raw_score,rating,data_tier,data_confidence,score_as_of,performance_score,risk_score,benchmark_score,consistency_score,inflation_score,score_explanation,risk_method,track_factor,warnings,qualification_status,component_availability,calculation_inputs,methodology_version'),
    get('/rest/v1/fund_performance_history?fund_id=eq.'+encodeURIComponent(id)+'&select=report_date,horizon,nav_value,return_pct,rank,currency,report_status,source_id&order=report_date.desc&limit=1000')
  ]);
  const fund=fundRows[0];if(!fund)throw Error("الصندوق غير موجود");
  const ss=ssRows[0]||null;
  const byH={};for(const r of perfRows){if(!byH[r.horizon])byH[r.horizon]=r}
  if(!HS.includes(selectedH))selectedH="last12m";
  const selected=byH[selectedH]||null;
  const score=ss?.final_score!=null?Number(ss.final_score):null;
  const warnings=cleanWarnings(ss?.warnings);
  const qualified=String(ss?.qualification_status||"").toLowerCase()==="qualified";
  const confidence=String(ss?.data_confidence||"");
  const confClass=confidence.toLowerCase().includes("high")?"good":confidence.toLowerCase().includes("insufficient")||confidence.toLowerCase().includes("limited")?"bad":"warn";
  const scoreState=score==null?"NOT RATED":(ss?.rating||"RATED");
  const scoreNote=score==null?(ss?.score_explanation||"بيانات غير كافية لإصدار تقييم موثوق."):(ss?.score_explanation||"التفسير التفصيلي محفوظ في محرك التقييم.");
  const meta=fund.metadata||{};
  const currency=selected?.currency||meta.currency||null;
  $("app").innerHTML=`
    <div class="topline"><div class="crumb"><a href="./funds.html">الصناديق</a> · FUND DNA</div><div class="muted">${ss?.score_as_of?"التقييم حتى "+esc(ss.score_as_of):"لا يوجد تقييم مخزّن"}</div></div>
    <section class="identity">
      <div><div class="kicker">FUND DNA / INSTITUTIONAL PROFILE</div><h1>${esc(fund.canonical_name)}</h1><div class="identity-meta"><span class="pill">${esc(fund.management_company||"مدير غير متاح")}</span><span class="pill">${esc(bucket(fund.category))}</span>${currency?`<span class="pill">${esc(currency)}</span>`:""}<span class="pill">ID · ${esc(fund.fund_id)}</span></div></div>
      <div class="protection"><b>طبقة الحماية</b><br>هذه الشاشة تفسّر البيانات والتقييم المخزّن. لا تنشئ توصية ولا تعيد حساب SmartScore.</div>
    </section>
    <section class="pulse">
      <div class="pulse-card pulse-main"><span class="label">SMART SCORE</span><div class="score-big">${score==null?"—":score.toFixed(1)}</div><div class="status-line"><span class="pill ${score==null?"bad":"good"}">${esc(scoreState)}</span><span class="pill ${confClass}">${esc(confidence||"CONFIDENCE UNAVAILABLE")}</span></div><div class="pulse-note">${esc(ss?.methodology_version||"SmartScore")}${ss?.data_tier?" · "+esc(ss.data_tier):""}</div></div>
      <div class="pulse-card"><span class="label">RETURN · ${esc(HL[selectedH])}</span><span class="pulse-value">${selected?.return_pct==null?"—":pct(selected.return_pct)}</span><div class="pulse-note">${selected?.report_date?"Report "+esc(selected.report_date):"لا توجد بيانات"}</div></div>
      <div class="pulse-card"><span class="label">RATING</span><span class="pulse-value">${esc(ss?.rating||"—")}</span><div class="pulse-note">التصنيف المخزّن</div></div>
      <div class="pulse-card"><span class="label">QUALIFICATION</span><span class="pulse-value">${esc(ss?.qualification_status||"—")}</span><div class="pulse-note">${qualified?"مؤهل للتقييم":"حالة التأهل من المحرك"}</div></div>
      <div class="pulse-card"><span class="label">DATA TIER</span><span class="pulse-value">${esc(ss?.data_tier||"—")}</span><div class="pulse-note">Track Factor: ${ss?.track_factor==null?"—":Number(ss.track_factor).toFixed(2)}</div></div>
    </section>
    <div class="evidence"><h3>لماذا حصل الصندوق على هذه النتيجة؟</h3><p>${esc(scoreNote)}</p></div>
    <div class="section-head"><div><h2>01 · SCORE DNA</h2><p>مكوّنات التقييم كما أعادها محرك SmartScore — بدون إعادة حساب في الواجهة.</p></div></div>
    <section class="grid5">
      ${scoreCard("P","Performance",ss?.performance_score)}
      ${scoreCard("R","Risk",ss?.risk_score)}
      ${scoreCard("B","Benchmark",ss?.benchmark_score)}
      ${scoreCard("C","Consistency",ss?.consistency_score)}
      ${scoreCard("I","Inflation / Safe Alternative",ss?.inflation_score)}
    </section>
    <div class="section-head"><div><h2>02 · BENCHMARK DNA</h2><p>مقارنة الفترة المختارة مع السلاسل الموجودة فعلياً في Supabase.</p></div><div class="muted">${esc(HL[selectedH])}</div></div>
    <section class="section-card" id="benchSection"><div class="empty-state">جاري حساب المقارنات من البيانات الفعلية…</div></section>
    <div class="section-head"><div><h2>03 · RISK DNA</h2><p>معلومات المخاطر التي اعتمد عليها محرك التقييم.</p></div></div>
    <section class="risk-grid">
      <div class="metric"><span class="label">RISK METHOD</span><strong>${esc(ss?.risk_method||"—")}</strong><small>الطريقة المسجلة في المحرك</small></div>
      <div class="metric"><span class="label">RISK SCORE</span><strong class="num">${ss?.risk_score==null?"—":Number(ss.risk_score).toFixed(1)}</strong><small>من سجل SmartScore</small></div>
      <div class="metric"><span class="label">TRACK FACTOR</span><strong class="num">${ss?.track_factor==null?"—":Number(ss.track_factor).toFixed(2)}</strong><small>عامل الخبرة المستخدم في المحرك</small></div>
    </section>
    <div class="section-head"><div><h2>04 · PERFORMANCE DNA</h2><p>الأداء عبر جميع الآفاق المتاحة فعلياً للصندوق.</p></div></div>
    <section class="section-card performance">
      <div class="horizon-tabs">${HS.map(h=>`<a class="${h===selectedH?"active":""}" href="?id=${encodeURIComponent(id)}&h=${encodeURIComponent(h)}">${HL[h]}</a>`).join("")}</div>
      ${selected?`<div class="selected-return"><div><div class="muted">العائد للفترة المختارة</div><div class="ret ${Number(selected.return_pct)>=0?"pos":"neg"}">${selected.return_pct==null?"—":pct(selected.return_pct)}</div></div><div class="muted">تاريخ التقرير: ${esc(selected.report_date)} · المصدر: ${esc(selected.source_id||"—")}</div></div>`:"<div class="empty-state">لا توجد بيانات أداء لهذه الفترة.</div>"}
      <table><thead><tr><th>الأفق</th><th>العائد</th><th>تاريخ التقرير</th><th>NAV</th><th>العملة</th><th>الترتيب</th><th>المصدر</th></tr></thead><tbody>${HS.map(h=>{const r=byH[h];return `<tr><td>${HL[h]}</td><td class="num">${r?.return_pct==null?"—":pct(r.return_pct)}</td><td class="num">${r?.report_date||"—"}</td><td class="num">${r?.nav_value==null?"—":val(r.nav_value)}</td><td>${esc(r?.currency||"—")}</td><td class="num">${r?.rank==null?"—":val(r.rank)}</td><td>${esc(r?.source_id||"—")}</td></tr>`}).join("")}</tbody></table>
    </section>
    <div class="section-head"><div><h2>05 · DATA INTEGRITY</h2><p>جودة البيانات وحالة التأهل والتحذيرات كما هي مسجلة في المحرك.</p></div></div>
    <section class="integrity-grid">
      <div class="integrity"><span class="label">DATA CONFIDENCE</span><strong>${esc(confidence||"—")}</strong><small>درجة الثقة</small></div>
      <div class="integrity"><span class="label">QUALIFICATION</span><strong>${esc(ss?.qualification_status||"—")}</strong><small>حالة التأهل</small></div>
      <div class="integrity"><span class="label">DATA TIER</span><strong>${esc(ss?.data_tier||"—")}</strong><small>تصنيف سجل البيانات</small></div>
      <div class="integrity"><span class="label">METHODOLOGY</span><strong>${esc(ss?.methodology_version||"—")}</strong><small>${ss?.score_as_of?"As of "+esc(ss.score_as_of):"—"}</small></div>
    </section>
    <div class="warnings ${warnings.length?"":"empty"}"><b>${warnings.length?"⚠ تحذيرات المحرك":"✓ لا توجد تحذيرات مسجلة"}</b>${warnings.length?`<ul>${warnings.map(w=>`<li>${esc(w)}</li>`).join("")}</ul>`:""}</div>
    <div class="section-head"><div><h2>06 · EVIDENCE</h2><p>الطبقة التي تربط النتيجة بالبيانات المسجلة.</p></div></div>
    <section class="evidence"><h3>Score Explanation</h3><p>${esc(scoreNote)}</p>${ss?`<details class="raw-toggle"><summary>عرض مدخلات المحرك المسجلة</summary><div class="raw-box">${esc(JSON.stringify({component_availability:ss.component_availability,calculation_inputs:ss.calculation_inputs},null,2))}</div></details>`:""}</section>
    <footer class="site" style="margin-top:26px">FUND DNA · البيانات والتقييمات المعروضة مأخوذة من السجلات الفعلية في Supabase. الشاشة لا تنشئ درجات أو تحذيرات أو Benchmarks بديلة.</footer>
  `;
  const benchRows=[];
  if(selected?.report_date){for(const [k,m] of Object.entries(BENCH)){try{const b=await benchmarkReturn(m,selectedH,selected.report_date);if(b)benchRows.push({key:k,...m,...b})}catch(e){console.warn("Benchmark unavailable",k,e)}}}
  const fundRet=selected?.return_pct==null?null:Number(selected.return_pct);
  if(!benchRows.length){$("benchSection").innerHTML='<div class="empty-state">لا تتوافر بيانات Benchmark قابلة للمقارنة لهذه الفترة.</div>'}else{$("benchSection").innerHTML=`<div>${benchRows.map(b=>{const beat=fundRet!=null&&b.value!=null&&fundRet>=b.value;const width=Math.min(100,Math.max(4,Math.abs(Number(b.value))));return `<div class="bar-row"><div class="bar-label">${esc(b.label)}</div><div class="bar-track"><div class="bar-fill ${beat?"good":"bad"}" style="width:${width}%"></div></div><div class="bar-value">${pct(b.value)} ${beat?"✓":""}</div></div>`}).join("")}</div><div class="bench-meta">✓ يعني أن عائد الصندوق للفترة المختارة ≥ عائد المعيار. السلاسل ذات المستوى تحسب تغير المستوى بين أقرب نقطة بداية ونهاية متاحة. التضخم وأذون الخزانة يظهران كعائد فترة محسوب من السلسلة السنوية/الشهرية، وليس كقيمة خام.</div>`}
}catch(e){renderError(e)}
</script>
</body>
</html>
