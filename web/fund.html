<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FUND DNA</title><script src="config.js"></script><link rel="stylesheet" href="css/app.css"><style>:root{--a:#d4b06a;--g:#3ddc8a;--w:#e0c27a;--b:#ef7a6e;--m:#8b95a5;--l:#ffffff14}.dna{padding:28px 0 70px}.top,.identity,.head{display:flex;justify-content:space-between;gap:16px}.top{margin-bottom:16px}.top a{color:var(--a);text-decoration:none}.muted{color:var(--m);font-size:11px}.identity{align-items:end;margin-bottom:18px}.identity h1{font-size:clamp(28px,4vw,46px);margin:0 0 8px}.pills{display:flex;flex-wrap:wrap;gap:7px}.pill{border:1px solid var(--l);background:#111720;border-radius:99px;padding:5px 10px;font-size:11px}.good{color:var(--g)}.warn{color:var(--w)}.bad{color:var(--b)}.protect,.card{border:1px solid var(--l);border-radius:15px;background:linear-gradient(180deg,#171d27,#11161e)}.protect{max-width:410px;padding:13px;color:#c7d8f7;font-size:11px;line-height:1.7}.grid{display:grid;gap:9px}.pulse{grid-template-columns:1.3fr repeat(4,1fr)}.card{padding:16px}.label{display:block;color:var(--m);font-size:10px;letter-spacing:.07em;text-transform:uppercase}.big{font:600 44px Arial;color:var(--a);direction:ltr;margin-top:8px;display:block}.value{font:600 21px Arial;direction:ltr;margin-top:8px;display:block}.note{color:var(--m);font-size:10px;margin-top:7px;line-height:1.6}.section{margin-top:28px}.head{align-items:end;margin-bottom:10px}.head h2{margin:0;font-size:19px}.head p{margin:0;color:var(--m);font-size:11px}.five{grid-template-columns:repeat(5,1fr)}.score strong{display:block;font:600 27px Arial;direction:ltr;margin-top:7px}.meter{height:5px;background:#0b1016;border-radius:9px;overflow:hidden;margin-top:11px}.meter i{display:block;height:100%;background:var(--a)}.three{grid-template-columns:repeat(3,1fr)}.four{grid-template-columns:repeat(4,1fr)}.bar{display:grid;grid-template-columns:145px 1fr 80px;gap:10px;align-items:center;margin:12px 0}.track{height:10px;background:#0b1016;border-radius:9px;overflow:hidden}.fill{height:100%;background:var(--a)}.fill.good{background:var(--g)}.fill.bad{background:var(--b)}.barv{direction:ltr;text-align:left;font:12px Arial}.meta{border-top:1px solid var(--l);padding-top:10px;margin-top:12px;color:var(--m);font-size:10px;line-height:1.7}.warnbox{padding:12px;border:1px solid #e0c27a44;background:#e0c27a08;border-radius:11px;color:#ead9ae;font-size:12px;line-height:1.7}.warnbox.ok{border-color:#3ddc8a33;background:#3ddc8a07;color:#9be0b7}.evidence{border-inline-start:3px solid var(--a);line-height:1.9}.evidence p{margin:0;font-size:13px}.tabs{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}.tabs a{color:var(--m);border:1px solid var(--l);border-radius:99px;padding:6px 9px;text-decoration:none;font-size:10px}.tabs a.active{background:var(--a);color:#16110a;border-color:var(--a);font-weight:700}.table{overflow:auto}.table table{width:100%;min-width:620px;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid var(--l);font-size:10px;text-align:right}.table th{color:var(--m)}.empty{padding:30px;text-align:center;border:1px dashed var(--l);border-radius:13px;color:var(--m)}@media(max-width:980px){.pulse{grid-template-columns:repeat(3,1fr)}.pulse .main{grid-column:1/-1}.five{grid-template-columns:repeat(3,1fr)}.four{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.identity{display:block}.protect{max-width:none;margin-top:12px}.pulse,.five,.three{grid-template-columns:1fr 1fr}.pulse .main{grid-column:1/-1}.bar{grid-template-columns:95px 1fr 65px}}@media(max-width:480px){.pulse,.five,.three,.four{grid-template-columns:1fr}.pulse .main{grid-column:auto}.identity h1{font-size:28px}}</style></head><body><header class="site-header"><div class="wrap"><div class="logo">FUND DNA<span>تحليل الصندوق من البيانات والتقييم المخزّن</span></div><nav><a href="./funds.html">عودة إلى الصناديق</a></nav></div></header><main class="wrap page dna" id="app"><div class="empty">جاري تحميل FUND DNA…</div></main><script>(function(){'use strict';const q=new URLSearchParams(location.search),id=q.get('id')||q.get('fund_id');let h=q.get('h')||'last12m';const C=window.KHATER||{},H={apikey:C.key,Authorization:'Bearer '+C.key},HS=['weekly','4weeks','ytd','last12m','1y','2y','3y','4y','5y','6y'],L={weekly:'أسبوعي',fourweeks:'4 أسابيع',ytd:'منذ بداية العام',last12m:'12 شهراً','1y':'سنة','2y':'سنتان','3y':'3 سنوات','4y':'4 سنوات','5y':'5 سنوات','6y':'6 سنوات'};const $=x=>document.getElementById(x),esc=x=>String(x==null?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),n=x=>x==null||Number.isNaN(Number(x))?'—':Number(x).toLocaleString('en-US',{maximumFractionDigits:2}),pct=x=>x==null?'—':n(x)+'%';async function get(p){const r=await fetch(C.url+p,{headers:H}),t=await r.text();let j;try{j=t?JSON.parse(t):null}catch(e){throw Error('استجابة غير صالحة من Supabase')}if(!r.ok)throw Error(j&&j.message||'HTTP '+r.status);return j}function cat(x){const z=String(x||'').toLowerCase();if(z.includes('gold'))return'ذهب';if(z.includes('equity')||z.includes('index')||z.includes('sector')||z.includes('thematic'))return'أسهم';if(z.includes('money'))return'نقدي';if(z.includes('fixed income'))return'دخل ثابت';if(z.includes('balanced')||z.includes('mixed')||z.includes('allocator'))return'متوازن';if(z.includes('etf')||z.includes('traded'))return'متداول';if(z.includes('protected')||z.includes('guaranteed'))return'محمي';return x||'غير مصنف'}function clean(w){if(w==null)return[];if(Array.isArray(w))return w.map(x=>typeof x==='string'?x:x&&x.message||x&&x.code||JSON.stringify(x));if(typeof w==='object')return Object.entries(w).map(([k,v])=>k+': '+JSON.stringify(v));return[String(w)]}function start(end,x){const d=new Date(end+'T00:00:00Z');if(x==='weekly')d.setUTCDate(d.getUTCDate()-7);else if(x==='4weeks')d.setUTCDate(d.getUTCDate()-28);else if(x==='ytd')d.setUTCMonth(0,1);else if(x==='last12m')d.setUTCFullYear(d.getUTCFullYear()-1);else if(/^\dy$/.test(x))d.setUTCFullYear(d.getUTCFullYear()-Number(x[0]));else return null;return d.toISOString().slice(0,10)}async function benchmark(series,type,end){const s=start(end,h);if(!s)return null;const p=(await get('/rest/v1/macro_series?select=ts_date,value,unit&series_key=eq.'+encodeURIComponent(series)+'&ts_date=gte.'+s+'&ts_date=lte.'+end+'&order=ts_date.asc&limit=5000')).filter(x=>x.value!=null);if(!p.length)return null;if(type==='level'){const a=Number(p[0].value),z=Number(p[p.length-1].value);return a?(z/a-1)*100:null}let f=1;if(type==='inflation')p.forEach(x=>f*=1+Number(x.value)/100);else for(let i=0;i<p.length;i++){const days=Math.max(0,(Date.parse(i+1<p.length?p[i+1].ts_date:end)-Date.parse(p[i].ts_date))/86400000);if(days)f*=Math.pow(1+Number(p[i].value)/100,days/365)}return(f-1)*100}function fail(e){$('app').innerHTML='<div class="empty"><h2>تعذر تحميل FUND DNA</h2><p>'+esc(e.message||e)+'</p><p><a href="./funds.html">العودة إلى شاشة الصناديق</a></p></div>';console.error(e)}async function load(){if(!id)throw Error('معرّف الصندوق غير موجود في الرابط');if(!C.url||!C.key)throw Error('config.js غير متاح أو مفاتيح Supabase غير موجودة');const fr=await get('/rest/v1/funds?fund_id=eq.'+encodeURIComponent(id)+'&select=fund_id,canonical_name,management_company,category,metadata&limit=1');if(!fr.length)throw Error('الصندوق غير موجود: '+id);const f=fr[0];const [sr,pr]=await Promise.all([get('/rest/v1/fund_smartscore_latest?fund_id=eq.'+encodeURIComponent(id)+'&select=fund_id,final_score,raw_score,rating,data_tier,data_confidence,score_as_of,performance_score,risk_score,benchmark_score,consistency_score,inflation_score,score_explanation,risk_method,track_factor,warnings,qualification_status,calculation_inputs,methodology_version&limit=1'),get('/rest/v1/fund_performance_history?fund_id=eq.'+encodeURIComponent(id)+'&select=report_date,horizon,nav_value,return_pct,rank,currency,report_status,source_id&order=report_date.desc&limit=1000')]);const s=sr[0]||null,by={};pr.forEach(x=>{if(x.horizon&&!by[x.horizon])by[x.horizon]=x});if(!HS.includes(h))h='last12m';const sel=by[h]||null,score=s&&s.final_score!=null?Number(s.final_score):null,conf=String(s&&s.data_confidence||''),cc=conf.toLowerCase().includes('high')?'good':conf.toLowerCase().includes('insufficient')||conf.toLowerCase().includes('limited')?'bad':'warn',warnings=clean(s&&s.warnings);$('app').innerHTML='<div class="top"><div><a href="./funds.html">الصناديق</a> · FUND DNA</div><div class="muted">'+(s&&s.score_as_of?'التقييم حتى '+esc(s.score_as_of):'لا يوجد تقييم مخزّن')+'</div></div><section class="identity"><div><div class="muted">FUND DNA / INSTITUTIONAL PROFILE</div><h1>'+esc(f.canonical_name)+'</h1><div class="pills"><span class="pill">'+esc(f.management_company||'مدير غير متاح')+'</span><span class="pill">'+esc(cat(f.category))+'</span><span class="pill">ID · '+esc(f.fund_id)+'</span></div></div><div class="protect"><b>طبقة الحماية</b><br>هذه الشاشة تفسّر البيانات والتقييم المخزّن ولا تعيد حساب SmartScore.</div></section><section class="grid pulse"><div class="card main"><span class="label">SMART SCORE</span><span class="big">'+(score==null?'—':score.toFixed(1))+'</span><div class="pills"><span class="pill '+(score==null?'bad':'good')+'">'+(score==null?'NOT RATED':esc(s.rating||'RATED'))+'</span><span class="pill '+cc+'">'+esc(conf||'CONFIDENCE UNAVAILABLE')+'</span></div><div class="note">'+esc(s&&s.methodology_version||'SmartScore')+'</div></div><div class="card"><span class="label">RETURN · '+L[h]+'</span><span class="value">'+pct(sel&&sel.return_pct)+'</span><div class="note">'+(sel?'Report '+esc(sel.report_date):'لا توجد بيانات')+'</div></div><div class="card"><span class="label">RATING</span><span class="value">'+esc(s&&s.rating||'—')+'</span></div><div class="card"><span class="label">QUALIFICATION</span><span class="value">'+esc(s&&s.qualification_status||'—')+'</span></div><div class="card"><span class="label">DATA TIER</span><span class="value">'+esc(s&&s.data_tier||'—')+'</span><div class="note">Track Factor: '+(s&&s.track_factor!=null?Number(s.track_factor).toFixed(2):'—')+'</div></div></section><section class="section"><div class="head"><h2>03 · SCORE DNA</h2><p>المكونات المحفوظة من محرك SmartScore</p></div><div class="grid five">'+[['P','Performance',s&&s.performance_score],['R','Risk',s&&s.risk_score],['B','Benchmark',s&&s.benchmark_score],['C','Consistency',s&&s.consistency_score],['I','Inflation / Safe Alternative',s&&s.inflation_score]].map(x=>'<div class="card score"><span class="label">'+x[0]+' · '+x[1]+'</span><strong>'+(x[2]==null?'—':Number(x[2]).toFixed(1))+'</strong>'+(x[2]!=null?'<div class="meter"><i style="width:'+Math.max(0,Math.min(100,Number(x[2])))+'%"></i></div>':'')+'</div>').join('')+'</div></section><section class="section"><div class="head"><h2>04 · BENCHMARK DNA</h2><p>المعايير الموجودة فعلياً في قاعدة البيانات</p></div><div class="card" id="bench"><div class="muted">جاري حساب المقارنات…</div></div></section><section class="section"><div class="head"><h2>05 · RISK DNA</h2></div><div class="grid three"><div class="card"><span class="label">RISK METHOD</span><strong>'+esc(s&&s.risk_method||'—')+'</strong></div><div class="card"><span class="label">RISK SCORE</span><span class="value">'+(s&&s.risk_score!=null?n(s.risk_score):'—')+'</span></div><div class="card"><span class="label">TRACK FACTOR</span><span class="value">'+(s&&s.track_factor!=null?Number(s.track_factor).toFixed(2):'—')+'</span></div></div></section><section class="section"><div class="head"><h2>06 · DATA INTEGRITY</h2></div><div class="grid four"><div class="card"><span class="label">CONFIDENCE</span><strong class="'+cc+'">'+esc(conf||'—')+'</strong></div><div class="card"><span class="label">QUALIFICATION</span><strong>'+esc(s&&s.qualification_status||'—')+'</strong></div><div class="card"><span class="label">DATA TIER</span><strong>'+esc(s&&s.data_tier||'—')+'</strong></div><div class="card"><span class="label">AS OF</span><strong>'+esc(s&&s.score_as_of||'—')+'</strong></div></div><div class="warnbox '+(warnings.length?'':'ok')+'">'+(warnings.length?warnings.map(esc).join('<br>'):'لا توجد تحذيرات محفوظة.')+'</div></section><section class="section"><div class="head"><h2>07 · PERFORMANCE DNA</h2></div><div class="card"><div class="tabs">'+HS.filter(x=>by[x]).map(x=>'<a class="'+(x===h?'active':'')+'" href="?id='+encodeURIComponent(id)+'&h='+x+'">'+L[x]+'</a>').join('')+'</div><div class="table"><table><thead><tr><th>الفترة</th><th>التاريخ</th><th>العائد</th><th>NAV</th><th>Rank</th></tr></thead><tbody>'+HS.filter(x=>by[x]).map(x=>'<tr><td>'+L[x]+'</td><td>'+esc(by[x].report_date)+'</td><td>'+pct(by[x].return_pct)+'</td><td>'+n(by[x].nav_value)+'</td><td>'+n(by[x].rank)+'</td></tr>').join('')+'</tbody></table></div></div></section><section class="section"><div class="head"><h2>08 · EVIDENCE</h2></div><div class="card evidence"><p>'+esc(s&&s.score_explanation||'لا يوجد تفسير محفوظ لهذا الصندوق.')+'</p><details><summary class="muted">عرض calculation inputs</summary><pre style="direction:ltr;text-align:left;white-space:pre-wrap">'+esc(s&&s.calculation_inputs?JSON.stringify(s.calculation_inputs,null,2):'لا توجد')+'</pre></details></div></section>';const B=[['التضخم','cpi_headline_mom_pct','inflation'],['أذون الخزانة 364 يوم','tbill_364_avg_yield_pct','yield'],['Bitcoin / EGP','btc_egp','level'],['Nasdaq / EGP','qqq_egp','level'],['S&P 500 / EGP','spy_egp','level'],['USD / EGP','usd_egp_mid','level'],['Silver / EGP','silver_egp_oz','level'],['Gold / EGP','gold_egp_oz','level'],['EGX 30','egx30_close','level']];let rows=[];if(sel&&sel.report_date){for(const b of B){try{const v=await benchmark(b[1],b[2],sel.report_date);if(v!=null)rows.push({label:b[0],v})}catch(e){}}}const r=sel&&sel.return_pct!=null?Number(sel.return_pct):null;$('bench').innerHTML=rows.length?rows.map(b=>'<div class="bar"><div>'+esc(b.label)+'</div><div class="track"><div class="fill '+(r!=null&&r>=b.v?'good':'bad')+'" style="width:'+Math.min(100,Math.max(4,Math.abs(b.v)))+'%"></div></div><div class="barv">'+pct(b.v)+(r!=null&&r>=b.v?' ✓':'')+'</div></div>').join('')+'<div class="meta">✓ تعني أن عائد الصندوق للفترة المختارة ≥ عائد المعيار. المقارنة تستخدم السلاسل المتاحة فعلياً.</div>':'<div class="empty">لا تتوافر بيانات Benchmark لهذه الفترة.</div>'}load().catch(fail)})();</script></body></html>
