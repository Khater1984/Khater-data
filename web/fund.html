<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Fund DNA</title>
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/app.css"/>
<script src="https://unpkg.com/lightweight-charts@4.2.1/dist/lightweight-charts.standalone.production.js"></script>
<style>
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:800px){.kpis{grid-template-columns:1fr 1fr}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.chartbox{height:280px;direction:ltr}
.why{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.why .card em{display:block;color:var(--mute);font-size:11px}
.tag{border:1px solid #355e4a;color:#7dcc8a;border-radius:999px;padding:4px 10px;font-size:12px;margin:4px;display:inline-block}
</style>
</head>
<body>
<header class="site-header"><div class="wrap">
  <div class="logo">FUND DNA<span>من التقييم المخزّن في القاعدة</span></div>
  <nav><a href="./funds.html">عودة</a></nav>
</div></header>
<main class="wrap page" id="app">جاري التحميل…</main>
<script type="module">
import { bucket } from "./js/engine.js";
import { BENCH_META } from "./js/score.js";
const id=new URLSearchParams(location.search).get("id");
const h0=new URLSearchParams(location.search).get("h")||"last12m";
const CFG=window.KHATER||{};
const headers={apikey:CFG.key,Authorization:"Bearer "+CFG.key};
const rows=await (await fetch(CFG.url+"/rest/v1/funds?fund_id=eq."+encodeURIComponent(id)+"&select=fund_id,canonical_name,management_company,category,metadata",{headers})).json();
const raw=rows[0];
const BENCH=await (await fetch("data/benchmarks.json")).json();
const f=raw?{id:raw.fund_id,name:raw.canonical_name,manager:raw.management_company,category:raw.category,scores:(raw.metadata||{}).scores||{},scores_as_of:(raw.metadata||{}).scores_as_of||null}:null;
if(!f){document.getElementById("app").textContent="غير موجود"; throw 0;}
const HS=["weekly","4weeks","ytd","last12m","2y","3y","4y","5y","6y"];
const HL={weekly:"أسبوع","4weeks":"4 أسابيع",ytd:"YTD",last12m:"12M","2y":"2Y","3y":"3Y","4y":"4Y","5y":"5Y","6y":"6Y"};
const s=(f.scores||{})[h0]||{};
document.getElementById("app").innerHTML=`
  <div class="muted"><a href="./funds.html">الصناديق</a> · تقييم ${f.scores_as_of||"—"} · أفق ${HL[h0]||h0}</div>
  <h1>${f.name}</h1>
  <p class="muted">${f.manager||""} · ${bucket(f.category)} · ليست توصية</p>
  <div class="kpis">
    <div class="kpi"><em>RETURN</em><b class="num">${s.return_pct==null?"—":s.return_pct.toLocaleString("en-US",{maximumFractionDigits:1})+"%"}</b></div>
    <div class="kpi"><em>SCORE</em><b class="num score">${s.score==null?"—":s.score}</b></div>
    <div class="kpi"><em>RATING</em><b>${s.rating||"—"}</b></div>
    <div class="kpi"><em>CONF</em><b>${s.conf||"—"}</b></div>
  </div>
  <div class="grid2">
    <div class="card"><h3>العائد عبر الآفاق</h3><div id="retChart" class="chartbox"></div></div>
    <div class="card"><h3>مقابل المراجع — ${HL[h0]||h0}</h3><div id="benchChart" class="chartbox"></div></div>
  </div>
`;

const retEl=document.getElementById("retChart");
const rc=LightweightCharts.createChart(retEl,{layout:{background:{color:"#151b24"},textColor:"#8b95a5"},grid:{vertLines:{color:"#1c2430"},horzLines:{color:"#1c2430"}},rightPriceScale:{borderVisible:false},timeScale:{visible:false,borderVisible:false}});
const rs=rc.addHistogramSeries({priceLineVisible:false});
rs.setData(HS.map((k,i)=>({time:"2020-01-"+String(i+1).padStart(2,"0"),value:(f.scores?.[k]?.return_pct)??0,color:(f.scores?.[k]?.return_pct||0)>=0?"#3ddc8a":"#ef7a6e"})));
rc.applyOptions({width:retEl.clientWidth,height:280});

const names=Object.fromEntries(BENCH_META);
const vals=BENCH.horizons[h0]||{};
const fundR=s.return_pct;
const benchEl=document.getElementById("benchChart");
const bc=LightweightCharts.createChart(benchEl,{layout:{background:{color:"#151b24"},textColor:"#8b95a5"},grid:{vertLines:{color:"#1c2430"},horzLines:{color:"#1c2430"}},rightPriceScale:{borderVisible:false},timeScale:{visible:false,borderVisible:false}});
const bs=bc.addHistogramSeries({priceLineVisible:false});
const points=BENCH_META.map(([k],i)=>({time:`2020-02-${String(i+1).padStart(2,"0")}`,value:vals[k]??0,color:(fundR!=null && vals[k]!=null && fundR>=vals[k])?"#3ddc8a":"#5c6673"}));
bs.setData(points);
bc.applyOptions({width:benchEl.clientWidth,height:280});
new ResizeObserver(()=>{rc.applyOptions({width:retEl.clientWidth});bc.applyOptions({width:benchEl.clientWidth});}).observe(retEl);
</script>
</body></html>
