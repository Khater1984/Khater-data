name: Fix heatmap fund tiles
on:
  push:
    paths:
      - '.github/workflows/fix-heatmap-empty.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Replace heatmap renderer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('web/categories.html')
          s=p.read_text(encoding='utf-8')
          new=r'''function renderHeatmap(gs){
            gs=A(gs);
            const canvas=$('heatCanvas');
            if(!canvas)return;
            canvas.innerHTML='';
            const visible=state.filtered.length;
            const rated=state.filtered.filter(f=>{const sc=state.scores.get(f.fund_id)||state.scores.get(S(f.fund_id));return N(sc&&sc.final_score)!=null}).length;
            const vals=state.filtered.map(f=>{const sc=state.scores.get(f.fund_id)||state.scores.get(S(f.fund_id));return N(sc&&sc.final_score)}).filter(v=>v!=null);
            text('heatFunds',visible);
            text('heatRated',rated);
            text('heatCoverage',visible?Math.round(rated/visible*100)+'%':'0%');
            text('heatTop',vals.length?Math.max(...vals).toFixed(1):'—');
            text('heatCats',gs.length);
            text('heatMode',state.heatCategory?'CATEGORY':'MARKET');
            const back=$('heatBack'),all=$('heatAll');
            if(back)back.style.display=state.heatCategory?'inline-block':'none';
            if(all)all.classList.toggle('active',!state.heatCategory);
            if(!gs.length){canvas.innerHTML='<div class="loading">لا توجد بيانات مطابقة للفلاتر الحالية.</div>';return}
            const W=Math.max(1,canvas.clientWidth),H=Math.max(1,canvas.clientHeight);
            const rects=sectorRects(gs,W,H);
            rects.forEach(r=>{
              const g=r.item;
              if(!g)return;
              const box=document.createElement('div');
              box.className='sector-box';
              box.style.left=r.x+'px';box.style.top=r.y+'px';box.style.width=Math.max(2,r.w)+'px';box.style.height=Math.max(2,r.h)+'px';
              const title=document.createElement('div');title.className='sector-title';
              title.innerHTML='<b>'+esc(g.name)+'</b><span>'+A(g.funds).length+' funds</span>';
              box.appendChild(title);
              const tiles=document.createElement('div');tiles.className='sector-tiles';
              const iw=Math.max(1,r.w-8),ih=Math.max(1,r.h-38);
              tileRects(A(g.funds),iw,ih).forEach(t=>{
                const f=t.item;if(!f)return;
                const tile=document.createElement('a');tile.className='fund-tile';
                tile.href='./fund.html?id='+encodeURIComponent(S(f.fund_id));
                tile.style.left=t.x+'px';tile.style.top=t.y+'px';tile.style.width=Math.max(2,t.w-2)+'px';tile.style.height=Math.max(2,t.h-2)+'px';
                const sc=state.scores.get(f.fund_id)||state.scores.get(S(f.fund_id))||{};
                const score=N(sc.final_score);
                tile.style.background=scoreColor(score);
                tile.title=S(f.canonical_name)+(score==null?'':' · SmartScore '+score.toFixed(1));
                tile.innerHTML='<span class="name">'+esc(f.canonical_name||'Unnamed Fund')+'</span><span class="scorev">'+(score==null?'—':score.toFixed(1))+'</span><span class="meta">'+(score==null?'Not Rated':'SmartScore')+'</span>';
                tiles.appendChild(tile);
              });
              box.appendChild(tiles);
              box.ondblclick=()=>{state.heatCategory=g.name;render()};
              canvas.appendChild(box);
            });
          }
          function renderList'''
          pattern=r'function renderHeatmap\(.*?\}\s*function renderList'
          ns,n=re.subn(pattern,new,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit('renderHeatmap boundary not found; refusing modification')
          p.write_text(ns,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/categories.html
          git commit -m 'Render actual funds inside heatmap sectors'
          git push
      - name: Remove one-shot workflow
        if: always()
        run: |
          rm -f .github/workflows/fix-heatmap-empty.yml
          git add .github/workflows/fix-heatmap-empty.yml
          git commit -m 'Remove temporary heatmap patch workflow' || true
          git push || true
