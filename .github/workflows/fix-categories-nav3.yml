name: Stabilize categories navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stabilize nav layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('web/categories.html')
          s = p.read_text(encoding='utf-8')
          marker = '</style>'
          css = '''
          /* HARD NAV STABILITY: active state must never change sibling geometry */
          .nav{display:flex!important;align-items:stretch!important;gap:6px!important;flex-wrap:nowrap!important}
          .nav a,.nav a:hover,.nav a:focus-visible,.nav a.active{
            flex:0 0 128px!important;
            width:128px!important;
            min-width:128px!important;
            max-width:128px!important;
            height:40px!important;
            min-height:40px!important;
            max-height:40px!important;
            box-sizing:border-box!important;
            padding:0 10px!important;
            margin:0!important;
            font-family:Arial,sans-serif!important;
            font-size:12px!important;
            font-weight:700!important;
            line-height:1!important;
            letter-spacing:normal!important;
            white-space:nowrap!important;
            transform:none!important;
          }
          .nav a.active{border-width:1px!important}
          .nav a.active:after{pointer-events:none!important;box-sizing:border-box!important}
          @media(max-width:700px){
            .nav{width:100%!important;overflow-x:auto!important;overflow-y:hidden!important}
            .nav a,.nav a:hover,.nav a:focus-visible,.nav a.active{flex:0 0 128px!important;width:128px!important;min-width:128px!important;max-width:128px!important}
          }
          '''
          if marker not in s:
              raise SystemExit('style marker not found')
          if 'HARD NAV STABILITY' not in s:
              s = s.replace(marker, css + '\n' + marker, 1)
              p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/categories.html
          if ! git diff --cached --quiet; then
            git commit -m 'fix: harden categories navigation stability'
            git push
          fi