name: Normalize categories navigation
on:
  push:
    paths:
      - '.github/workflows/fix-categories-nav-final.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize categories navigation
        shell: python
        run: |
          from pathlib import Path
          p = Path('web/categories.html')
          s = p.read_text(encoding='utf-8')
          old = '<header class="header"><div class="wrap"><div class="brand">Khater Funds Radar<span>Institutional Fund Intelligence</span></div><nav class="nav"><a href="./index.html">البداية</a><a href="./map.html">ماذا حدث للفلوس؟</a><a href="./funds.html">الصناديق</a><a class="active" href="./categories.html">خريطة الفئات</a><a href="./macro.html">الاقتصاد</a><a href="./why.html">المنهج</a></nav></div></header>'
          new = '<header class="site-header"><div class="wrap"><div class="logo">خريطة الفلوس<span>خريطة الفئات</span></div><nav><a href="./index.html">البداية</a><a href="./map.html">ماذا حدث للفلوس؟</a><a href="./funds.html">الصناديق</a><a class="active" href="./categories.html">خريطة الفئات</a><a href="./macro.html">الاقتصاد</a><a href="./why.html">المنهج</a></nav></div></header>'
          if old not in s:
              raise SystemExit('Expected categories header not found')
          s = s.replace(old, new, 1)
          marker = '</style>'
          css = '''\n/* FINAL NAV: same geometry and typography as the shared site navigation */\n@import url(\"https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap\");\n.site-header{border-bottom:1px solid var(--line);background:rgba(10,14,18,.86);position:sticky;top:0;z-index:30;backdrop-filter:blur(16px)}\n.site-header .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px;max-width:1180px;margin:0 auto;padding:0 22px}\n.site-header .logo{font-weight:700;letter-spacing:.01em}\n.site-header .logo span{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:1px}\n.site-header nav{display:flex;gap:6px;font-size:13.5px;color:var(--muted);flex-wrap:nowrap}\n.site-header nav a,.site-header nav a:hover,.site-header nav a:focus-visible,.site-header nav a.active{position:relative;display:flex;align-items:center;justify-content:center;flex:0 0 128px;width:128px;min-width:128px;max-width:128px;height:40px;box-sizing:border-box;color:var(--muted);text-decoration:none;font-family:\"IBM Plex Sans Arabic\",system-ui,sans-serif;font-size:12px;font-weight:700;padding:0 10px;margin:0;border-radius:10px;border:1px solid transparent;white-space:nowrap;line-height:1;transform:none;opacity:1;transition:color .2s ease,background .2s ease,box-shadow .2s ease}\n.site-header nav a:hover{color:var(--text);background:rgba(255,255,255,.055)}\n.site-header nav a:focus-visible{outline:2px solid rgba(214,180,106,.75);outline-offset:2px}\n.site-header nav a.active{color:#11151a;background:var(--gold);border-color:var(--gold);box-shadow:0 5px 16px rgba(214,180,106,.22),inset 0 1px 0 rgba(255,255,255,.28)}\n.site-header nav a.active:after{content:\"\";position:absolute;left:22%;right:22%;bottom:3px;height:2px;border-radius:2px;background:rgba(17,21,26,.7);pointer-events:none}\n@media(max-width:700px){.site-header .wrap{height:auto;min-height:64px;padding-top:12px;padding-bottom:12px;align-items:flex-start;flex-direction:column;gap:10px}.site-header nav{width:100%;overflow-x:auto;overflow-y:hidden;padding:5px;flex-wrap:nowrap;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.025);border-radius:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.025)}.site-header nav a,.site-header nav a:hover,.site-header nav a:focus-visible,.site-header nav a.active{flex:0 0 128px;width:128px;min-width:128px;max-width:128px}}\n'''
          if marker not in s:
              raise SystemExit('style close not found')
          s = s.replace(marker, css + marker, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/categories.html .github/workflows/fix-categories-nav-final.yml
          git rm .github/workflows/fix-categories-nav-final.yml
          git commit -m 'fix: make categories navigation identical to shared nav'
          git push
