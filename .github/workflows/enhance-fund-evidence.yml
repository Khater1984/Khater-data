name: Enhance fund profile evidence
on:
  push:
    paths: ['.github/workflows/enhance-fund-evidence.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch evidence fields
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('web/fund.html')
          s=p.read_text(encoding='utf-8')
          old="select=fund_id,final_score,raw_score,rating,data_tier,data_confidence,score_as_of,performance_score,risk_score,benchmark_score,consistency_score,inflation_score,score_explanation,risk_method,track_factor,warnings,qualification_status,calculation_inputs,methodology_version"
          new="select=fund_id,final_score,raw_score,rating,data_tier,data_confidence,data_quality,score_as_of,signal_as_of,latest_day_change_pct,latest_signal_status,performance_score,risk_score,benchmark_score,consistency_score,inflation_score,score_explanation,risk_method,track_factor,warnings,qualification_status,calculation_inputs,effective_weights,component_availability,methodology_version"
          if old not in s: raise SystemExit('Expected SmartScore select not found; aborting')
          s=s.replace(old,new,1)
          old_badges='<span class="e-badge">SMARTSCORE · '+"'+esc(s&&s.methodology_version||'—')+'"+'</span><span class="e-badge">CONFIDENCE · '+"'+esc(conf||'—')+'"+'</span><span class="e-badge">QUALIFICATION · '+"'+esc(s&&s.qualification_status||'—')+'"+'</span>'
          new_badges='<span class="e-badge">SMARTSCORE · '+"'+esc(s&&s.methodology_version||'—')+'"+'</span><span class="e-badge">CONFIDENCE · '+"'+esc(conf||'—')+'"+'</span><span class="e-badge">DATA QUALITY · '+"'+esc(s&&s.data_quality||'—')+'"+'</span><span class="e-badge">QUALIFICATION · '+"'+esc(s&&s.qualification_status||'—')+'"+'</span><span class="e-badge">SIGNAL · '+"'+esc(s&&s.signal_as_of||'—')+'"+'</span>'
          if old_badges not in s: raise SystemExit('Expected evidence badges not found; aborting')
          s=s.replace(old_badges,new_badges,1)
          old_meta='<div class="integrity"><div class="integrity-item"><div class="k">Confidence</div><span class="v">'+"'+esc(conf||'—')+'"+'</span></div><div class="integrity-item"><div class="k">Qualification</div><span class="v">'+"'+esc(s&&s.qualification_status||'—')+'"+'</span></div><div class="integrity-item"><div class="k">Data Tier</div><span class="v">'+"'+esc(s&&s.data_tier||'—')+'"+'</span></div><div class="integrity-item"><div class="k">Methodology</div><span class="v">'+"'+esc(s&&s.methodology_version||'—')+'"+'</span></div></div>'
          new_meta='<div class="integrity"><div class="integrity-item"><div class="k">Confidence</div><span class="v">'+"'+esc(conf||'—')+'"+'</span></div><div class="integrity-item"><div class="k">Data Quality</div><span class="v">'+"'+esc(s&&s.data_quality||'—')+'"+'</span></div><div class="integrity-item"><div class="k">Qualification</div><span class="v">'+"'+esc(s&&s.qualification_status||'—')+'"+'</span></div><div class="integrity-item"><div class="k">Data Tier</div><span class="v">'+"'+esc(s&&s.data_tier||'—')+'"+'</span></div><div class="integrity-item"><div class="k">Methodology</div><span class="v">'+"'+esc(s&&s.methodology_version||'—')+'"+'</span></div><div class="integrity-item"><div class="k">Signal As Of</div><span class="v">'+"'+esc(s&&s.signal_as_of||'—')+'"+'</span></div></div>'
          if old_meta not in s: raise SystemExit('Expected integrity block not found; aborting')
          s=s.replace(old_meta,new_meta,1)
          old_details='<details><summary>Fund Metadata</summary><pre>'+"'+esc(f.metadata?JSON.stringify(f.metadata,null,2):'لا توجد بيانات محفوظة')+'"+'</pre></details>'
          new_details='<details><summary>Effective Weights</summary><pre>'+"'+esc(s&&s.effective_weights?JSON.stringify(s.effective_weights,null,2):'لا توجد بيانات محفوظة')+'"+'</pre></details><details><summary>Component Availability</summary><pre>'+"'+esc(s&&s.component_availability?JSON.stringify(s.component_availability,null,2):'لا توجد بيانات محفوظة')+'"+'</pre></details><details><summary>Fund Metadata</summary><pre>'+"'+esc(f.metadata?JSON.stringify(f.metadata,null,2):'لا توجد بيانات محفوظة')+'"+'</pre></details>'
          if old_details not in s: raise SystemExit('Expected metadata details not found; aborting')
          s=s.replace(old_details,new_details,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/fund.html
          git diff --cached --quiet || git commit -m 'feat: expose stored fund evidence metadata'
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/enhance-fund-evidence.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'chore: remove temporary workflow'
          git push || true
