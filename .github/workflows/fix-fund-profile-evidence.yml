name: Fix fund profile evidence
on:
  push:
    paths: ['.github/workflows/fix-fund-profile-evidence.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch fund profile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('web/fund.html')
          s=p.read_text(encoding='utf-8')
          old='''async function benchmark(series,type,end){if(!end)return null;const s=startDate(end,h);if(!s)return null;const p=(await get('/rest/v1/macro_series?select=ts_date,value,unit&series_key=eq.'+encodeURIComponent(series)+'&ts_date=gte.'+s+'&ts_date=lte.'+end+'&order=ts_date.asc&limit=5000')).filter(x=>x.value!=null);if(!p.length)return null;if(type==='level'){const a=Number(p[0].value),z=Number(p[p.length-1].value);return a?(z/a-1)*100:null}let factor=1;if(type==='inflation'){p.forEach(x=>{factor*=1+Number(x.value)/100})}else{for(let i=0;i<p.length;i++){const next=i+1<p.length?p[i+1].ts_date:end;const days=Math.max(0,(Date.parse(next)-Date.parse(p[i].ts_date))/86400000);if(days)factor*=Math.pow(1+Number(p[i].value)/100,days/365)}}return(factor-1)*100}'''
          new='''async function benchmark(series,type,end){if(!end)return null;const requestedStart=startDate(end,h);if(!requestedStart)return null;if(type==='inflation'&&(h==='weekly'||h==='4weeks'))return null;const p=(await get('/rest/v1/macro_series?select=ts_date,value,unit&series_key=eq.'+encodeURIComponent(series)+'&ts_date=gte.'+requestedStart+'&ts_date=lte.'+end+'&order=ts_date.asc&limit=5000')).filter(x=>x.value!=null);if(!p.length)return null;const actualStart=p[0].ts_date,actualEnd=p[p.length-1].ts_date;if(type==='level'){const a=Number(p[0].value),z=Number(p[p.length-1].value);return a?(z/a-1)*100:null}if(type==='inflation'){let factor=1;for(const x of p){const n=Number(x.value);if(!Number.isFinite(n))return null;factor*=1+n/100}return(factor-1)*100}if(type==='tbill'){const nums=p.map(x=>Number(x.value));if(nums.some(n=>!Number.isFinite(n)))return null;const avg=nums.reduce((a,b)=>a+b,0)/nums.length;const days=Math.max(1,(Date.parse(actualEnd)-Date.parse(actualStart))/86400000);return avg*days/365}return null}'''
          if old not in s:
              raise SystemExit('Expected benchmark function not found; aborting without changes')
          s=s.replace(old,new,1)
          old_header='<header class="site-header"><div class="wrap"><div class="logo">FUND DNA<span>Institutional Fund Intelligence</span></div><nav><a href="./funds.html">FUND UNIVERSE</a></nav></div></header>'
          new_header='''<header class="site-header"><div class="wrap"><div class="logo">رادار السوق المصري<span>منصة فهم الاقتصاد وتحليل صناديق الاستثمار</span></div><nav>\n<a href="./index.html">البداية</a>\n<a href="./map.html">ماذا حدث للفلوس؟</a>\n<a href="./funds.html">الصناديق</a>\n<a href="./categories.html">خريطة الفئات</a>\n<a href="./macro.html">الاقتصاد</a>\n<a href="./why.html">المنهج</a>\n</nav></div></header>'''
          if old_header not in s:
              raise SystemExit('Expected fund header not found; aborting without changes')
          s=s.replace(old_header,new_header,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/fund.html
          git diff --cached --quiet || git commit -m 'fix: align fund profile benchmark evidence'
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/fix-fund-profile-evidence.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'chore: remove temporary workflow'
          git push || true
