name: Repair categories heatmap v2
on:
  push:
    paths:
      - '.github/workflows/repair-categories-heatmap-v2.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Replace renderer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('web/categories.html')
          s=p.read_text(encoding='utf-8')
          new=r'''function renderHeatmap(gs){
            gs=A(gs).filter(g=>g&&Array.isArray(g.funds)&&g.funds.length);
            const canvas=$('heatCanvas');
            if(!canvas)return;
            canvas.innerHTML='';
            const funds=A(state.filtered);
            const scoreOf=f=>{const id=S(f&&f.fund_id);return state.scores.get(id)||state.scores.get(f&&f.fund_id)||null};
            const scoreVal=f=>{const q=scoreOf(f);return N(q&&q.final_score)};
            const rated=funds.filter(f=>scoreVal(f)!=null).length;
            const vals=funds.map(scoreVal).filter(v=>v!=null);
            text('heatFunds',funds.length);text('heatRated',rated);text('heatCoverage',funds.length?Math.round(rated/funds.length*100)+'%':'0%');text('heatTop',vals.length?Math.max(...vals).toFixed(1):'—');text('heatCats',gs.length);text('heatMode',state.heatCategory?'CATEGORY':'MARKET');
            const back=$('heatBack'),all=$('heatAll');if(back)back.style.display=state.heatCategory?'inline-block':'none';if(all)all.classList.toggle('active',!state.heatCategory);
            if(!gs.length){canvas.innerHTML='<div class="loading">لا توجد بيانات مطابقة للفلاتر الحالية.</div>';return}
            const active=state.heatCategory?gs.filter(g=>g.name===state.heatCategory):gs;
            const list=state.heatCategory&&active[0]?[active[0]]:gs;
            const total=list.reduce((n,g)=>n+g.funds.length,0)||1;
            canvas.style.display='flex';canvas.style.flexWrap='wrap';canvas.style.alignContent='stretch';canvas.style.gap='3px';canvas.style.overflow='hidden';
            const H=Math.max(220,canvas.clientHeight||590);
            list.forEach(g=>{
              const sec=document.createElement('section');sec.className='sector-box';
              const share=g.funds.length/total;
              sec.style.position='relative';sec.style.flex='0 0 '+(state.heatCategory?'100%':Math.max(12,Math.sqrt(share)*100))+'%';sec.style.height=(state.heatCategory?'100%':Math.max(105,Math.sqrt(share)*H*.92))+'px';sec.style.boxSizing='border-box';
              const title=document.createElement('div');title.className='sector-title';title.innerHTML='<b>'+esc(g.name)+'</b><span>'+g.funds.length+' funds</span>';sec.appendChild(title);
              const body=document.createElement('div');body.className='sector-tiles';body.style.position='absolute';body.style.left='4px';body.style.right='4px';body.style.top='34px';body.style.bottom='4px';sec.appendChild(body);
              const fs=g.funds.slice().sort((a,b)=>(scoreVal(b)??-1)-(scoreVal(a)??-1));
              const cols=Math.max(1,Math.ceil(Math.sqrt(fs.length)));const rows=Math.ceil(fs.length/cols);const cw=100/cols,ch=100/rows;
              fs.forEach((f,i)=>{
                const tile=document.createElement('a');tile.className='fund-tile';tile.href='./fund.html?id='+encodeURIComponent(S(f.fund_id));
                tile.style.left=(i%cols)*cw+'%';tile.style.top=Math.floor(i/cols)*ch+'%';tile.style.width=Math.max(.1,cw-.6)+'%';tile.style.height=Math.max(.1,ch-.8)+'%';
                const v=scoreVal(f);tile.style.background=scoreColor(v);if(v==null)tile.classList.add('unrated');tile.title=S(f.canonical_name)+(v==null?'':' · SmartScore '+v.toFixed(1));
                tile.innerHTML='<span class="name">'+esc(f.canonical_name||'Unnamed Fund')+'</span><span class="scorev">'+(v==null?'—':v.toFixed(1))+'</span><span class="meta">'+(v==null?'Not Rated':'SmartScore')+'</span>';body.appendChild(tile);
              });
              sec.ondblclick=()=>{if(!state.heatCategory){state.heatCategory=g.name;render()}};
              canvas.appendChild(sec);
            });
          }
          function renderList'''
          ns,n=re.subn(r'function renderHeatmap\(.*?\}\s*function renderList',new,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('renderHeatmap boundary not found')
          p.write_text(ns,encoding='utf-8')
          PY
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/categories.html
          git commit -m 'Rebuild fund universe heatmap rendering' || true
          git push
          rm -f .github/workflows/repair-categories-heatmap-v2.yml
          git add -A
          git commit -m 'Remove temporary heatmap repair workflow' || true
          git push
