name: Quality gate

on:
  workflow_call:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Baseline
        run: python scripts/verify_baseline.py

      - name: Frontend boundaries
        run: python scripts/verify_frontend_boundaries.py

      - name: Platform identity
        run: python scripts/verify_platform_identity.py

      - name: Typography contract (Cairo only)
        run: python scripts/verify_typography.py

      - name: Chart identity
        run: python scripts/verify_chart_identity.py

      - name: Frontend production contract
        run: python scripts/verify_frontend_production_contract.py

      - name: Release candidate
        run: python scripts/verify_release_candidate.py

      - name: Release readiness
        run: python scripts/verify_release_readiness.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax
        run: |
          set -euo pipefail
          for file in web/js/*.js web/js/data/*.js; do node --check "$file"; done

      - name: Build check
        run: node scripts/build_check.mjs

      - name: Financial contracts
        run: python scripts/verify_financial_contracts.py

      - name: Categories contract
        run: python scripts/verify_categories_contract.py

      - name: Funds contract
        run: python scripts/verify_funds_contract.py

      - name: Fund detail contract
        run: python scripts/verify_fund_detail_contract.py

      - name: Fund detail CSS architecture
        run: python scripts/verify_fund_detail_css_architecture.py

      - name: Fund CSS ownership
        run: python scripts/verify_fund_css_ownership.py

      - name: Macro contract
        run: python scripts/verify_macro_contract.py

      - name: Map contract
        run: python scripts/verify_map_contract.py

      - name: Home contract
        run: python scripts/verify_home_contract.py
