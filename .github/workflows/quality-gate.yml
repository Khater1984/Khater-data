name: Quality gate

on:
  pull_request:
  push:
    branches: [main, 'dev/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Python syntax
        run: python -m compileall -q scripts
      - name: Check JSON and local assets
        run: python scripts/verify_baseline.py
      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          for file in web/js/*.js web/js/data/*.js; do node --check "$file"; done
          python scripts/check_inline_js.py
      - name: Check financial data contract
        run: python scripts/verify_financial_contracts.py
      - name: Check project build contract
        run: node scripts/build_check.mjs
