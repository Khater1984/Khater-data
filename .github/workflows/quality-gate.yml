name: Quality gate

on:
  pull_request:
  push:
    branches: [main, 'dev/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check Python syntax
        run: python -m compileall -q scripts
      - name: Check JSON and local assets
        run: python scripts/verify_baseline.py
      - name: Audit generated snapshot references
        run: python scripts/audit_data_sources.py
      - name: Audit frontend references and orphan candidates
        run: python scripts/audit_frontend_references.py
      - name: Audit frontend data boundaries
        run: python scripts/verify_frontend_boundaries.py
      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          for file in web/js/*.js web/js/data/*.js; do node --check "$file"; done
          python scripts/check_inline_js.py
      - name: Check financial data contract
        run: python scripts/verify_financial_contracts.py
      - name: Check Categories architecture contract
        run: python scripts/verify_categories_contract.py
      - name: Check Funds architecture contract
        run: python scripts/verify_funds_contract.py
      - name: Check Macro architecture contract
        run: python scripts/verify_macro_contract.py
      - name: Check Map architecture contract
        run: python scripts/verify_map_contract.py
      - name: Check Home architecture contract
        run: python scripts/verify_home_contract.py
      - name: Check project build contract
        run: node scripts/build_check.mjs
