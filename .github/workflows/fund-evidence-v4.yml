name: Fund evidence v4
on:
  push:
    paths: ['.github/workflows/fund-evidence-v4.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch fund profile evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('web/fund.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- FUND_EVIDENCE_DB_V4 -->'
          if marker in s:
              raise SystemExit('Evidence DB v4 already installed')
          patch=r'''<!-- FUND_EVIDENCE_DB_V4 -->
<script>
(function(){
  const esc=v=>String(v==null?'—':v).replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));
  const pretty=v=>{try{return JSON.stringify(v,null,2)}catch(e){return String(v)}};
  async function loadEvidence(){
    try{
      if(!window.KHATER||!window.KHATER.url||!window.KHATER.key)return;
      const q=new URLSearchParams(location.search);
      const id=q.get('id')||q.get('fund_id')||q.get('fund');
      if(!id)return;
      const base=window.KHATER.url.replace(/\/$/,'');
      const url=base+'/rest/v1/smartscore_evaluations?fund_id=eq.'+encodeURIComponent(id)+'&methodology_version=eq.V3.0&select=evaluation_id,fund_id,report_date,category,methodology_version,performance_score,risk_score,benchmark_score,consistency_score,inflation_score,smartscore,effective_weights,component_availability,data_confidence,peer_cohort_size,raw_rank,qualified_rank,qualification_status,calculation_inputs,warnings,calculated_at,data_tier,track_factor,final_score,rating,score_explanation,data_quality&order=report_date.desc,calculated_at.desc&limit=1';
      const r=await fetch(url,{headers:{apikey:window.KHATER.key,Authorization:'Bearer '+window.KHATER.key}});
      if(!r.ok)throw new Error('evaluation request failed: '+r.status);
      const a=await r.json(),e=a[0];
      const host=document.createElement('section');
      host.className='section';host.id='evidence-db-v4';
      if(!e){host.innerHTML='<div class="section-head"><h2 class="section-title"><span class="section-no">07</span>دليل التقييم</h2></div><div class="empty">لا يوجد تقييم محفوظ لهذا الصندوق في الإصدار V3.0.</div>';document.querySelector('.dna')?.appendChild(host);return;}
      const weights=e.effective_weights,availability=e.component_availability;
      host.innerHTML='<div class="section-head"><div><h2 class="section-title"><span class="section-no">07</span>دليل التقييم</h2><div class="section-note">المصدر: smartscore_evaluations — سجل محفوظ في قاعدة البيانات، دون إعادة احتساب</div></div><div class="section-note">'+esc(e.report_date||e.calculated_at)+'</div></div>'+''+
      '<div class="card" style="padding:18px"><div class="integrity">'+
      '<div class="integrity-item"><span class="k">Methodology</span><span class="v">'+esc(e.methodology_version)+'</span></div>'+''+
      '<div class="integrity-item"><span class="k">Data Quality</span><span class="v">'+esc(e.data_quality)+'</span></div>'+''+
      '<div class="integrity-item"><span class="k">Peer Cohort</span><span class="v">'+esc(e.peer_cohort_size)+'</span></div>'+''+
      '<div class="integrity-item"><span class="k">Qualified Rank</span><span class="v">'+esc(e.qualified_rank)+'</span></div>'+''+
      '<div class="integrity-item"><span class="k">Raw Rank</span><span class="v">'+esc(e.raw_rank)+'</span></div>'+''+
      '<div class="integrity-item"><span class="k">Data Confidence</span><span class="v">'+esc(e.data_confidence)+'</span></div>'+''+
      '<div class="integrity-item"><span class="k">Data Tier</span><span class="v">'+esc(e.data_tier)+'</span></div>'+''+
      '<div class="integrity-item"><span class="k">Track Factor</span><span class="v">'+esc(e.track_factor)+'</span></div>'+''+
      '</div><div class="evidence-side" style="margin-top:10px">'+
      '<details open><summary>Effective Weights</summary><pre>'+esc(pretty(weights))+'</pre></details>'+''+
      '<details><summary>Component Availability</summary><pre>'+esc(pretty(availability))+'</pre></details>'+''+
      '<details><summary>Calculation Inputs</summary><pre>'+esc(pretty(e.calculation_inputs))+'</pre></details>'+''+
      '<details><summary>Warnings</summary><pre>'+esc(pretty(e.warnings))+'</pre></details>'+''+
      '<details><summary>Score Explanation</summary><pre>'+esc(pretty(e.score_explanation))+'</pre></details>'+''+
      '<details><summary>Evaluation Record</summary><pre>'+esc(pretty({evaluation_id:e.evaluation_id,fund_id:e.fund_id,report_date:e.report_date,category:e.category,methodology_version:e.methodology_version,performance_score:e.performance_score,risk_score:e.risk_score,benchmark_score:e.benchmark_score,consistency_score:e.consistency_score,inflation_score:e.inflation_score,smartscore:e.smartscore,final_score:e.final_score,rating:e.rating,qualification_status:e.qualification_status,calculated_at:e.calculated_at,data_quality:e.data_quality}))+'</pre></details>'+''+
      '</div></div>';
      const dna=document.querySelector('.dna');(dna||document.body).appendChild(host);
    }catch(err){console.warn('FUND_EVIDENCE_DB_V4',err);}
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',loadEvidence);else loadEvidence();
})();
</script>
'''
          if '</body>' not in s: raise SystemExit('body marker not found')
          s=s.replace('</body>',patch+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/fund.html
          git commit -m 'feat: add database-backed fund evaluation evidence'
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/fund-evidence-v4.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'chore: remove temporary evidence workflow v4'
          git push || true
