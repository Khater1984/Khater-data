name: Repair categories navigation

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match shared navigation CSS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('web/categories.html')
          s = p.read_text(encoding='utf-8')
          old = '.nav{display:flex;align-items:stretch;gap:6px;padding:5px;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.025);border-radius:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.025)}.nav a{position:relative;display:flex;align-items:center;justify-content:center;flex:0 0 128px;width:128px;min-width:128px;height:40px;box-sizing:border-box;color:var(--muted);text-decoration:none;font-size:12px;font-weight:700;padding:0 10px;border-radius:10px;border:1px solid transparent;transition:color .2s ease,background .2s ease,box-shadow .2s ease;white-space:nowrap;line-height:1}.nav a:hover{color:var(--text);background:rgba(255,255,255,.055)}.nav a:focus-visible{outline:2px solid rgba(217,173,74,.75);outline-offset:2px}.nav a.active{color:#11151a;background:var(--gold);border-color:var(--gold);box-shadow:0 5px 16px rgba(217,173,74,.22),inset 0 1px 0 rgba(255,255,255,.28);font-weight:700}.nav a.active:after{content:"";position:absolute;left:22%;right:22%;bottom:3px;height:2px;border-radius:2px;background:rgba(17,21,26,.7)}'
          new = '.nav{display:flex;gap:6px;font-size:13.5px;color:var(--muted)}.nav a{position:relative;display:flex;align-items:center;justify-content:center;flex:0 0 128px;width:128px;min-width:128px;height:40px;box-sizing:border-box;color:var(--muted);text-decoration:none;font-size:12px;font-weight:700;padding:0 10px;border-radius:10px;border:1px solid transparent;transition:color .2s ease,background .2s ease,box-shadow .2s ease;white-space:nowrap;line-height:1}.nav a:hover{color:var(--text);background:rgba(255,255,255,.055)}.nav a:focus-visible{outline:2px solid rgba(214,180,106,.75);outline-offset:2px}.nav a.active{color:#11151a;background:var(--gold);border-color:var(--gold);box-shadow:0 5px 16px rgba(214,180,106,.22),inset 0 1px 0 rgba(255,255,255,.28);font-weight:700}.nav a.active:after{content:"";position:absolute;left:22%;right:22%;bottom:3px;height:2px;border-radius:2px;background:rgba(17,21,26,.7)}'
          if old not in s:
              raise SystemExit('Expected navigation CSS not found; no change made.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/categories.html
          git diff --cached --quiet || (git commit -m 'fix: match categories navigation to shared nav' && git push)
